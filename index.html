<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Amaya Exchange</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
padding:0;
background:#f5f7fa;
color:#172033;
font-family:Arial,sans-serif
}

body{
min-height:100vh
}

button,input,select{
font:inherit
}

button{
cursor:pointer
}

.hidden{
display:none!important
}

.app{
width:100%;
max-width:520px;
margin:auto;
min-height:100vh
}

/* HEADER */

.header{
background:#fff;
padding:14px 15px;
border-bottom:1px solid #e7e9ed;
position:sticky;
top:0;
z-index:20
}

.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.logo{
font-size:19px;
font-weight:800
}

.user-info{
font-size:11px;
color:#858e9d;
margin-top:3px
}

.logout{
border:0;
background:#eef0f3;
color:#303744;
border-radius:9px;
padding:8px 11px;
font-size:11px;
font-weight:700
}

/* TABS */

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
padding:11px 14px 5px;
background:#f5f7fa
}

.tab{
border:0;
height:43px;
border-radius:11px;
background:#e7ebf0;
color:#687284;
font-size:12px;
font-weight:800
}

.tab.active{
background:#111827;
color:#fff
}

/* CONTENT */

.content{
padding:10px 14px 25px
}

.panel{
display:none
}

.panel.active{
display:block
}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 3px 15px rgba(0,0,0,.045)
}

/* FORM */

.field{
margin-bottom:13px
}

.label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px
}

input,select{
width:100%;
height:47px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
padding:0 12px;
outline:0;
color:#172033
}

input:focus,
select:focus{
border-color:#111827
}

.amount{
font-size:17px!important;
font-weight:700
}

/* KD + BD */

.amount-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.amount-row .field{
min-width:0
}

/* TYPE */

.type-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:3px 0 13px
}

.type-btn{
height:44px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
font-weight:800
}

.type-btn.active{
background:#111827;
color:#fff;
border-color:#111827
}

/* SAVE */

.save{
width:100%;
height:49px;
border:0;
border-radius:12px;
background:#111827;
color:#fff;
font-weight:800
}

.save:disabled{
opacity:.55
}

.msg{
font-size:12px;
margin-top:9px;
text-align:center
}

.error{
color:#d33131
}

.success{
color:#16824c
}

/* CUSTOMER FILTER */

.customer-filter-row{
display:grid;
grid-template-columns:.8fr 1.2fr;
gap:7px;
margin-bottom:9px
}

.customer-filter-row input,
.customer-filter-row select{
height:42px;
font-size:12px;
padding:0 9px
}

/* TOTAL DUE */

.total-due-box{
background:#111827;
border-radius:12px;
padding:9px 12px;
margin-bottom:10px;
text-align:left
}

.total-due-label{
font-size:10px;
color:#c8ced8;
margin-bottom:2px
}

.total-due-value{
font-size:17px;
font-weight:800;
color:#fff
}

.total-due-value span{
font-size:9px;
font-weight:700
}

/* CUSTOMER CARD */

.list{
display:flex;
flex-direction:column;
gap:8px
}

.customer-card{
background:#fff;
border-radius:11px;
padding:9px 11px;
box-shadow:0 2px 9px rgba(0,0,0,.04);
border:1px solid #edf0f3
}

.customer-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.customer-info{
min-width:0;
flex:1
}

.customer-name{
font-size:13px;
font-weight:800;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.phone{
font-size:10px;
color:#858e9d;
margin-top:2px
}

.due{
text-align:right;
white-space:nowrap
}

.due-label{
font-size:9px;
color:#8992a0
}

.due-value{
font-size:14px;
font-weight:800;
margin-top:1px
}

.kd-small{
font-size:9px
}

#customerList{
max-height:calc(100vh - 300px);
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-right:2px
}

/* TRANSACTION */

.txn{
background:#fff;
border-radius:11px;
padding:10px;
box-shadow:0 2px 9px rgba(0,0,0,.04)
}

.txn-top{
display:flex;
justify-content:space-between;
gap:8px
}

.txn-date{
font-size:11px;
color:#858e9d
}

.txn-amount{
font-size:13px;
font-weight:800
}

.txn-bottom{
font-size:10px;
color:#737d8d;
margin-top:4px
}

/* AGENT FILTER */

.agent-filter-row{
display:grid;
grid-template-columns:.72fr 1fr 1.28fr;
gap:6px;
margin-bottom:9px
}

.agent-filter-row select{
height:42px;
font-size:11px;
padding:0 7px;
min-width:0
}

/* AGENT BALANCE / SALES */

.agent-summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-bottom:9px
}

.agent-summary-box{
background:#fff;
border-radius:11px;
padding:8px 10px;
border:1px solid #edf0f3;
box-shadow:0 2px 8px rgba(0,0,0,.035)
}

.agent-summary-label{
font-size:9px;
color:#8992a0;
margin-bottom:2px
}

.agent-summary-value{
font-size:15px;
font-weight:800;
line-height:1.2
}

.agent-summary-value span{
font-size:9px;
font-weight:700
}

.agent-balance{
text-align:left
}

.agent-sales{
text-align:right
}

#agentList{
max-height:calc(100vh - 265px);
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-right:2px
}

/* AGENT */

.agent-card{
background:#fff;
border-radius:11px;
padding:10px;
box-shadow:0 2px 9px rgba(0,0,0,.04)
}

.agent-name{
font-size:13px;
font-weight:800
}

.agent-phone{
font-size:10px;
color:#858e9d;
margin-top:3px
}

/* LOGIN */

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.login-box{
width:100%;
max-width:390px;
background:#fff;
border-radius:21px;
padding:25px 21px;
box-shadow:0 8px 30px rgba(0,0,0,.06)
}

.login-title{
font-size:24px;
font-weight:800
}

.login-sub{
font-size:13px;
color:#8992a0;
margin:5px 0 23px
}

.loading,
.empty{
padding:28px 10px;
text-align:center;
color:#8992a0;
font-size:13px
}

@media(max-width:360px){

.tabs{
gap:5px
}

.tab{
font-size:11px
}

.amount-row,
.customer-filter-row{
gap:6px
}

.customer-filter-row input,
.customer-filter-row select{
font-size:11px;
padding:0 7px
}

.agent-filter-row{
gap:4px
}

.agent-filter-row select{
font-size:10px;
padding:0 5px
}

.agent-summary-value{
font-size:14px
}

}

</style>

</head>

<body>

<!-- APP -->

id="app"
class="app hidden">


<!-- HEADER -->

<div class="header-row">

<div>

<div class="logo">

id="userInfo"
class="user-info">

<script>

/* =====================================================
API
===================================================== */

const API='https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';


/* =====================================================
STATE
===================================================== */

let currentUser=null;

let transactionType='বাকি';

let customerData=[];

let agentData=[];

let notesData={
dueNotes:[],
paymentNotes:[]
};

let currentAgentTransactions=[];


/* =====================================================
GET API
===================================================== */

async function getAPI(action,params={}){

const query=new URLSearchParams();

query.set('action',action);

for(const key in params){

const value=params[key];

if(value!==undefined &&
value!==null &&
value!==''){

query.set(key,value);

}

}

const response=await fetch(
API+'?'+query.toString(),
{
method:'GET',
cache:'no-store'
}
);

return response.json();

}


/* =====================================================
POST API
===================================================== */

async function postAPI(data){

const response=await fetch(
API,
{
method:'POST',
headers:{
'Content-Type':'text/plain;charset=utf-8'
},
body:JSON.stringify(data)
}
);

return response.json();

}


/* =====================================================
TABS
===================================================== */

function openTab(tab,button){

document
.querySelectorAll('.panel')
.forEach(panel=>{
panel.classList.remove('active');
});

document
.querySelectorAll('.tab')
.forEach(btn=>{
btn.classList.remove('active');
});

const panel=document.getElementById(
'panel'+
tab.charAt(0).toUpperCase()+
tab.slice(1)
);

if(panel && !panel.classList.contains('hidden')){
panel.classList.add('active');
}

if(button && !button.classList.contains('hidden')){
button.classList.add('active');
}

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const username=document
.getElementById('username')
.value.trim();

const password=document
.getElementById('password')
.value;

const msg=document
.getElementById('loginMsg');

const btn=document
.getElementById('loginBtn');


if(!username || !password){

msg.className='msg error';
msg.textContent='Username and password required';

return;

}

btn.disabled=true;
btn.textContent='Logging in...';
msg.textContent='';


try{

const result=
await getAPI(
'login',
{
username:username,
password:password
}
);


if(!result.success){

msg.className='msg error';
msg.textContent=
result.error||'Login failed';

return;

}

currentUser=result.data;

localStorage.setItem(
'amaya_user',
JSON.stringify(currentUser)
);

showApp();

}
catch(error){

msg.className='msg error';
msg.textContent='Connection error';

}
finally{

btn.disabled=false;
btn.textContent='Login';

}

}


/* =====================================================
RESTORE LOGIN
===================================================== */

function restoreLogin(){

try{

const saved=
localStorage.getItem('amaya_user');

if(!saved)return;

const user=JSON.parse(saved);

if(user && user.loggedIn){

currentUser=user;
showApp();

}

}
catch(error){

localStorage.removeItem('amaya_user');

}

}


/* =====================================================
SHOW APP
===================================================== */

function showApp(){

document
.getElementById('loginPage')
.classList.add('hidden');

document
.getElementById('app')
.classList.remove('hidden');

document
.getElementById('userInfo')
.textContent=
(currentUser.username||'User')+
(
currentUser.role
?' • '+currentUser.role
:''
);

setToday();

setupAgentDateFilters();

applyRoleAccess();

loadAllData();

}


/* =====================================================
ROLE ACCESS
===================================================== */

function applyRoleAccess(){

const role=
String(currentUser?.role||'')
.trim()
.toLowerCase();

const tabs=
document.querySelectorAll('.tab');

const transactionTab=tabs[0];
const customerTab=tabs[1];
const agentTab=tabs[2];

const transactionPanel=
document.getElementById('panelTransaction');

const customerPanel=
document.getElementById('panelCustomer');

const agentPanel=
document.getElementById('panelAgent');


/* RESET */

transactionTab.classList.remove('hidden');
customerTab.classList.remove('hidden');
agentTab.classList.remove('hidden');

transactionPanel.classList.remove('hidden');
customerPanel.classList.remove('hidden');
agentPanel.classList.remove('hidden');


/* ADMIN */

if(role==='admin'){

openTab('transaction',transactionTab);

return;

}


/* AGENT */

if(role==='agent'){

transactionTab.classList.add('hidden');
customerTab.classList.add('hidden');

transactionPanel.classList.add('hidden');
customerPanel.classList.add('hidden');

agentTab.classList.remove('hidden');
agentPanel.classList.remove('hidden');

openTab('agent',agentTab);

const agentView=
document.getElementById('agentView');

agentView.innerHTML='';

const option=
document.createElement('option');

option.value=
currentUser.linkedId||'';

option.textContent='My Agent';

agentView.appendChild(option);

if(currentUser.linkedId){

agentView.value=
currentUser.linkedId;

agentChanged();

}

return;

}


/* VIEWER */

if(role==='viewar'){

transactionTab.classList.add('hidden');
transactionPanel.classList.add('hidden');

customerTab.classList.remove('hidden');
agentTab.classList.remove('hidden');

customerPanel.classList.remove('hidden');
agentPanel.classList.remove('hidden');

openTab('customer',customerTab);

return;

}


/* UNKNOWN ROLE */

transactionTab.classList.add('hidden');
customerTab.classList.add('hidden');
agentTab.classList.add('hidden');

transactionPanel.classList.add('hidden');
customerPanel.classList.add('hidden');
agentPanel.classList.add('hidden');

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

currentUser=null;

localStorage.removeItem('amaya_user');

document
.getElementById('app')
.classList.add('hidden');

document
.getElementById('loginPage')
.classList.remove('hidden');

document
.getElementById('username')
.value='';

document
.getElementById('password')
.value='';

}


/* =====================================================
TODAY
===================================================== */

function setToday(){

const input=
document.getElementById('date');

const d=new Date();

const today=
d.getFullYear()+
'-'+
String(d.getMonth()+1).padStart(2,'0')+
'-'+
String(d.getDate()).padStart(2,'0');

input.value=today;

input.max=today;

}


/* =====================================================
AGENT YEAR + MONTH
===================================================== */

function setupAgentDateFilters(){

const yearSelect=
document.getElementById('agentYear');

const monthSelect=
document.getElementById('agentMonth');

const now=new Date();

const currentYear=now.getFullYear();

const currentMonth=now.getMonth()+1;


yearSelect.innerHTML='';

for(let y=currentYear-5;y<=currentYear;y++){

const option=
document.createElement('option');

option.value=y;

option.textContent=y;

if(y===currentYear){
option.selected=true;
}

yearSelect.appendChild(option);

}


const months=[
'January',
'February',
'March',
'April',
'May',
'June',
'July',
'August',
'September',
'October',
'November',
'December'
];

monthSelect.innerHTML='';

months.forEach(function(month,index){

const option=
document.createElement('option');

option.value=index+1;

option.textContent=month;

if(index+1===currentMonth){
option.selected=true;
}

monthSelect.appendChild(option);

});


yearSelect.onchange=function(){

if(
document.getElementById('agentView').value
){

renderAgentTransactions();

}

};


monthSelect.onchange=function(){

if(
document.getElementById('agentView').value
){

renderAgentTransactions();

}

};

}


/* =====================================================
LOAD ALL
===================================================== */

function loadAllData(){

loadCustomers();

loadAgents();

loadNotes();

}


/* =====================================================
CUSTOMERS
===================================================== */

async function loadCustomers(){

const list=
document.getElementById('customerList');

list.innerHTML=
'<div class="empty">Select a customer</div>';

try{

const result=
await getAPI('customers');

if(!result.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(
result.error||'Customer loading failed'
)+
'</div>';

return;

}

customerData=
Array.isArray(result.data)
?result.data
:[];


const transactionSelect=
document.getElementById(
'customerSelect'
);

transactionSelect.innerHTML=
'<option value="">Select Customer</option>';

customerData.forEach(function(customer){

const status=String(
customer.status||
customer.Status||
customer.active||
customer.Active||
''
)
.trim()
.toLowerCase();

if(status!=='active'){
return;
}

const option=
document.createElement('option');

option.value=
customer.customerId;

option.textContent=
customer.customerName;

transactionSelect.appendChild(option);

});


updateCustomerDropdown();


let totalDue=0;

customerData.forEach(function(customer){

const status=String(
customer.status||
customer.Status||
customer.active||
customer.Active||
''
)
.trim()
.toLowerCase();

if(status!=='active'){
return;
}

totalDue+=
parseFloat(
String(
customer.totalDueKD||'0'
).replace(/,/g,'')
)||0;

});

document
.getElementById('allCustomerDue')
.innerHTML=
totalDue.toLocaleString(
'en-US',
{
minimumFractionDigits:3,
maximumFractionDigits:3
}
)+
' <span>KD</span>';

}
catch(error){

list.innerHTML=
'<div class="empty">Customer loading error</div>';

}

}


/* =====================================================
CUSTOMER DROPDOWN
===================================================== */

function updateCustomerDropdown(){

const select=
document.getElementById(
'customerPageSelect'
);

const search=
document.getElementById(
'customerSearch'
)
.value
.trim()
.toLowerCase();

const oldValue=select.value;

select.innerHTML=
'<option value="">Select Customer</option>';

customerData.forEach(function(customer){

const status=String(
customer.status||
customer.Status||
customer.active||
customer.Active||
''
)
.trim()
.toLowerCase();

if(status!=='active'){

async function loadCustomerTransactions(customerId){

'customerList'
);

loading.id='customerTxnLoading';

loading.className='loading';

loading.textContent='Loading transactions...';

'customerTransactions',
{

}
);

document.getElementById(
'customerTxnLoading'
);

}

if(!result.success){

const box=
document.createElement('div');

box.className='empty';

result.error||
'Unable to load transactions';

list.appendChild(box);

return;

}

const transactions=
Array.isArray(result.data)
?result.data
:(
result.data &&
Array.isArray(result.data.transactions)
?result.data.transactions
:[]
);

if(!transactions.length){

document.createElement('div');

document.createElement('div');

document.createElement('div');

top.className='txn-top';

document.createElement('div');

date.className='txn-date';

document.createElement('div');

amount.textContent=
(t.kdAmount||'0.000')+' KD';

top.appendChild(date);

top.appendChild(amount);

const bottom=
document.createElement('div');

bottom.className='txn-bottom';

let text=t.type||'';

if(t.note){
text+=' • '+t.note;
}

if(t.bdAmount){

}

bottom.textContent=text;

txn.appendChild(top);

txn.appendChild(bottom);

list.appendChild(txn);

});

}
catch(error){

const loading=
document.getElementById(
'customerTxnLoading'
);

if(loading){
loading.remove();
}

document.createElement('div');

box.className='empty';

box.textContent='Connection error';

list.appendChild(box);

}

}

/* =====================================================
NORMALIZE TYPE
===================================================== */

function normalizeType(value){

return String(value||'')
.trim()
.toLowerCase()
.replace(/\s+/g,' ')
.replace(/^[+\-]\s*/,'')
.trim();

}


/* =====================================================
IS DUE
===================================================== */

function isDueTransaction(t){

const type=normalizeType(
t.type||
t.Type||
t.transactionType||
t.TransactionType||
''
);

return(
type==='বাকি' ||
type==='due' ||
type==='due amount' ||
type==='+ বাকি'
);

}


/* =====================================================
IS PAYMENT
===================================================== */

function isPaymentTransaction(t){

const type=normalizeType(
t.type||
t.Type||
t.transactionType||
t.TransactionType||
''
);

return(
type==='পেমেন্ট' ||
type==='payment' ||
type==='জমা' ||
type==='paid' ||
type==='payment amount'
);

}


/* =====================================================
GET KD AMOUNT
===================================================== */

function getKDAmount(t){

let value=t.kdAmount;

if(value===undefined||value===null||value===''){
value=t.amountKD;
}

if(value===undefined||value===null||value===''){
value=t.kd;
}

if(value===undefined||value===null||value===''){
value=t.amount;
}

return parseFloat(
String(value||'0')
.replace(/,/g,'')
.trim()
)||0;

}


/* =====================================================
GET BD AMOUNT
===================================================== */

function getBDAmount(t){

let value=t.bdAmount;

if(value===undefined||value===null||value===''){
value=t.amountBD;
}

if(value===undefined||value===null||value===''){
value=t.bd;
}

return parseFloat(
String(value||'0')
.replace(/,/g,'')
.trim()
)||0;

}

/* =====================================================
AGENT SUMMARY
===================================================== */

function calculateAgentSummary(){

let currentBalance=0;
let monthlySales=0;

const year=
Number(
document.getElementById('agentYear').value
);

const month=
Number(
document.getElementById('agentMonth').value
);

currentAgentTransactions.forEach(function(t){

const amount=getBDAmount(t);

if(isDueTransaction(t)){

currentBalance+=amount;

}
else if(isPaymentTransaction(t)){

currentBalance-=amount;

}

});


currentAgentTransactions.forEach(function(t){

if(!isDueTransaction(t)){
return;
}

const dateInfo=
parseTransactionDate(
t.date||
t.Date||
t.transactionDate||
t.TransactionDate
);

if(
!dateInfo ||
dateInfo.year!==year ||
dateInfo.month!==month
){

return;

}

monthlySales+=getBDAmount(t);

});


document
.getElementById('agentCurrentBalance')
.innerHTML=
formatNumber(currentBalance)+
' <span>Tk</span>';

document
.getElementById('agentMonthlySales')
.innerHTML=
formatNumber(monthlySales)+
' <span>Tk</span>';

}

/* =====================================================
PARSE TRANSACTION DATE
===================================================== */

function parseTransactionDate(value){

if(!value){
return null;
}

const str=
String(value).trim();

let match=
str.match(
/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{4})$/
);

if(match){

const months={
jan:1,
feb:2,
mar:3,
apr:4,
may:5,
jun:6,
jul:7,
aug:8,
sep:9,
oct:10,
nov:11,
dec:12
};

const month=
months[
match[2].toLowerCase()
];

if(month){

return{
year:Number(match[3]),
month:month
};

}

}

match=
str.match(
/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);

if(match){

return{
year:Number(match[1]),
month:Number(match[2])
};

}

match=
str.match(
/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
);

if(match){

return{
year:Number(match[3]),
month:Number(match[2])
};

}

const date=new Date(str);

if(!isNaN(date.getTime())){

return{
year:date.getFullYear(),
month:date.getMonth()+1
};

}

return null;

}

/* =====================================================
SAVE TRANSACTION
===================================================== */

async function saveTransaction(){

if(
String(currentUser?.role||'')
.toLowerCase()!=='admin'
){

showSaveError('Access denied');

return;

}

const date=
document.getElementById('date').value;

const agentId=
document.getElementById('agentSelect').value;

const customerId=
document.getElementById('customerSelect').value;

const kd=
parseFloat(
document
.getElementById('kdAmount')
.value
.replace(/,/g,'')
)||0;

const bd=
parseFloat(
document
.getElementById('bdAmount')
.value
.replace(/,/g,'')
)||0;

const note=
document
.getElementById('noteSelect')
.value;


if(!date){

showSaveError('Date required');
return;

}

if(kd>0&&!customerId){

showSaveError(
'KD Amount দিলে Customer নির্বাচন করুন'
);

return;

}

if(bd>0&&!agentId){

showSaveError(
'BD Amount দিলে Agent নির্বাচন করুন'
);

return;

}

if(kd<=0&&bd<=0){

showSaveError(
'KD অথবা BD Amount দিন'
);

return;

}

const selectedDate=
new Date(date+'T00:00:00');

const today=new Date();

today.setHours(0,0,0,0);

if(selectedDate>today){

showSaveError(
'Future date দেওয়া যাবে না'
);

return;

}

let agentName='';

if(agentId){

const agent=
agentData.find(function(a){

return String(a.agentId)===
String(agentId);

});

if(agent){
agentName=agent.agentName;
}

}

let customerName='';

if(customerId){

const customer=
customerData.find(function(c){

return String(c.customerId)===
String(customerId);

});

if(customer){
customerName=customer.customerName;
}

}

const button=
document.getElementById('saveBtn');

const message=
document.getElementById('saveMsg');

button.disabled=true;

button.textContent='Saving...';

message.textContent='';

message.className='msg';

try{

const result=
await postAPI({

action:'addTransaction',

username:currentUser?.username||'',

role:currentUser?.role||'',

date:formatDate(date),

customerId:customerId,

customerName:customerName,

agentName:agentName,

kdAmount:kd,

bdAmount:bd,

type:transactionType,

note:note

});


if(!result.success){

showSaveError(
result.error||'Save failed'
);

return;

}

message.className='msg success';

message.textContent=
'Transaction saved successfully';

document
.getElementById('kdAmount')
.value='';

document
.getElementById('bdAmount')
.value='';

await loadCustomers();

const selectedAgent=
document
.getElementById('agentView')
.value;

if(selectedAgent){

await agentChanged();

}

setTimeout(function(){

message.textContent='';

message.className='msg';

},2500);

}
catch(error){

showSaveError(
'Connection error'
);

}
finally{

button.disabled=false;

button.textContent='✅ Save';

}

}

const message=
document.getElementById('saveMsg');

}


/* =====================================================
DATE FORMAT
===================================================== */

function formatDate(value){

const parts=value.split('-');

const months=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];

return(
parts[2]+'-'+
months[Number(parts[1])-1]+'-'+
parts[0]
);

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

return String(
value===null||value===undefined
?''
:value
)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}
