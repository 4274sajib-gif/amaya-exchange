<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f5f7fa;color:#172033;font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{width:100%;max-width:520px;margin:auto;min-height:100vh}
.header{background:#fff;padding:14px 15px;border-bottom:1px solid #e7e9ed;position:sticky;top:0;z-index:20;overflow:visible}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:visible}
.logo{font-size:19px;font-weight:800}
.tagline{font-size:11px;color:#858e9d;margin-top:4px}
.logout{border:0;background:#fff1f1;color:#d66b6b;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700}
.header-rate-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-rate{position:relative;width:120px;flex-shrink:0}
.header-rate-input{width:100%;height:34px;border:1px solid #dfe3e9;border-radius:18px;background:#EFF6FF;padding:0 10px;outline:0;color:#172033;font-size:11px;font-weight:600}
.header-rate-popup{position:absolute;left:-10px;right:-45px;top:calc(100% + 7px);background:#111827;color:#fff;border-radius:10px;padding:12px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;opacity:0;visibility:hidden;transform:translateY(7px);transition:opacity .18s ease,transform .18s ease,visibility .18s ease;box-shadow:0 5px 16px rgba(0,0,0,.18);z-index:100}
.header-rate-popup.show{opacity:1;visibility:visible;transform:translateY(0)}
.header-rate-left{min-width:0}
.header-rate-label{color:#aeb8c7;font-size:8px;line-height:1;margin-bottom:2px}
.header-rate-amount{font-size:12px;font-weight:700;white-space:nowrap}
.header-rate-right{text-align:right;flex-shrink:0}
.header-rate-kd{font-size:15px;font-weight:800;line-height:1;white-space:nowrap}
.header-rate-popup::after{content:"";position:absolute;right:35%;top:-5px;width:10px;height:10px;background:#111827;transform:rotate(45deg)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:11px 14px 5px}
.tab{border:0;height:43px;border-radius:11px;background:#e7ebf0;color:#687284;font-size:12px;font-weight:800}
.tab.active{background:#111827;color:#fff}
.content{padding:10px 14px 25px}
.panel{display:none}
.panel.active{display:block}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px rgba(0,0,0,.045)}
.field{margin-bottom:18px}
.label{display:block;font-size:10px;font-weight:300;margin-bottom:7px}
input,select{width:100%;height:47px;border:1px solid #dfe3e9;border-radius:11px;background:#fff;padding:0 12px;outline:0;color:#172033}
#agentSelect,#customerSelect{font-weight:400}
#agentSelect.has-value,#customerSelect.has-value{font-weight:700}
input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08),0 4px 14px rgba(17,24,39,.10);outline:none}
select:disabled{background:#f1f3f6;color:#4b5563;opacity:1;cursor:not-allowed}
.amount{font-size:14px!important;font-weight:700}
.amount-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:3px 0 13px}
.type-btn{height:44px;border:1px solid #dfe3e9;border-radius:11px;background:#fff;font-weight:800}
.type-btn.active{background:#111827;color:#fff;border-color:#111827}
.save{width:100%;height:50px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:13px;font-weight:800;letter-spacing:.2px}
.save:active{transform:scale(.98)}
.save:disabled{opacity:.55;cursor:not-allowed}
.msg{font-size:12px;margin-top:9px;text-align:center}
.error{color:#d33131}
.success{color:#16824c}
.profit-popup{position:absolute;right:0;bottom:60px;background:#111827;color:#fff;border-radius:10px;padding:7px 11px;font-size:11px;font-weight:800;line-height:1;box-shadow:0 5px 16px rgba(0,0,0,.16);opacity:0;visibility:hidden;transform:translateY(5px) scale(.96);transition:opacity .15s ease,transform .15s ease,visibility .15s ease;z-index:30;pointer-events:none;white-space:nowrap}
.profit-popup.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.profit-popup::after{content:"";position:absolute;right:20px;bottom:-5px;width:10px;height:10px;background:#111827;transform:rotate(45deg)}
.customer-filter-card{background:#fff;border-radius:14px;padding:10px;margin-bottom:9px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.customer-filter-row{display:grid;grid-template-columns:1fr 105px 1.25fr;gap:6px;align-items:center;margin-bottom:7px}
.customer-filter-row input,.customer-filter-row select{height:36px;font-size:11px;padding:0 8px;border-radius:9px}
.customer-date-wrap{position:relative;width:100%}
.customer-date{width:100%;height:36px;border-radius:9px;font-size:11px;padding:0 8px;background:#fff;border:1px solid #dfe3e9;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:none!important}
.customer-selected-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;min-height:38px}
.selected-customer{min-width:0}
.selected-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selected-phone{font-size:12px;color:#858e9d;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-amount-box{background:#f1f3f6;border-radius:9px;padding:6px 8px;min-width:82px;text-align:center;flex-shrink:0}
.due-amount-label{font-size:10px;color:#858e9d;margin-bottom:1px}
.due-amount-value{font-size:13px;font-weight:800;color:#172033;line-height:1.1;white-space:nowrap}
.due-amount-value span{font-size:8px;font-weight:700}
.total-due-box{background:#111827;border-radius:9px;padding:6px 9px;min-width:105px;text-align:center;flex-shrink:0}
.total-due-label{font-size:10px;color:#c8ced8;margin-bottom:1px}
.total-due-value{font-size:14px;font-weight:800;color:#fff;line-height:1.1;white-space:nowrap}
.total-due-value span{font-size:8px;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
#customerList{max-height:calc(100vh - 300px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:1px}
.txn{background:#fff;border-radius:11px;padding:10px 11px;box-shadow:0 1px 6px rgba(0,0,0,.035);border:1px solid #edf0f3;border-left:4px solid #dfe3e9;position:relative}
.txn.sale{border-left-color:#111827}
.txn.sale .txn-type,.txn.sale .txn-amount{color:#111827}
.txn.payment{border-left-color:#f3a6a6;background:#fff5f5;border-left:4px solid #f3a6a6;border-top:1px solid #fde1e1;border-right:1px solid #fde1e1;border-bottom:1px solid #fde1e1}
.txn-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.txn-date{font-size:11px;color:#858e9d}
.txn-type{font-size:10px;font-weight:800;line-height:10px}
.txn.payment .txn-type,.txn.payment .txn-amount{color:#d66b6b}
.txn-amount{font-size:14px;font-weight:800;margin-top:4px}
.txn-bottom{font-size:9px;color:#858e9d!important;font-weight:400!important;margin-top:4px;padding-right:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-agent{position:absolute;right:11px;bottom:10px;font-size:9px;font-weight:600;color:#858e9d;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.agent-filter-row{display:grid;grid-template-columns:.65fr .85fr 1.25fr;gap:5px;margin-bottom:8px}
.agent-filter-row select{height:34px;font-size:10px;padding:0 6px;border-radius:8px;min-width:0}
.agent-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.agent-summary-box{background:#111827;color:#fff;border-radius:10px;padding:8px 9px;border:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.agent-summary-label{font-size:10px;color:#c8ced8;margin-bottom:2px}
.agent-summary-value{font-size:14px;font-weight:800;line-height:1.2;color:#fff}
.agent-summary-value span{font-size:8px;font-weight:700;color:#c8ced8}
.agent-balance{text-align:left}
.agent-sales{text-align:right}
#agentList{max-height:calc(100vh - 250px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:1px}
#agentList .txn{padding:10px 11px;border-radius:11px;border-left-width:4px}
#agentList .txn-date,#agentList .txn-type{font-size:10px}
#agentList .txn-amount{font-size:14px;margin-top:4px}
#agentList .txn-bottom{font-size:9px;margin-top:4px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:390px;background:#fff;border-radius:21px;padding:25px 21px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.login-title{font-size:24px;font-weight:800}
.login-sub{font-size:13px;color:#8992a0;margin:5px 0 23px}
.loading,.empty{padding:22px 10px;text-align:center;color:#8992a0;font-size:11px}
.sync-status{position:fixed;right:10px;bottom:10px;background:#111827;color:#fff;border-radius:20px;padding:5px 9px;font-size:8px;opacity:0;transform:translateY(5px);transition:.2s;z-index:200}
.sync-status.show{opacity:.8;transform:translateY(0)}
@media(max-width:360px){
.tabs{gap:5px}
.tab{font-size:11px}
.amount-row{gap:6px}
.customer-filter-row{gap:5px}
.customer-filter-row input,.customer-filter-row select{font-size:10px;padding:0 7px}
.agent-filter-row{gap:4px}
.agent-filter-row select{font-size:9px;padding:0 5px}
.agent-summary-value{font-size:13px}
.total-due-box{min-width:98px}
.due-amount-box{min-width:75px;padding:6px 6px}
.due-amount-value{font-size:12px}
.selected-name{font-size:11px}
.customer-selected-row{gap:5px}
.header{padding:13px 10px}
.logo{font-size:16px}
.tagline{font-size:9px}
.header-rate-wrap{gap:4px}
.header-rate{width:105px}
.header-rate-input{height:31px;font-size:10px;padding:0 8px}
.logout{padding:7px 8px;font-size:10px}
.header-rate-popup{padding:6px 7px}
.header-rate-amount{font-size:11px}
.header-rate-kd{font-size:14px}
}
</style>
</head>
<body>

<!-- Login Section -->
<div id="loginPage" class="login-page">
<div class="login-box">
<div class="login-title">Amaya Exchange</div>
<div class="login-sub">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>
<div class="field">
<label class="label">Username</label>
<input id="username" type="text" autocomplete="username">
</div>
<div class="field">
<label class="label">Password</label>
<input id="password" type="password" autocomplete="current-password">
</div>
<button id="loginBtn" class="save" onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>
</div>
</div>

<!-- App Section -->
<div id="app" class="app hidden">

<!-- Header Section -->
<div class="header">
<div class="header-row">
<div>
<div class="logo">Amaya Exchange</div>
<div class="tagline">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>
</div>
<div class="header-rate-wrap">
<div id="adminRateBox" class="header-rate">
<div id="headerRatePopup" class="header-rate-popup">
<div class="header-rate-left">
<div class="header-rate-label">Amount</div>
<div id="headerRatePopupAmount" class="header-rate-amount">0 Tk</div>
</div>
<div class="header-rate-right">
<div id="headerRatePopupKD" class="header-rate-kd">0.000 KD</div>
</div>
</div>
<input id="headerRateAmount" class="header-rate-input" type="text" inputmode="numeric" autocomplete="off" placeholder="💱 Rate Check" oninput="calculateHeaderRate()">
</div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>
</div>

<!-- Tabs Section -->
<div class="tabs">
<button class="tab active" onclick="openTab('transaction',this)">Add Transaction</button>
<button class="tab" onclick="openTab('customer',this)">Customer</button>
<button class="tab" onclick="openTab('agent',this)">Agent</button>
</div>

<div class="content">

<!-- Transaction Section -->
<section id="panelTransaction" class="panel active">
<div class="card">
<div class="field">
<label class="label">📅 Date</label>
<input id="date" type="date" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off">
</div>
<div class="field">
<label class="label">👨🏻‍💼 Agent</label>
<select id="agentSelect"><option value="">Select Agent</option></select>
</div>
<div class="field">
<label class="label">🤝 Customer</label>
<select id="customerSelect"><option value="">Select Customer</option></select>
</div>
<div class="amount-row">
<div class="field">
<label class="label">🇰🇼 KD Amount</label>
<input id="kdAmount" class="amount" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="দিনার">
</div>
<div class="field">
<label class="label">৳ BD Amount</label>
<input id="bdAmount" class="amount" type="text" inputmode="numeric" placeholder="টাকা">
</div>
<div id="profitPopup" class="profit-popup">Profit 0</div>
</div>
<div class="type-row">
<button id="dueBtn" class="type-btn active" onclick="setType('বাকি')">বাকি</button>
<button id="paymentBtn" class="type-btn" onclick="setType('পেমেন্ট')">পেমেন্ট</button>
</div>
<div class="field">
<label class="label">Note</label>
<select id="noteSelect"><option value="">Select Note</option></select>
</div>
<button id="saveBtn" class="save" onclick="saveTransaction()">💾 Save</button>
<div id="saveMsg" class="msg"></div>
</div>
</section>

<!-- Customer Section -->
<section id="panelCustomer" class="panel">
<div class="customer-filter-card">
<div class="customer-filter-row">
<input id="customerSearch" type="search" placeholder="🔍 Search..." autocomplete="off">
<div class="customer-date-wrap">
<input id="customerTransactionDate" class="customer-date" type="text" autocomplete="off" readonly onclick="openCustomerDatePicker()">
<input id="customerDatePicker" type="date" onchange="selectCustomerDate(this.value)" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;">
</div>
<select id="customerPageSelect">
<option value="">Select Customer</option>
<option value="__ALL_TRANSACTIONS__">All Transaction</option>
</select>
</div>
<div class="customer-selected-row">
<div id="selectedCustomerInfo" class="selected-customer">
<div class="selected-empty">Select a customer</div>
</div>
<div class="due-amount-box">
<div class="due-amount-label">বর্তমান বাকি</div>
<div id="selectedDueAmount" class="due-amount-value">0.000 <span>KD</span></div>
</div>
<div class="total-due-box">
<div class="total-due-label">সর্বমোট বাকি</div>
<div id="allCustomerDue" class="total-due-value">0.000 <span>KD</span></div>
</div>
</div>
</div>
<div id="customerList" class="list">
<div class="empty">Select a customer</div>
</div>
</section>

<!-- Agent Section -->
<section id="panelAgent" class="panel">
<div class="agent-filter-row">
<select id="agentYear"></select>
<select id="agentMonth"></select>
<select id="agentView" onchange="agentChanged()"><option value="">Agent</option></select>
</div>
<div class="agent-summary">
<div class="agent-summary-box agent-balance">
<div class="agent-summary-label">বর্তমান বাকি</div>
<div id="agentCurrentBalance" class="agent-summary-value">0 <span>Tk</span></div>
</div>
<div class="agent-summary-box agent-sales">
<div class="agent-summary-label">মাসিক বিক্রয়</div>
<div id="agentMonthlySales" class="agent-summary-value">0 <span>Tk</span></div>
</div>
</div>
<div id="agentList" class="list">
<div class="empty">Select an agent</div>
</div>
</section>
</div>
</div>

<div id="syncStatus" class="sync-status">Syncing...</div>

<script>

/* Config Section */
const API='https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';
const HEADER_RATE_1=333.333333;
const HEADER_RATE_2=363.636363;
const HEADER_RATE_3=357.142857;
const DB_NAME='AmayaExchangeDB';
const DB_VERSION=2;
const SYNC_INTERVAL=3000;
const $=id=>document.getElementById(id);


/* Hardcoded Note Section */
const DUE_NOTES=[
'Bkash',
'Nagad',
'Recharge',
'Dollar Card',
'Electricity'
];

const PAYMENT_NOTES=[
'Bank',
'Cash'
];


let currentUser=null;
let transactionType='বাকি';
let customerData=[];
let agentData=[];

let notesData={
dueNotes:DUE_NOTES,
paymentNotes:PAYMENT_NOTES
};

let allTransactionsData=[];
let dueData={totalDueKD:0,customers:[]};
let totalDueKD=0;
let notesLoaded=true;
let dataVersion='';
let txVersion='';
let customerVersion='';
let agentVersion='';
let settingsVersion='';
let lastTransactionRow=0;
let dataLoaded=false;
let bootstrapPromise=null;
let syncTimer=null;
let syncRunning=false;
let db=null;
let currentAgentTransactions=[];
let pendingCustomerSelectRefresh=false;
let pendingCustomerPageRefresh=false;
let pendingAgentSelectRefresh=false;
let pendingAgentViewRefresh=false;
let pendingNotesRefresh=false;


/* Format Section */
const fmtKD=v=>number(v).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const fmtIndian=v=>Math.floor(number(v)).toLocaleString('en-IN');

function number(value){
return parseFloat(String(value??'').replace(/,/g,'').replace(/[^\d.-]/g,''))||0;
}


/* Sync Status Section */
function showSync(text='Syncing...'){
const el=$('syncStatus');
if(!el)return;
el.textContent=text;
el.classList.add('show');
clearTimeout(showSync.timer);
showSync.timer=setTimeout(()=>el.classList.remove('show'),900);
}

function hideSync(){
const el=$('syncStatus');
if(el)el.classList.remove('show');
}


/* IndexedDB Section */
function openDB(){
return new Promise((resolve,reject)=>{
if(db){
resolve(db);
return;
}
const request=indexedDB.open(DB_NAME,DB_VERSION);
request.onupgradeneeded=e=>{
const database=e.target.result;
if(!database.objectStoreNames.contains('meta')){
database.createObjectStore('meta',{keyPath:'key'});
}
if(!database.objectStoreNames.contains('customers')){
database.createObjectStore('customers',{keyPath:'customerId'});
}
if(!database.objectStoreNames.contains('agents')){
database.createObjectStore('agents',{keyPath:'agentId'});
}
if(!database.objectStoreNames.contains('transactions')){
const store=database.createObjectStore('transactions',{keyPath:'key'});
store.createIndex('rowNumber','rowNumber',{unique:false});
store.createIndex('customerId','customerId',{unique:false});
}
};
request.onsuccess=()=>{
db=request.result;
db.onversionchange=()=>{
db.close();
db=null;
};
resolve(db);
};
request.onerror=()=>reject(request.error);
});
}

function dbPut(storeName,value){
return new Promise((resolve,reject)=>{
const tx=db.transaction(storeName,'readwrite');
tx.objectStore(storeName).put(value);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);
});
}

function dbGet(storeName,key){
return new Promise((resolve,reject)=>{
const tx=db.transaction(storeName,'readonly');
const request=tx.objectStore(storeName).get(key);
request.onsuccess=()=>resolve(request.result||null);
request.onerror=()=>reject(request.error);
});
}

function dbGetAll(storeName){
return new Promise((resolve,reject)=>{
const tx=db.transaction(storeName,'readonly');
const request=tx.objectStore(storeName).getAll();
request.onsuccess=()=>resolve(request.result||[]);
request.onerror=()=>reject(request.error);
});
}

function dbClear(storeName){
return new Promise((resolve,reject)=>{
const tx=db.transaction(storeName,'readwrite');
tx.objectStore(storeName).clear();
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);
});
}

async function saveMeta(key,value){
await dbPut('meta',{key,value});
}

async function getMeta(key,defaultValue=''){
const result=await dbGet('meta',key);
return result?result.value:defaultValue;
}

async function clearUserCache(){
await Promise.all([
dbClear('customers'),
dbClear('agents'),
dbClear('transactions')
]);
const keys=[
'version','txVersion','customerVersion','agentVersion',
'settingsVersion','lastTransactionRow','notesData',
'dueData','totalDueKD','loggedUser'
];
await Promise.all(keys.map(key=>
db.transaction('meta','readwrite').objectStore('meta').delete(key)
));
}

async function saveLocalState(){
await Promise.all([
saveMeta('version',dataVersion),
saveMeta('txVersion',txVersion),
saveMeta('customerVersion',customerVersion),
saveMeta('agentVersion',agentVersion),
saveMeta('settingsVersion',settingsVersion),
saveMeta('lastTransactionRow',lastTransactionRow),
saveMeta('loggedUser',currentUser?.username||''),
saveMeta('notesData',notesData),
saveMeta('dueData',dueData),
saveMeta('totalDueKD',totalDueKD)
]);
}

async function loadLocalState(){
const savedUser=await getMeta('loggedUser','');
const currentUsername=currentUser?.username||'';

if(savedUser&&currentUsername&&savedUser!==currentUsername){
await clearUserCache();
dataVersion='';
txVersion='';
customerVersion='';
agentVersion='';
settingsVersion='';
lastTransactionRow=0;

notesData={
dueNotes:DUE_NOTES,

/* Customer Section */
function sortCustomersAZ(list){
return list.sort((a,b)=>{
const nameA=String(a.customerName||a.name||'').trim();
const nameB=String(b.customerName||b.name||'').trim();
return nameA.localeCompare(nameB,'en',{
sensitivity:'base',
numeric:true
});
});
}

function getDueCustomer(id){
const list=Array.isArray(dueData?.customers)?dueData.customers:[];
return list.find(c=>String(c.customerId)===String(id))||null;
}

function getCustomerDue(customer){
if(!customer)return 0;
const serverDue=getDueCustomer(customer.customerId);
if(serverDue&&serverDue.totalDueKD!==undefined){
return number(serverDue.totalDueKD);
}
return number(customer.totalDueKD);
}

function applyDueData(data){
if(!data)return;

const source=
data.due&&typeof data.due==='object'
?data.due
:data.customerDue&&typeof data.customerDue==='object'
?data.customerDue
:data;

const hasCustomers=Array.isArray(source.customers);
const incomingTotal=
source.totalDueKD!==undefined
?source.totalDueKD
:data.totalDueKD;

if(incomingTotal!==undefined||hasCustomers){
dueData={
totalDueKD:incomingTotal!==undefined
?number(incomingTotal)
:number(dueData.totalDueKD||0),
customers:hasCustomers
?source.customers
:(Array.isArray(dueData.customers)?dueData.customers:[])
};
totalDueKD=number(dueData.totalDueKD);
}

if(Array.isArray(dueData.customers)){
const dueMap=new Map(
dueData.customers.map(c=>[
String(c.customerId),
number(c.totalDueKD)
])
);
customerData.forEach(customer=>{
const id=String(customer.customerId);
if(dueMap.has(id)){
customer.totalDueKD=dueMap.get(id);
}
});
}
}

function findCustomer(id){
return customerData.find(c=>String(c.customerId)===String(id))||null;
}

function isActive(customer){
const status=String(
customer?.status||
customer?.Status||
customer?.active||
customer?.Active||
''
).trim().toLowerCase();
return status==='active';
}

if(flags.customersChanged){

safeRefreshCustomerPage();
}

if(flags.agentsChanged){

async function saveCustomersLocal(items){
await dbClear('customers');
if(!Array.isArray(items))return;

const tx=db.transaction('customers','readwrite');
const store=tx.objectStore('customers');

items.forEach(x=>store.put(x));

return new Promise((resolve,reject)=>{
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

async function saveAgentsLocal(items){
await dbClear('agents');
if(!Array.isArray(items))return;

const tx=db.transaction('agents','readwrite');
const store=tx.objectStore('agents');

items.forEach(x=>store.put(x));

return new Promise((resolve,reject)=>{
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

function transactionKey(t){
return String(
t.transactionId||
t.TransactionId||
t.rowNumber||
t.row||
t.timestamp||
JSON.stringify([
t.date||'',
t.customerId||'',
t.kdAmount||'',
t.bdAmount||'',
t.type||''
])
);
}

async function saveTransactionsLocal(items){
if(!Array.isArray(items)||!items.length)return;

const tx=db.transaction('transactions','readwrite');
const store=tx.objectStore('transactions');

items.forEach(item=>{
const copy={...item};
copy.key=transactionKey(copy);
store.put(copy);
});

return new Promise((resolve,reject)=>{
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

function getTransactionTimestamp(t){
const value=
t.timestamp||
t.Timestamp||
t.createdAt||
t.created_at||
t.time||
t.createdTime||
'';

if(!value)return 0;

const time=new Date(value).getTime();
return Number.isFinite(time)?time:0;
}

function getTransactionRowNumber(t){
return Number(
t.rowNumber||
t.row||
t.rowIndex||
t.RowNumber||
0
)||0;
}

function sortTransactionsNewestFirst(list){
return list.sort((a,b)=>{
const rowA=getTransactionRowNumber(a);
const rowB=getTransactionRowNumber(b);

if(rowA!==rowB)return rowB-rowA;

const timeA=getTransactionTimestamp(a);
const timeB=getTransactionTimestamp(b);

if(timeA!==timeB)return timeB-timeA;

const dateA=
getFullTransactionDate(
a.date||a.Date||
a.transactionDate||a.TransactionDate||''
)?.getTime()||0;

const dateB=
getFullTransactionDate(
b.date||b.Date||
b.transactionDate||b.TransactionDate||''
)?.getTime()||0;

if(dateA!==dateB)return dateB-dateA;

const idA=String(
a.transactionId||a.TransactionId||''
);

const idB=String(
b.transactionId||b.TransactionId||''
);

return idB.localeCompare(idA);
});
}

function createTransactionCard(t,showCustomer){
const sale=isDueTransaction(t);
const payment=isPaymentTransaction(t);
const txn=document.createElement('div');

txn.className='txn '+
(sale?'sale':payment?'payment':'');

const top=document.createElement('div');
top.className='txn-top';

const date=document.createElement('div');
date.className='txn-date';
date.textContent=
t.date||t.Date||
t.transactionDate||
t.TransactionDate||'';

const typeWrap=document.createElement('div');
typeWrap.style.textAlign='right';
typeWrap.style.minWidth='55px';

const type=document.createElement('div');
type.className='txn-type';
type.textContent=
sale?'বিক্রয়':
payment?'পেমেন্ট':
(t.type||'');

typeWrap.appendChild(type);
top.append(date,typeWrap);

const amount=document.createElement('div');
amount.className='txn-amount';

const kdAmount=number(
t.kdAmount!==undefined
?t.kdAmount
:(t.amountKD!==undefined?t.amountKD:t.kd)
);

const sign=payment?'−':sale?'+':'';
amount.textContent=sign+fmtKD(kdAmount)+' KD';

const bottom=document.createElement('div');
bottom.className='txn-bottom';

const note=String(t.note||'').trim();
const bdAmount=getBDAmount(t);
let bottomText='';

if(note)bottomText+=note;

if(bdAmount){
if(bottomText)bottomText+=' • ';
bottomText+=fmtIndian(bdAmount)+' TK';
}

if(showCustomer&&t.customerName){
if(bottomText)bottomText+=' • ';
bottomText+=t.customerName;
}

bottom.textContent=bottomText;

const agentName=document.createElement('div');
agentName.className='txn-agent';
agentName.textContent=
t.agentName||t.agent||
t.AgentName||'';

txn.append(top,amount);

if(bottomText)txn.append(bottom);
if(agentName.textContent)txn.append(agentName);

return txn;
}

function transactionMatchesDate(transaction,selectedDate){
if(!selectedDate)return true;

const value=
transaction.date||
transaction.Date||
transaction.transactionDate||
transaction.TransactionDate||
'';

const transactionDate=getFullTransactionDate(value);

if(!transactionDate)return false;

const selectedDateObj=getFullTransactionDate(selectedDate);

if(!selectedDateObj)return false;

return transactionDate.getFullYear()===
selectedDateObj.getFullYear()&&
transactionDate.getMonth()===
selectedDateObj.getMonth()&&
transactionDate.getDate()===
selectedDateObj.getDate();
}

function getFullTransactionDate(value){
if(!value)return null;

const str=String(value).trim();
if(!str)return null;

let date;

let match=str.match(
/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[T\s]+(.+))?$/
);

if(match){
date=new Date(
Number(match[1]),
Number(match[2])-1,
Number(match[3])
);

if(match[4]){
const tm=match[4].trim().match(
/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.(\d+))?(?:\s*(AM|PM))?/i
);

if(tm){
let hour=Number(tm[1]);
const minute=Number(tm[2]);
const second=Number(tm[3]||0);
const ms=Number(
String(tm[4]||'').padEnd(3,'0').slice(0,3)
)||0;
const ampm=String(tm[5]||'').toUpperCase();

if(ampm==='PM'&&hour<12)hour+=12;
if(ampm==='AM'&&hour===12)hour=0;

date.setHours(hour,minute,second,ms);
}
}

return isNaN(date.getTime())?null:date;
}

match=str.match(
/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{4})(?:[T\s]+(.+))?$/
);

if(match){
const months={
jan:1,feb:2,mar:3,apr:4,may:5,jun:6,
jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
};

const month=months[match[2].toLowerCase()];

if(month){
date=new Date(
Number(match[3]),
month-1,
Number(match[1])
);

if(match[4]){
const tm=match[4].trim().match(
/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*(AM|PM))?/i
);

if(tm){
let hour=Number(tm[1]);
const minute=Number(tm[2]);
const second=Number(tm[3]||0);
const ampm=String(tm[4]||'').toUpperCase();

if(ampm==='PM'&&hour<12)hour+=12;
if(ampm==='AM'&&hour===12)hour=0;

date.setHours(hour,minute,second,0);
}
}

return isNaN(date.getTime())?null:date;
}
}

match=str.match(
/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[T\s]+(.+))?$/
);

if(match){
date=new Date(
Number(match[3]),
Number(match[2])-1,
Number(match[1])
);

if(match[4]){
const tm=match[4].trim().match(
/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*(AM|PM))?/i
);

if(tm){
let hour=Number(tm[1]);
const minute=Number(tm[2]);
const second=Number(tm[3]||0);
const ampm=String(tm[4]||'').toUpperCase();

if(ampm==='PM'&&hour<12)hour+=12;
if(ampm==='AM'&&hour===12)hour=0;

date.setHours(hour,minute,second,0);
}
}

return isNaN(date.getTime())?null:date;
}

date=new Date(str);
return isNaN(date.getTime())?null:date;
}

.trim()
.toLowerCase()
.replace(/\s+/g,' ')
.replace(/^[+\-]\s*/,'')

sortTransactionsNewestFirst(currentAgentTransactions);
renderAgentTransactions();
}

function calculateAgentSummary(){
let balance=0;
let sales=0;

const year=Number($('agentYear').value);
const month=Number($('agentMonth').value);

currentAgentTransactions.forEach(t=>{
const amount=getBDAmount(t);

if(isDueTransaction(t)){
balance+=amount;
}else if(isPaymentTransaction(t)){
balance-=amount;
}

if(isDueTransaction(t)){
const info=parseTransactionDate(
t.date||t.Date||
t.transactionDate||t.TransactionDate
);

if(info&&info.year===year&&info.month===month){
sales+=amount;
}
}
});

setAgentNumbers(balance,sales);
}

function setAgentNumbers(balance,sales){
$('agentCurrentBalance').innerHTML=
fmtIndian(balance)+' <span>Tk</span>';

$('agentMonthlySales').innerHTML=
fmtIndian(sales)+' <span>Tk</span>';
}

function renderAgentTransactions(){
const list=$('agentList');

if(!currentAgentTransactions.length){
calculateAgentSummary();
list.innerHTML=
'<div class="empty">No BD transactions found</div>';
return;
}

const year=Number($('agentYear').value);
const month=Number($('agentMonth').value);

const filtered=currentAgentTransactions.filter(t=>{
const info=parseTransactionDate(
t.date||t.Date||
t.transactionDate||t.TransactionDate
);

return info&&info.year===year&&info.month===month;
});

sortTransactionsNewestFirst(filtered);
calculateAgentSummary();

if(!filtered.length){
list.innerHTML=
'<div class="empty">No transaction for this month</div>';
return;
}

list.innerHTML='';

const fragment=document.createDocumentFragment();

filtered.forEach(t=>{

const payment=isPaymentTransaction(t);

fragment.appendChild(txn);
});

}

function parseTransactionDate(value){
if(!value)return null;

const str=String(value).trim();

let match=str.match(
/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{4})$/
);

if(match){
const months={
jan:1,feb:2,mar:3,apr:4,may:5,jun:6,
jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
};

const month=months[match[2].toLowerCase()];

if(month){
return{
year:Number(match[3]),
month
};
}
}

match=str.match(
/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);

if(match){
return{
year:Number(match[1]),
month:Number(match[2])
};
}

match=str.match(
/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
);

if(match){
return{
year:Number(match[3]),
month:Number(match[2])
};
}

const date=new Date(str);

if(!isNaN(date.getTime())){
return{
year:date.getFullYear(),
month:date.getMonth()+1
};
}

return null;
}

function getBDAmount(t){
return number(
t.bdAmount!==undefined&&t.bdAmount!==''
?t.bdAmount
:(t.amountBD!==undefined&&t.amountBD!==''
?t.amountBD:t.bd)
);
}

async function getAPI(action,params={}){
const q=new URLSearchParams();
q.set('action',action);

Object.keys(params).forEach(k=>{
const value=params[k];

if(value!==undefined&&value!==null&&value!==''){
q.set(k,value);
}
});

const response=await fetch(
API+'?'+q.toString(),
{
method:'GET',
cache:'no-store'
}
);

return response.json();
}

const response=await fetch(API,{
method:'POST',
headers:{
'Content-Type':'text/plain;charset=utf-8'
},
body:JSON.stringify(data)
});

return response.json();
}

);

/* Background Sync Section */
async function syncData(force=false){
if(syncRunning)return false;
if(!currentUser)return false;

syncRunning=true;

try{
await openDB();

if(
!dataVersion&&
!txVersion&&
!customerVersion&&
!agentVersion&&
!settingsVersion
){
return await initialBootstrap();
}


/*
  Notes are already hardcoded.
  This no longer makes an options API request.
*/
if(!notesLoaded){
await loadMissingNotes();
}

const result=await getAPI('sync',{
version:dataVersion,
txVersion,
customerVersion,
agentVersion,
settingsVersion,
lastTransactionRow
});

if(!result.success){
throw new Error(result.error||'Sync failed');
}

const data=result.data||{};

if(data.fullSync){
await initialBootstrap();
return true;
}

const flags={
transactionsChanged:false,
customersChanged:false,
agentsChanged:false,
notesChanged:false,
dueChanged:false
};

if(Array.isArray(data.transactions)&&data.transactions.length){
await saveTransactionsLocal(data.transactions);
flags.transactionsChanged=true;
}

if(Array.isArray(data.customers)){
customerData=data.customers;
sortCustomersAZ(customerData);
await saveCustomersLocal(customerData);
applyDueData(dueData);
flags.customersChanged=true;
}

if(Array.isArray(data.agents)){
agentData=data.agents;
await saveAgentsLocal(agentData);
flags.agentsChanged=true;
}


/*
  Backend notes are intentionally ignored.
*/

if(
data.due||
data.customerDue||
data.totalDueKD!==undefined
){
applyDueData(data);
flags.dueChanged=true;
}

if(data.version!==undefined){
dataVersion=data.version||dataVersion;
}

if(data.txVersion!==undefined){
txVersion=data.txVersion||txVersion;
}

if(data.customerVersion!==undefined){
customerVersion=
data.customerVersion||customerVersion;
}

if(data.agentVersion!==undefined){
agentVersion=
data.agentVersion||agentVersion;
}

if(data.settingsVersion!==undefined){
settingsVersion=
data.settingsVersion||settingsVersion;
}

if(data.lastTransactionRow!==undefined){
lastTransactionRow=
Number(data.lastTransactionRow)||lastTransactionRow;
}

await saveLocalState();

if(flags.transactionsChanged){
await loadTransactionsLocal();
}

if(
flags.transactionsChanged||
flags.customersChanged||
flags.agentsChanged||
flags.notesChanged||
flags.dueChanged
){
refreshAfterSync(flags);
}

return true;

}catch(e){
console.error('Sync Error:',e);
return false;

}finally{
syncRunning=false;
}
}

function startBackgroundSync(){
stopBackgroundSync();
syncData();

syncTimer=setInterval(()=>{
if(document.visibilityState==='visible'){
syncData();
}
},SYNC_INTERVAL);
}

function stopBackgroundSync(){
if(syncTimer){
clearInterval(syncTimer);
syncTimer=null;
}
}

document.addEventListener('visibilitychange',()=>{
if(
document.visibilityState==='visible'&&
currentUser
){

if(!syncTimer){
startBackgroundSync();

});

);

$('customerPageSelect').value;

button.textContent='Saving...';

message.className='msg';

try{

customerName:customer?.customerName||'',

});

}

message.className='msg success';
message.textContent='Transaction saved successfully';

$('kdAmount').value='';
$('bdAmount').value='';

const serverData=result.data||{};

const localTransaction={
date:formatDate(date),
customerId,
customerName:customer?.customerName||'',
kdAmount:kd,
bdAmount:bd,
type:transactionType,
note,
transactionId:serverData.transactionId||'',
timestamp:
serverData.timestamp||
new Date().toISOString(),
agentName:agent?.agentName||'',
rowNumber:Number(serverData.rowNumber||0)
};

if(
localTransaction.rowNumber||
localTransaction.transactionId
){

}

if(serverData.txVersion!==undefined){
txVersion=serverData.txVersion;
}

if(serverData.version!==undefined){
dataVersion=serverData.version;
}

if(serverData.customerVersion!==undefined){
customerVersion=
serverData.customerVersion;
}

if(serverData.agentVersion!==undefined){
agentVersion=
serverData.agentVersion;
}

if(serverData.settingsVersion!==undefined){
settingsVersion=
serverData.settingsVersion;
}

if(serverData.rowNumber){
lastTransactionRow=Math.max(
lastTransactionRow,
Number(serverData.rowNumber)
);
}

if(
serverData.due||
serverData.customerDue||
serverData.totalDueKD!==undefined
){
applyDueData(serverData);
}

await saveLocalState();
await loadTransactionsLocal();

renderLocalData();

if(
savedCustomerPageId&&
[...$('customerPageSelect').options]
.some(o=>o.value===savedCustomerPageId)
){

savedCustomerPageId;

}

function formatDate(value){
const parts=value.split('-');

const months=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];

return parts[2]+'-'+
months[Number(parts[1])-1]+'-'+
parts[0];
}

function addEmpty(parent,text){
const box=document.createElement('div');
box.className='empty';
box.textContent=text;
parent.appendChild(box);
}

function escapeHTML(value){
return String(
value===null||value===undefined?'':value
)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

function showInitialDataError(message){
if($('customerList')&&!dataLoaded){
$('customerList').innerHTML=
'<div class="empty">'+
escapeHTML(message||'Unable to load data')+
'</div>';
}
}


/* Event Listeners Section */
$('customerPageSelect').addEventListener(
'change',
function(){
const id=this.value;
const list=$('customerList');

if(!id){
$('selectedCustomerInfo').innerHTML=
'<div class="selected-empty">Select a customer</div>';

$('selectedDueAmount').innerHTML=
'0.000 <span>KD</span>';

updateTotalDue();

list.innerHTML=
'<div class="empty">Select a customer</div>';

return;
}

if(id==='__ALL_TRANSACTIONS__'){
$('selectedCustomerInfo').innerHTML=
'<div class="selected-name">All Transaction</div>'+
'<div class="selected-phone">All Active Customers</div>';

$('selectedDueAmount').innerHTML='All';
updateTotalDue();
renderAllCustomerTransactions();
return;
}

const customer=findCustomer(id);

if(!customer){
$('selectedCustomerInfo').innerHTML=
'<div class="selected-empty">Customer not found</div>';

$('selectedDueAmount').innerHTML=
'0.000 <span>KD</span>';

list.innerHTML=
'<div class="empty">Customer not found</div>';

return;
}

renderCustomerInfo(customer);
renderCustomerTransactionsLocal(customer.customerId);
});

$('customerSearch').addEventListener(
'input',
function(){
const currentId=$('customerPageSelect').value;
updateCustomerDropdown();

const select=$('customerPageSelect');

if(
currentId&&
[...select.options]
.some(o=>o.value===currentId)
){
select.value=currentId;
}
});

$('customerTransactionDate').addEventListener(
'change',
function(){
if(
$('customerPageSelect').value===
'__ALL_TRANSACTIONS__'
){
renderAllCustomerTransactions();
}
});

$('bdAmount').addEventListener(
'keydown',
function(e){
if(e.key==='Enter'||e.keyCode===13){
e.preventDefault();
saveTransaction();
}
});

$('password').addEventListener(
'keydown',
e=>{
if(e.key==='Enter'){
login();
}
});

$('agentSelect').addEventListener(
'change',
function(){

'has-value',
this.value!==''
);
});

$('customerSelect').addEventListener(
'change',
function(){
this.classList.toggle(
'has-value',

);
});

setupSafeSelectRefresh();
restoreLogin();
