<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Amaya Exchange</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
padding:0;
background:#f5f7fa;
color:#172033;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
height:100%;
width:100%;
overflow:hidden;
position:fixed;
overscroll-behavior:none;
-webkit-overflow-scrolling:auto;
font-feature-settings:"tnum";
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}

body{min-height:100vh}

button,input,select{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.app{
width:100%;
max-width:520px;
margin:auto;
height:100vh;
height:100dvh;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;
position:relative;
}

.header{
background:#fff;
padding:8px 14px 10px;
border-bottom:1px solid #e7e9ed;
position:sticky;
top:0;
z-index:20;
overflow:visible
}

.header-row-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:6px;
overflow:visible
}

.header-row-bottom{
display:flex;
align-items:center;
justify-content:flex-start;
gap:8px;
margin-top:-3px;
min-width:0
}

.header-top-right{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0
}

.logo{
font-size:17px;
font-weight:800;
white-space:nowrap;
flex-shrink:0;
letter-spacing:-.2px
}

.tagline{
font-size:10px;
color:#858e9d;
margin-top:0;
line-height:1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
min-width:0;
flex-shrink:1
}

.logout{
border:0;
background:#fff1f1;
color:#d66b6b;
width:30px;
height:30px;
border-radius:8px;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
padding:0;
flex-shrink:0;
}

.logout:active{transform:scale(.92)}

.refresh-btn{
border:0;
background:#eef2f6;
color:#172033;
width:30px;
height:30px;
border-radius:8px;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
padding:0;
flex-shrink:0
}

.refresh-btn:active{transform:scale(.92)}

.refresh-btn.spinning{
animation:refreshSpin .8s linear infinite;
pointer-events:none;
opacity:.7
}

@keyframes refreshSpin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

.header-rate-wrap{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0
}

.header-rate{
position:relative;
width:110px;
flex-shrink:0
}

.header-rate-input{
width:100%;
height:30px;
border:1px solid #dfe3e9;
border-radius:15px;
background:#EFF6FF;
padding:0 12px;
outline:0;
color:#172033;
font-size:11px;
font-weight:600
}

.header-rate-popup{
position:absolute;
left:-10px;
right:-45px;
top:calc(100% + 7px);
background:#111827;
color:#fff;
border-radius:10px;
padding:12px 9px;
display:flex;
align-items:center;
justify-content:space-between;
gap:7px;
opacity:0;
visibility:hidden;
transform:translateY(7px);
transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
box-shadow:0 5px 16px rgba(0,0,0,.18);
z-index:100
}

.header-rate-popup.show{
opacity:1;
visibility:visible;
transform:translateY(0)
}

.header-rate-left{min-width:0}

.header-rate-label{
color:#aeb8c7;
font-size:8px;
line-height:1;
margin-bottom:2px
}

.header-rate-amount{
font-size:12px;
font-weight:700;
white-space:nowrap
}

.header-rate-right{
text-align:right;
flex-shrink:0
}

.header-rate-kd{
font-size:15px;
font-weight:800;
line-height:1;
white-space:nowrap
}

.header-rate-popup:after{
content:"";
position:absolute;
right:35%;
top:-5px;
width:10px;
height:10px;
background:#111827;
transform:rotate(45deg)
}

.sync-status{
display:inline-block;
background:#16824c;
color:#fff;
border-radius:6px;
padding:5px 8px;
font-size:9px;
font-weight:700;
line-height:1;
letter-spacing:.2px;
white-space:nowrap;
max-width:85px;
overflow:hidden;
text-overflow:ellipsis;
text-align:center;
opacity:.95;
transition:background .25s ease;
box-shadow:0 1px 3px rgba(0,0,0,.10);
flex-shrink:0
}

.sync-status.syncing{background:#3b82f6}
.sync-status.pending{background:#f59e0b}
.sync-status.error{background:#d33131}
.sync-status.synced{background:#16824c}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
padding:11px 14px 5px
}

.tab{
border:0;
height:43px;
border-radius:11px;
background:#e7ebf0;
color:#687284;
font-size:12px;
font-weight:800
}

.tab.active{
background:#111827;
color:#fff
}

.content{padding:10px 14px 5px}

.panel{display:none}
.panel.active{display:block}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 3px 15px rgba(0,0,0,.045)
}

.field{margin-bottom:18px}

.label{
display:block;
font-size:10px;
font-weight:300;
margin-bottom:7px
}

input,select{
width:100%;
height:47px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
padding:0 12px;
outline:0;
color:#172033
}

#customerSelect{font-weight:400}
#customerSelect.has-value{font-weight:700}

#agentOptionSelect{
font-weight:700;
background:#FFFBEB;
border-color:#FCD34D
}

input:focus,select:focus{
border-color:#111827;
box-shadow:
0 0 0 3px rgba(17,24,39,.08),
0 4px 14px rgba(17,24,39,.10);
outline:none
}

#customerSelect.has-value{
font-weight:700;
background:#FFFBEB;
border-color:#FCD34D
}

select:disabled{
background:#f1f3f6;
color:#4b5563;
opacity:1;
cursor:not-allowed
}

/* ===== AGENT BUTTONS ===== */
.agent-btn-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.agent-btn{
height:47px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
font-weight:800;
font-size:15px;
color:#172033;
display:flex;
align-items:center;
justify-content:center;
padding:0 8px;
cursor:pointer;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
transition:all .15s ease;
-webkit-tap-highlight-color:transparent;
}

.agent-btn:active{transform:scale(.97)}
.agent-btn.active{
background:#111827;
color:#fff;
border-color:#111827
}

.amount{font-size:14px!important;font-weight:700}

.amount-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
position:relative
}

.type-row{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin:3px 0 13px
}

.type-btn{
height:44px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
font-weight:800;
font-size:13px;
transition:all .15s ease;
}

/* ⭐ বাকি বাটন — সবুজ */
#dueBtn.active{
background:#16A34A;
color:#fff;
border-color:#16A34A;
}

/* ⭐ পেমেন্ট বাটন — লাল */
#paymentBtn.active{
background:#DC2626;
color:#fff;
border-color:#DC2626;
}

/* ⭐ নগদ বাটন — বেগুনি */
#cashBtn.active{
background:#7C3AED;
color:#fff;
border-color:#7C3AED;
}

.save{
width:100%;
height:50px;
border:0;
border-radius:12px;
background:#111827;
color:#fff;
font-size:13px;
font-weight:800;
letter-spacing:.2px
}

.save:active{transform:scale(.98)}
.save:disabled{opacity:.55;cursor:not-allowed}

.msg{
font-size:12px;
margin-top:9px;
text-align:center;
transition:opacity .3s ease;
}
.error{color:#d33131}
.success{color:#16824c}

.profit-popup{
position:absolute;
right:0;
bottom:60px;
background:#111827;
color:#fff;
border-radius:10px;
padding:7px 11px;
font-size:11px;
font-weight:800;
line-height:1;
box-shadow:0 5px 16px rgba(0,0,0,.16);
opacity:0;
visibility:hidden;
transform:translateY(5px) scale(.96);
transition:opacity .15s ease,transform .15s ease,visibility .15s ease;
z-index:30;
pointer-events:none;
white-space:nowrap
}

.profit-popup.show{
opacity:1;
visibility:visible;
transform:translateY(0) scale(1)
}

.profit-popup:after{
content:"";
position:absolute;
right:20px;
bottom:-5px;
width:10px;
height:10px;
background:#111827;
transform:rotate(45deg)
}

/* ===== CUSTOMER FILTER ===== */
.customer-filter-card{
background:#fff;
border-radius:14px;
padding:10px;
margin-bottom:6px;
box-shadow:0 2px 10px rgba(0,0,0,.035)
}

.customer-filter-row{
display:grid;
grid-template-columns:1fr 105px 1.25fr;
gap:6px;
align-items:center;
margin-bottom:7px
}

.customer-filter-row input,
.customer-filter-row select{
height:36px;
font-size:11px;
padding:0 8px;
border-radius:9px
}

.customer-date-wrap{position:relative;width:100%}

.customer-date{
width:100%;
height:36px;
border-radius:9px;
font-size:11px;
padding:0 30px 0 8px;
background:#fff;
border:1px solid #dfe3e9;
outline:0;
cursor:pointer;
appearance:none;
-webkit-appearance:none;
background-image:none!important;
}

.customer-date-wrap:after{
content:"📅";
position:absolute;
right:9px;
top:50%;
transform:translateY(-50%);
font-size:13px;
opacity:.65;
pointer-events:none;
z-index:3;
line-height:1;
}

#customerDatePicker{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
z-index:4
}

.customer-selected-row{
display:grid;
grid-template-columns:1fr auto auto;
align-items:center;
gap:7px;
min-height:38px
}

.selected-customer{min-width:0}

.selected-name{
font-size:14px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.selected-phone{
font-size:12px;
color:#858e9d;
margin-top:1px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* ⭐ WhatsApp Row Layout */
.customer-wa-row{
display:flex;
align-items:center;
gap:8px;
min-width:0;
width:100%;
}

.customer-wa-info{
min-width:0;
flex:1;
}

/* ⭐ WhatsApp Button — Rounded Square */
.wa-c{
display:inline-flex;
align-items:center;
justify-content:center;
width:28px;
height:28px;
border-radius:8px;
background:linear-gradient(135deg,#25D366 0%,#128C7E 100%);
color:#fff;
text-decoration:none;
flex-shrink:0;
box-shadow:
0 2px 5px rgba(37,211,102,.3),
inset 0 1px 0 rgba(255,255,255,.2);
transition:all .15s ease;
margin-right:6px;
}

.wa-c:hover{transform:scale(1.05)}
.wa-c:active{transform:scale(.95)}

.wa-c svg{
width:16px;
height:16px;
display:block;
fill:currentColor;
}

.due-amount-box{
background:#f1f3f6;
border-radius:9px;
padding:6px 8px;
min-width:82px;
text-align:center;
flex-shrink:0
}

.due-amount-label{
font-size:10px;
color:#858e9d;
margin-bottom:1px
}

.due-amount-value{
font-size:13px;
font-weight:800;
color:#172033;
line-height:1.1;
white-space:nowrap
}

.due-amount-value span{font-size:8px;font-weight:700}

.total-due-box{
background:#111827;
border-radius:9px;
padding:6px 9px;
min-width:105px;
text-align:center;
flex-shrink:0
}

.total-due-label{
font-size:10px;
color:#c8ced8;
margin-bottom:1px
}

.total-due-value{
font-size:14px;
font-weight:800;
color:#fff;
line-height:1.1;
white-space:nowrap
}

.total-due-value span{font-size:8px;font-weight:700}

.list{
display:flex;
flex-direction:column;
gap:6px
}

#customerList{
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-right:1px
}

/* =========================================================
   TRANSACTION CARD
========================================================= */

.tl{
background:#fff;
border-radius:12px;
padding:10px 12px;
border:1px solid #eef1f4;
border-left:4px solid #16A34A;
margin-bottom:6px;
box-shadow:0 1px 3px rgba(0,0,0,.02);
display:grid;
grid-template-columns:auto 1px 1fr auto;
gap:11px;
align-items:center;
position:relative;
}

.tl.payment{
background:#FFF7F7;
border-color:#FDE1E1;
border-left-color:#DC2626;
}

.tl.cash{
background:#F5F3FF;
border-color:#E9D5FF;
border-left-color:#7C3AED;
}

.tl-date{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
line-height:1;
min-width:56px;
padding:2px 0;
}
.tl-date .d{
font-size:16px;
font-weight:900;
color:#166534;
letter-spacing:-.3px;
line-height:1;
display:block;
}
.tl-date .m{
font-size:9px;
font-weight:800;
color:#16A34A;
letter-spacing:.5px;
margin-top:3px;
text-transform:uppercase;
line-height:1;
display:block;
}
.tl-date .y{
font-size:7.5px;
font-weight:800;
color:#6B7280;
letter-spacing:.4px;
margin-top:2px;
line-height:1;
display:block;
}
.tl.payment .tl-date .d{color:#B91C1C}
.tl.payment .tl-date .m{color:#DC2626}
.tl.payment .tl-date .y{color:#d08a8a}
.tl.cash .tl-date .d{color:#6D28D9}
.tl.cash .tl-date .m{color:#7C3AED}
.tl.cash .tl-date .y{color:#a78bfa}

.tl-line{
width:1px;
height:36px;
background:linear-gradient(
180deg,
transparent 0%,
#e5e7eb 20%,
#e5e7eb 80%,
transparent 100%
);
align-self:center;
}

.tl-mid{
display:flex;
flex-direction:column;
gap:3px;
min-width:0;
}
.tl-amt-left{
font-size:14px;
font-weight:900;
color:#166534;
letter-spacing:-.2px;
white-space:nowrap;
line-height:1;
display:block;
}
.tl.payment .tl-amt-left{color:#DC2626}
.tl.cash .tl-amt-left{color:#7C3AED}
.tl-note{
font-size:10px;
color:#6B7280;
font-weight:500;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
display:block;
}
.tl-bal-bottom{
  font-size:9.5px;
  color:#4B5563;
  font-weight:800;
  background:#F3F4F6;
  border-radius:5px;
  padding:2px 6px;
  display:inline-block;
  line-height:1;
  width:fit-content;
  letter-spacing:.1px;
  margin-top:2px;
}
.tl.sale .tl-bal-bottom{
background:#DCFCE7;
color:#166534;
}
.tl.payment .tl-bal-bottom{
background:#FEE2E2;
color:#991B1B;
}
.tl.cash .tl-bal-bottom{
background:#EDE9FE;
color:#6D28D9;
}

.tl-right{
text-align:right;
display:flex;
flex-direction:column;
gap:3px;
align-items:flex-end;
}

.tl-cust-line{
font-size:12.5px;
font-weight:800;
color:#0F172A;
letter-spacing:-.15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:150px;
cursor:pointer;
padding:1px 4px;
border-radius:5px;
display:inline-flex;
align-items:center;
gap:6px;
transition:background .12s ease, color .12s ease;
-webkit-user-select:none;
user-select:none;
}
.tl-cust-line:hover{
background:#EEF2FF;
color:#4338CA;
}
.tl-cust-line:active{
background:#E0E7FF;
transform:scale(.97);
}

.tl-type-inline{
display:inline-flex;
align-items:center;
gap:3px;
font-size:9px;
font-weight:800;
color:#166534;
white-space:nowrap;
}
.tl-type-inline:before{
content:"";
width:5px;
height:5px;
border-radius:50%;
background:#16A34A;
box-shadow:0 0 0 2px rgba(22,163,74,.15);
flex-shrink:0;
}
.tl.payment .tl-type-inline{color:#B91C1C}
.tl.payment .tl-type-inline:before{
background:#DC2626;
box-shadow:0 0 0 2px rgba(220,38,38,.15);
}
.tl-type-inline.cash{color:#7C3AED}
.tl-type-inline.cash:before{
background:#7C3AED;
box-shadow:0 0 0 2px rgba(124,58,237,.15);
}

.tl-type-inline[style*="cursor"]:hover{
opacity:.75;
text-decoration:underline;
}

.tl-agent-right{
font-size:9.5px;
font-weight:800;
color:#4B5563;
background:#F3F4F6;
border-radius:999px;
padding:1.5px 7px 1.5px 5px;
display:inline-flex;
align-items:center;
gap:3px;
white-space:nowrap;
cursor:pointer;
max-width:110px;
overflow:hidden;
text-overflow:ellipsis;
}
.tl-agent-right:before{
content:"🏷️";
font-size:7.5px;
opacity:.65;
flex-shrink:0;
}

.all .tl-agent-below{
display:flex;
justify-content:flex-end;
margin-top:5px;
padding-top:4px;
border-top:1px dashed #eef1f4;
padding-left:8px;
padding-right:2px;
}

.single .tl-right{
gap:4px;
}
.single .tl-agent-type-line{
display:inline-flex;
align-items:center;
gap:7px;
white-space:nowrap;
}

.tl .pending-badge{
position:absolute;
top:6px;
right:8px;
background:#f59e0b;
color:#fff;
font-size:10px;
font-weight:800;
padding:2px 7px;
border-radius:6px;
letter-spacing:.2px;
line-height:1;
box-shadow:0 1px 3px rgba(0,0,0,.15);
}

color:#166534;
letter-spacing:-.2px;
white-space:nowrap;
line-height:1;

<script>

/* =========================================================
   CONFIG
========================================================= */

const API=
'https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';

const HEADER_RATE_1=333.333333,
HEADER_RATE_2=363.636363,
HEADER_RATE_3=357.142857;

const DB_NAME='AmayaExchangeDB',
DB_VERSION=3,
SYNC_INTERVAL=2500,
$=id=>document.getElementById(id);

const DUE_NOTES=['Bkash','Nagad','Recharge','Dollar Card','Electricity'];
const PAYMENT_NOTES=['Bank','Cash'];

const AGENT_OPTIONS={
'harun':['7449','7448'],
'sajib':['1208','Bank']
};

let currentUser=null,
transactionType='বাকি',
customerData=[],
agentData=[],
notesData={dueNotes:DUE_NOTES,paymentNotes:PAYMENT_NOTES},
allTransactionsData=[],
dueData={totalDueKD:0,customers:[]},
totalDueKD=0,
notesLoaded=true,
dataVersion='',
txVersion='',
customerVersion='',
agentVersion='',
settingsVersion='',
lastTransactionRow=0,
dataLoaded=false,
bootstrapPromise=null,
syncTimer=null,
syncRunning=false,
pendingSyncRunning=false,
db=null,
currentAgentTransactions=[],
pendingCustomerSelectRefresh=false,
pendingCustomerPageRefresh=false,
pendingAgentSelectRefresh=false,
pendingAgentViewRefresh=false,
pendingNotesRefresh=false,
isSavingTransaction=false,
savedAgentSelection='',
savedAgentOptionSelection='',
saveMsgTimeout=null;


/* =========================================================
   HELPERS
========================================================= */

function clean(value){
return String(value===null||value===undefined?'':value).trim()
}

function fmtKD(v){
return number(v).toLocaleString('en-US',{
minimumFractionDigits:3,
maximumFractionDigits:3
})
}

function fmtIndian(v){
return Math.floor(number(v)).toLocaleString('en-IN')
}

function number(value){
return parseFloat(
String(value??'').replace(/,/g,'').replace(/[^\d.-]/g,'')
)||0
}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDateParts(value){
if(!value)return{day:'',month:'',year:''};

const str=String(value).trim();

let m=str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
if(m){
return{day:m[1],month:fullMonthName(m[2]),year:m[3]};
}

m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
if(m){
return{
day:m[3].padStart(2,'0'),
month:fullMonthNameByNum(Number(m[2])),
year:m[1]
};
}

const d=new Date(str);
if(!isNaN(d.getTime())){
return{
day:String(d.getDate()).padStart(2,'0'),
month:fullMonthNameByNum(d.getMonth()+1),
year:String(d.getFullYear())
};
}

return{day:str,month:'',year:''};
}

function fullMonthName(shortName){
const map={
jan:'January',feb:'February',mar:'March',
apr:'April',may:'May',jun:'June',
jul:'July',aug:'August',sep:'September',
oct:'October',nov:'November',dec:'December'
};
return map[String(shortName).toLowerCase()]||shortName;
}

function fullMonthNameByNum(num){
const names=[
'January','February','March','April',
'May','June','July','August',
'September','October','November','December'
];
return names[num-1]||'';
}


/* =========================================================
   SYNC STATUS
========================================================= */

function showSync(text,type){
text=text||'Syncing...';
type=type||'syncing';
const el=$('syncStatus');
if(!el)return;
el.textContent=text;
el.classList.remove('syncing','pending','error','synced');
el.classList.add(type);
}

function hideSync(){showSync('Synced ✓','synced')}


/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){
return new Promise((resolve,reject)=>{
if(db)return resolve(db);

const r=indexedDB.open(DB_NAME,DB_VERSION);

r.onupgradeneeded=e=>{
const d=e.target.result;

if(!d.objectStoreNames.contains('meta'))
d.createObjectStore('meta',{keyPath:'key'});

if(!d.objectStoreNames.contains('customers'))
d.createObjectStore('customers',{keyPath:'customerId'});

if(!d.objectStoreNames.contains('agents'))
d.createObjectStore('agents',{keyPath:'agentId'});

if(!d.objectStoreNames.contains('transactions')){
const s=d.createObjectStore('transactions',{keyPath:'key'});
s.createIndex('rowNumber','rowNumber',{unique:false});
s.createIndex('customerId','customerId',{unique:false});
s.createIndex('pending','pending',{unique:false});
}else{
const store=e.target.transaction.objectStore('transactions');
if(!store.indexNames.contains('pending'))
store.createIndex('pending','pending',{unique:false});
}
};

r.onsuccess=()=>{
db=r.result;
db.onversionchange=()=>{db.close();db=null};
resolve(db)
};

r.onerror=()=>reject(r.error)
})
}

function dbPut(storeName,value){
return new Promise((resolve,reject)=>{
const t=db.transaction(storeName,'readwrite');
t.objectStore(storeName).put(value);
t.oncomplete=resolve;
t.onerror=()=>reject(t.error)
})
}

function dbGet(storeName,key){
return new Promise((resolve,reject)=>{
const t=db.transaction(storeName,'readonly');
const r=t.objectStore(storeName).get(key);
r.onsuccess=()=>{resolve(r.result||null)};
r.onerror=()=>reject(r.error)
})
}

function dbGetAll(storeName){
return new Promise((resolve,reject)=>{
const t=db.transaction(storeName,'readonly');
const r=t.objectStore(storeName).getAll();
r.onsuccess=()=>{resolve(r.result||[])};
r.onerror=()=>reject(r.error)
})
}

function dbClear(storeName){
return new Promise((resolve,reject)=>{
const t=db.transaction(storeName,'readwrite');
t.objectStore(storeName).clear();
t.oncomplete=resolve;
t.onerror=()=>reject(t.error)
})
}

async function saveMeta(key,value){
await dbPut('meta',{key,value})
}

async function getMeta(key,defaultValue=''){
const r=await dbGet('meta',key);
return r?r.value:defaultValue
}

async function clearUserCache(){
await Promise.all([
dbClear('customers'),
dbClear('agents'),
dbClear('transactions')
]);

const keys=[
'version','txVersion','customerVersion','agentVersion',
'settingsVersion','lastTransactionRow','notesData',
'dueData','totalDueKD','loggedUser'
];

await Promise.all(keys.map(k=>
db.transaction('meta','readwrite').objectStore('meta').delete(k)
))
}

async function saveLocalState(){
await Promise.all([
saveMeta('version',dataVersion),
saveMeta('txVersion',txVersion),
saveMeta('customerVersion',customerVersion),
saveMeta('agentVersion',agentVersion),
saveMeta('settingsVersion',settingsVersion),
saveMeta('lastTransactionRow',lastTransactionRow),
saveMeta('loggedUser',currentUser?.username||''),
saveMeta('notesData',notesData),
saveMeta('dueData',dueData),
saveMeta('totalDueKD',totalDueKD)
])
}

async function loadLocalState(){
const savedUser=await getMeta('loggedUser','');
const currentUsername=currentUser?.username||'';

if(savedUser&&currentUsername&&savedUser!==currentUsername){
await clearUserCache();
dataVersion=txVersion=customerVersion=agentVersion=settingsVersion='';
lastTransactionRow=0;
notesData={dueNotes:DUE_NOTES,paymentNotes:PAYMENT_NOTES};
dueData={totalDueKD:0,customers:[]};
totalDueKD=0;
notesLoaded=true;
return
}

dataVersion=await getMeta('version','');
txVersion=await getMeta('txVersion','');
customerVersion=await getMeta('customerVersion','');
agentVersion=await getMeta('agentVersion','');
settingsVersion=await getMeta('settingsVersion','');
lastTransactionRow=Number(await getMeta('lastTransactionRow',0))||0;

const savedNotes=await getMeta('notesData',null);
if(savedNotes&&typeof savedNotes==='object'){
notesData={
dueNotes:Array.isArray(savedNotes.dueNotes)&&savedNotes.dueNotes.length?savedNotes.dueNotes:DUE_NOTES,
paymentNotes:Array.isArray(savedNotes.paymentNotes)&&savedNotes.paymentNotes.length?savedNotes.paymentNotes:PAYMENT_NOTES
};
}else{
notesData={dueNotes:DUE_NOTES,paymentNotes:PAYMENT_NOTES};
}
notesLoaded=true;

const savedDue=await getMeta('dueData',null);
if(savedDue&&typeof savedDue==='object'){
dueData={
totalDueKD:number(savedDue.totalDueKD||0),
customers:Array.isArray(savedDue.customers)?savedDue.customers:[]
}
}

totalDueKD=number(await getMeta('totalDueKD',dueData.totalDueKD||0))
}

async function loadLocalDatabase(){
await openDB();
await loadLocalState();

customerData=await dbGetAll('customers');
agentData=await dbGetAll('agents');
allTransactionsData=await dbGetAll('transactions');

applyDueData(dueData);
sortCustomersAZ(customerData);
sortTransactionsNewestFirst(allTransactionsData);

dataLoaded=
customerData.length>0||
agentData.length>0||
allTransactionsData.length>0||
!!dataVersion;

renderLocalData()
}


/* =========================================================
   CUSTOMERS / DUE
========================================================= */

function sortCustomersAZ(list){
return list.sort((a,b)=>
String(a.customerName||a.name||'').trim()
.localeCompare(
String(b.customerName||b.name||'').trim(),
'en',
{sensitivity:'base',numeric:true}
)
)
}

function calculateCustomerDueFromTransactions(customerId){
const id=String(customerId||'').trim();
if(!id)return 0;

let due=0;
allTransactionsData.forEach(t=>{
if(String(t.customerId||'').trim()!==id)return;
const kd=number(
t.kdAmount!==undefined?t.kdAmount:
t.amountKD!==undefined?t.amountKD:t.kd
);
if(kd<=0)return;
if(isDueTransaction(t))due+=kd;
else if(isPaymentTransaction(t))due-=kd;
/* নগদ → প্রভাব নেই */
});
return Math.max(0,due)
}

function getCustomerDue(customer){
if(!customer)return 0;
return calculateCustomerDueFromTransactions(customer.customerId)
}

function applyDueData(data){
if(!data)return;

const source=
data.due&&typeof data.due==='object'?data.due:
data.customerDue&&typeof data.customerDue==='object'?data.customerDue:
data;

const hasCustomers=Array.isArray(source.customers);
const incomingTotal=
source.totalDueKD!==undefined?source.totalDueKD:data.totalDueKD;

if(incomingTotal!==undefined||hasCustomers){
dueData={
totalDueKD:
incomingTotal!==undefined?number(incomingTotal):
number(dueData.totalDueKD||0),
customers:
hasCustomers?source.customers:
(Array.isArray(dueData.customers)?dueData.customers:[])
};

}

);

})
}

async function saveCustomersLocal(items){

items.forEach(x=>s.put(x));

})
}

async function saveAgentsLocal(items){

if(!Array.isArray(items))return;

items.forEach(x=>s.put(x));
return new Promise((r,j)=>{

t.onerror=()=>j(t.error)
})
}

function transactionKey(t){
const id=String(t.transactionId||t.TransactionId||'').trim();
if(id)return'TX:'+id;

const row=Number(t.rowNumber||t.row||t.rowIndex||t.RowNumber||0)||0;
if(row)return'ROW:'+row;

return'TMP:'+String(
t.timestamp||
JSON.stringify([
t.date||'',t.customerId||'',
t.kdAmount||'',t.bdAmount||'',t.type||''
])
)
}

async function saveTransactionsLocal(items){
if(!Array.isArray(items)||!items.length)return;

const t=db.transaction('transactions','readwrite');
const s=t.objectStore('transactions');

items.forEach(item=>{
const c={...item};
c.key=transactionKey(c);
s.put(c)
});

return new Promise((r,j)=>{
t.oncomplete=r;
t.onerror=()=>j(t.error)
})
}

async function transactionExistsLocal(transactionId){
const id=String(transactionId||'').trim();
if(!id)return false;
const key='TX:'+id;
const existing=await dbGet('transactions',key);
return!!existing
}

function getTransactionTimestamp(t){
const v=
t.timestamp||t.Timestamp||t.createdAt||
t.created_at||t.time||t.createdTime||'';
if(!v)return 0;
const n=new Date(v).getTime();
return Number.isFinite(n)?n:0
}

function getTransactionRowNumber(t){
return Number(t.rowNumber||t.row||t.rowIndex||t.RowNumber||0)||0
}

function sortTransactionsNewestFirst(list){
return list.sort((a,b)=>{
const ra=getTransactionRowNumber(a);
const rb=getTransactionRowNumber(b);
if(ra!==rb)return rb-ra;

const ta=getTransactionTimestamp(a);
const tb=getTransactionTimestamp(b);
if(ta!==tb)return tb-ta;

const da=getFullTransactionDate(
a.date||a.Date||a.transactionDate||a.TransactionDate||''
)?.getTime()||0;

const dbDate=getFullTransactionDate(
b.date||b.Date||b.transactionDate||b.TransactionDate||''
)?.getTime()||0;

if(da!==dbDate)return dbDate-da;

return String(b.transactionId||b.TransactionId||'')
.localeCompare(String(a.transactionId||a.TransactionId||''))
})
}

async function loadTransactionsLocal(){
allTransactionsData=await dbGetAll('transactions');
sortTransactionsNewestFirst(allTransactionsData)
}

function getCustomerTransactions(customerId){
return allTransactionsData.filter(
t=>String(t.customerId||'')===String(customerId)
)
}

function toWhatsAppNumber(phone){
  let p = String(phone||'').trim();
  if(!p) return '';

  p = p.replace(/\D/g,'');
  if(!p) return '';

  if(p.startsWith('880')) return p;
  if(p.startsWith('965')) return p;

  if(p.startsWith('0')){
    if(p.length===11) return '880'+p.slice(1);
    if(p.length===9) return '965'+p.slice(1);
    return '880'+p.slice(1);
  }

  if(p.length===8) return '965'+p;

  if(p.length===10 && p.startsWith('1')) return '880'+p;

  if(p.length<=10) return '880'+p;

  return p;
}

function renderCustomerTransactionsLocal(customerId){
const list=$('customerList');
const transactions=getCustomerTransactions(customerId);
const customer=findCustomer(customerId);

if(customer){
$('selectedDueAmount').innerHTML=
fmtKD(getCustomerDue(customer))+' <span>KD</span>'
}

list.innerHTML='';

if(!transactions.length){
addEmpty(list,'No Transaction found');
return
}

const chronological=[...transactions].sort((a,b)=>{
const ra=getTransactionRowNumber(a);
const rb=getTransactionRowNumber(b);
if(ra!==rb)return ra-rb;

const ta=getTransactionTimestamp(a);
const tb=getTransactionTimestamp(b);
if(ta!==tb)return ta-tb;

const da=getFullTransactionDate(
a.date||a.Date||a.transactionDate||a.TransactionDate||''
)?.getTime()||0;

const dbDate=getFullTransactionDate(
b.date||b.Date||b.transactionDate||b.TransactionDate||''
)?.getTime()||0;

if(da!==dbDate)return da-dbDate;

return String(a.transactionId||a.TransactionId||'')
.localeCompare(String(b.transactionId||b.TransactionId||''))
});

let running=0;
const balanceMap=new Map();

chronological.forEach(t=>{
const kd=number(
t.kdAmount!==undefined?t.kdAmount:
t.amountKD!==undefined?t.amountKD:t.kd
);

if(kd>0){
if(isDueTransaction(t))running+=kd;
else if(isPaymentTransaction(t))running-=kd;
}

balanceMap.set(transactionKey(t),running)
});

const ordered=[...transactions];
sortTransactionsNewestFirst(ordered);

const f=document.createDocumentFragment();

ordered.forEach(t=>{
const bal=balanceMap.get(transactionKey(t));
f.appendChild(createTransactionCard(t,false,bal))
});

list.appendChild(f);

}

/* =========================================================

function createTransactionCard(t,showCustomer,runningBalance){

const sale=isDueTransaction(t);
const payment=isPaymentTransaction(t);
const cash=isCashTransaction(t);

/* ⭐ Agent login করলে customer নাম hide করি */
const isAgentRole = getRole()==='agent';

const txn=document.createElement('div');
txn.className='tl '+(sale?'sale':payment?'payment':cash?'cash':'')+(showCustomer?' all':' single');

/* -------- 1. DATE -------- */

const date=document.createElement('div');
date.className='tl-date';

const dateStr=
t.date||t.Date||t.transactionDate||t.TransactionDate||'';
const parsed=parseDateParts(dateStr);

const daySpan=document.createElement('span');
daySpan.className='d';
daySpan.textContent=parsed.day||dateStr;

const monthSpan=document.createElement('span');
monthSpan.className='m';
monthSpan.textContent=parsed.month||'';

const yearSpan=document.createElement('span');
yearSpan.className='y';
yearSpan.textContent=parsed.year||'';

date.appendChild(daySpan);
date.appendChild(monthSpan);
date.appendChild(yearSpan);
txn.appendChild(date);

/* -------- 2. DIVIDER -------- */

const line=document.createElement('div');
line.className='tl-line';
txn.appendChild(line);

/* -------- 3. MID -------- */

const mid=document.createElement('div');
mid.className='tl-mid';

const kdAmount=number(
t.kdAmount!==undefined?t.kdAmount:
t.amountKD!==undefined?t.amountKD:t.kd
);

const amtEl=document.createElement('span');
amtEl.className='tl-amt-left';
amtEl.textContent=
(payment?'−':sale?'+':cash?'+':'')+fmtKD(kdAmount)+' KD';
mid.appendChild(amtEl);

const note=String(t.note||'').trim();
const bdAmount=getBDAmount(t);

let noteText=note;
if(bdAmount){
noteText+=(noteText?' • ':'')+fmtIndian(bdAmount)+' TK';
}

if(noteText){
const noteEl=document.createElement('span');
noteEl.className='tl-note';
noteEl.textContent=noteText;
mid.appendChild(noteEl);
}

if(runningBalance!==undefined&&runningBalance!==null){
const bal=document.createElement('span');
bal.className='tl-bal-bottom';
bal.textContent='বাকি '+fmtKD(Math.max(0,runningBalance));
mid.appendChild(bal);
}

txn.appendChild(mid);

/* -------- 4. RIGHT -------- */

const right=document.createElement('div');
right.className='tl-right';

if(showCustomer){
const custLine=document.createElement('div');
custLine.className='tl-cust-line';

const hasCustomer=!!String(t.customerId||'').trim();

/* ⭐ Agent হলে customer নাম hide */
if(!isAgentRole){
const custName=document.createElement('span');
custName.textContent=hasCustomer
  ?(t.customerName||'Unknown')
  :'(No Customer)';
custLine.appendChild(custName);
}

/* type badge — বিক্রয়/পেমেন্ট/নগদ ক্লিকেবল */
if(sale||payment||cash){
const typeSpan=document.createElement('span');
typeSpan.className='tl-type-inline'+(cash?' cash':'');
typeSpan.textContent=sale?'বিক্রয়':payment?'পেমেন্ট':cash?'নগদ':'';

if(sale||cash){
typeSpan.style.cursor='pointer';
typeSpan.title='টাইপ পরিবর্তন করুন';
typeSpan.addEventListener('click',e=>{
e.stopPropagation();
openTypeTogglePopup(e,t);
});
}

custLine.appendChild(typeSpan);
}

if(hasCustomer && !isAgentRole){
  custLine.style.cursor='pointer';
  custLine.addEventListener('click',e=>{
    e.stopPropagation();
    filterByCustomer(t.customerId)
  });
}else if(!isAgentRole){
  custLine.style.cursor='default';
  custLine.style.opacity='0.65';
}

right.appendChild(custLine);

/* =========================================================
   DATE MATCHING
========================================================= */

function transactionMatchesDate(transaction,selectedDate){
if(!selectedDate)return true;

const td=getFullTransactionDate(
transaction.date||
transaction.Date||
transaction.transactionDate||
transaction.TransactionDate||''
);

const sd=getFullTransactionDate(selectedDate);

if(!td||!sd)return false;

return(
td.getFullYear()===sd.getFullYear()&&
td.getMonth()===sd.getMonth()&&
td.getDate()===sd.getDate()
)
}

function getFullTransactionDate(value){
if(!value)return null;

const str=String(value).trim();
if(!str)return null;

let date,match;

match=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(.+))?$/);
if(match){
date=new Date(
Number(match[1]),
Number(match[2])-1,
Number(match[3])
);
return isNaN(date.getTime())?null:date
}

match=str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})(?:[T\s]+(.+))?$/);
if(match){
const months={
jan:1,feb:2,mar:3,apr:4,may:5,jun:6,
jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
};
const m=months[match[2].toLowerCase()];
if(m){
date=new Date(Number(match[3]),m-1,Number(match[1]));
return isNaN(date.getTime())?null:date
}
}

match=str.match(/^(\d{1,2})-(\d{1,2})-(\d{4})(?:[T\s]+(.+))?$/);
if(match){
date=new Date(
Number(match[3]),
Number(match[2])-1,
Number(match[1])
);
return isNaN(date.getTime())?null:date
}

date=new Date(str);
return isNaN(date.getTime())?null:date
}

function normalizeType(value){
return String(value||'')
.trim()
.toLowerCase()
.replace(/\s+/g,' ')
.replace(/^[+-]\s*/,'')
.trim()
}

function isDueTransaction(t){
const type=normalizeType(
t.type||t.Type||t.transactionType||t.TransactionType
);
return['বাকি','due','due amount','বিক্রয়','sale'].includes(type)
}

function isPaymentTransaction(t){
const type=normalizeType(
t.type||t.Type||t.transactionType||t.TransactionType
);
return['পেমেন্ট','payment','জমা','paid','payment amount'].includes(type)
}

function isCashTransaction(t){
const type=normalizeType(
t.type||t.Type||t.transactionType||t.TransactionType
);
return['নগদ','cash','cash sale','cash payment'].includes(type)
}

const allMonths = monthRaw==='all';

const month=allMonths ? null : Number(monthRaw);

t.date||t.Date||t.transactionDate||t.TransactionDate

sales+=amount
}
});

setAgentNumbers(balance,sales)
}

/* =========================================================
   AGENT DATE PARSER
========================================================= */

function parseTransactionDate(value){
if(!value)return null;
const str=String(value).trim();
if(!str)return null;

let m=str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
if(m){
const months={
jan:1,feb:2,mar:3,apr:4,may:5,jun:6,
jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
};
const month=months[m[2].toLowerCase()];
if(month)return{year:Number(m[3]),month}
}

m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
if(m)return{year:Number(m[1]),month:Number(m[2])};

m=str.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
if(m)return{year:Number(m[3]),month:Number(m[2])};

const d=new Date(str);
return isNaN(d.getTime())?null:{year:d.getFullYear(),month:d.getMonth()+1}
}

function getBDAmount(t){
return number(
t.bdAmount!==undefined&&t.bdAmount!==''?t.bdAmount:
t.amountBD!==undefined&&t.amountBD!==''?t.amountBD:t.bd
)
}

/* =========================================================
   AGENT FILTER
========================================================= */

function setupAgentDateFilters(){
const y=$('agentYear');
const m=$('agentMonth');

const now=new Date();
const cy=now.getFullYear();
const cm=now.getMonth()+1;

/* ⭐ ডাটাবেস থেকে শুধু সেই বছরগুলো বের করি যেগুলোতে ট্রানজেকশন আছে */
const yearsSet=new Set();
allTransactionsData.forEach(t=>{
  const i=parseTransactionDate(
    t.date||t.Date||t.transactionDate||t.TransactionDate
  );
  if(i && i.year) yearsSet.add(i.year);
});

/* যদি কোনো ট্রানজেকশন না থাকে, বর্তমান বছর দেখাই */
if(!yearsSet.size) yearsSet.add(cy);

const sortedYears=Array.from(yearsSet).sort((a,b)=>b-a);

/* ── Year dropdown ── */
y.innerHTML='';

const allOpt=document.createElement('option');
allOpt.value='all';
allOpt.textContent='All Transaction';
y.appendChild(allOpt);

sortedYears.forEach(year=>{
  const o=document.createElement('option');
  o.value=year;
  o.textContent=year;
  if(year===cy) o.selected=true;
  y.appendChild(o);
});

/* যদি বর্তমান বছর খুঁজে না পাও, তবে সব থেকে নতুন বছর সিলেক্ট */
if(!sortedYears.includes(cy)) y.value=String(sortedYears[0]);

/* ── Month dropdown ── */
const months=[
'January','February','March','April','May','June',
'July','August','September','October','November','December'
];

m.innerHTML='';

const allMOpt=document.createElement('option');
allMOpt.value='all';
allMOpt.textContent='All Transaction';
m.appendChild(allMOpt);

months.forEach((x,i)=>{
const o=document.createElement('option');
o.value=i+1;
o.textContent=x;
if(i+1===cm)o.selected=true;
m.appendChild(o)
});

y.onchange=()=>{if($('agentView').value)renderAgentTransactions()};
m.onchange=()=>{if($('agentView').value)renderAgentTransactions()}
}


/* =========================================================
   HEADER RATE
========================================================= */

function calculateHeaderRate(){
let value=String($('headerRateAmount').value)
.replace(/[০-৯]/g,d=>'0123456789'['০১২৩৪৫৬৭৮৯'.indexOf(d)])
.replace(/[^0-9]/g,'');

const popup=$('headerRatePopup');
if(!value){popup.classList.remove('show');return}

const amount=parseInt(value,10);
if(!Number.isFinite(amount)||amount<=0){
popup.classList.remove('show');
return
}

const rate=
amount<1000?HEADER_RATE_1:
amount%1000===0?HEADER_RATE_2:HEADER_RATE_3;

const kd=amount/rate;

$('headerRateAmount').value=
Math.floor(amount).toLocaleString('en-IN');

$('headerRatePopupAmount').textContent=
Math.floor(amount*1.02).toLocaleString('en-IN')+' Tk';

$('headerRatePopupKD').textContent=
kd.toFixed(3)+' KD';

popup.classList.add('show')
}


/* =========================================================
   PROFIT
========================================================= */

function calculateProfitPopup(){
const kd=number($('kdAmount').value);
const bd=number($('bdAmount').value);
const popup=$('profitPopup');

if(kd<=0||bd<=0){
popup.classList.remove('show');

const profit=kd*400-bd;

popup.textContent=
'Profit '+
(profit<0?'-':'')+
Number(Math.abs(profit.toFixed(3)))
.toLocaleString('en-IN')+' Tk';

popup.classList.add('show')
}

/* =========================================================
   API
========================================================= */

async function getAPI(action,params={}){
const q=new URLSearchParams();
q.set('action',action);

Object.keys(params).forEach(k=>{
const v=params[k];
if(v!==undefined&&v!==null&&v!=='')q.set(k,v)
});

const r=await fetch(API+'?'+q.toString(),{
method:'GET',
cache:'no-store'
});

return r.json()
}

async function postAPI(data,timeout=15000){
const controller=new AbortController();
const timer=setTimeout(()=>{controller.abort()},timeout);

try{
const r=await fetch(API,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify(data),
cache:'no-store',
signal:controller.signal
});

const text=await r.text();
if(!text)throw new Error('Empty server response');

try{return JSON.parse(text)}
catch(e){throw new Error('Invalid server response')}
}
finally{clearTimeout(timer)}
}


/* =========================================================
   TRANSACTION HELPERS
========================================================= */

function createTransactionId(){
return(
'TXN-'+
Date.now().toString(36).toUpperCase()+'-'+
Math.random().toString(36).substring(2,10).toUpperCase()
)
}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms))
}

async function verifySavedTransaction(transactionId){
if(!transactionId)return null;

try{
const result=await getAPI('verifyTransaction',{transactionId});
if(!result||!result.success)return null;

const data=result.data||{};
if(data.found&&data.transaction)return data.transaction;
return null
}catch(e){
console.error('Transaction verify error:',e);
return null
}
}

async function verifyWithRetry(transactionId){
let tx=await verifySavedTransaction(transactionId);
if(tx)return tx;

await sleep(900);
tx=await verifySavedTransaction(transactionId);
if(tx)return tx;

return null
}

async function safePostTransaction(payload){
let lastResult=null;

try{lastResult=await postAPI(payload,15000)}
catch(e){console.warn('POST attempt 1 failed:',e)}

if(lastResult&&lastResult.success){
return{success:true,result:lastResult,transaction:null}
}

let verified=await verifyWithRetry(payload.transactionId);

if(verified){
return{success:true,result:lastResult,transaction:verified,verified:true}
}

return{success:false,result:lastResult,transaction:null,verified:false}
}


/* =========================================================
   BOOTSTRAP
========================================================= */

async function applyBootstrap(data){
const localAll=await dbGetAll('transactions');
const pendingLocal=localAll.filter(t=>t.pending===true);

const serverCustomers=Array.isArray(data.customers)?data.customers:[];
const serverAgents=Array.isArray(data.agents)?data.agents:[];
const serverTransactions=Array.isArray(data.transactions)?data.transactions:[];

const serverIds=new Set(
serverTransactions.map(t=>String(t.transactionId||'').trim())
);

const mergedTransactions=[
...serverTransactions.map(t=>({...t,pending:false})),
...pendingLocal.filter(
pt=>!serverIds.has(String(pt.transactionId||'').trim())
)
];

customerData=serverCustomers;
agentData=serverAgents;
allTransactionsData=mergedTransactions;

sortCustomersAZ(customerData);
sortTransactionsNewestFirst(allTransactionsData);

notesData={
dueNotes:
Array.isArray(data.dueNotes)&&data.dueNotes.length?
data.dueNotes:DUE_NOTES,
paymentNotes:
Array.isArray(data.paymentNotes)&&data.paymentNotes.length?
data.paymentNotes:PAYMENT_NOTES
};
notesLoaded=true;

dataVersion=data.version||'';
txVersion=data.txVersion||'';
customerVersion=data.customerVersion||'';
agentVersion=data.agentVersion||'';
settingsVersion=data.settingsVersion||'';
lastTransactionRow=Number(data.lastTransactionRow||0)||0;

applyDueData(data);

if(data.totalDueKD!==undefined)totalDueKD=number(data.totalDueKD);

await saveCustomersLocal(customerData);
await saveAgentsLocal(agentData);
await dbClear('transactions');
await saveTransactionsLocal(allTransactionsData);

dataLoaded=true;
await saveLocalState();
renderLocalData()
}

async function initialBootstrap(){
if(bootstrapPromise)return bootstrapPromise;

bootstrapPromise=(async()=>{
try{
showSync('Loading...','syncing');
const r=await getAPI('bootstrap');
if(!r.success)throw new Error(r.error||'Bootstrap loading failed');

await applyBootstrap(r.data||{});
showSync('Synced ✓','synced');
return true
}
catch(e){
console.error(e);
showSync('Load error','error');
showInitialDataError(e.message||'Data loading error');
return false
}
finally{bootstrapPromise=null}
})();

return bootstrapPromise
}


/* =========================================================
   SYNC PENDING
========================================================= */

async function syncPendingTransactions(){
if(!navigator.onLine||!currentUser)return false;
if(pendingSyncRunning)return false;

pendingSyncRunning=true;

try{
await openDB();
const all=await dbGetAll('transactions');
const pending=all.filter(t=>t.pending===true);

if(!pending.length)return true;

showSync('Syncing...','syncing');
let changed=false;

for(const tx of pending){
if(!navigator.onLine||!currentUser)break;

const transactionId=String(tx.transactionId||'').trim();
if(!transactionId)continue;

if(tx.pendingTypeUpdate===true){
try{
const r=await postAPI({
  action:'updateTransactionType',
  username:currentUser?.username||'',
  role:currentUser?.role||'',
  transactionId,
  type:tx.type
});
if(r&&r.success){
const updated={...tx,pending:false,pendingTypeUpdate:false};
await saveTransactionsLocal([updated]);
const idx=allTransactionsData.findIndex(
 t=>String(t.transactionId||'').trim()===transactionId
);
if(idx>=0)allTransactionsData[idx]=updated;
changed=true;
}
}catch(e){console.warn('Type update sync failed:',e)}
continue;
}

const payload={
action:'addTransaction',
username:currentUser?.username||'',
role:currentUser?.role||'',
date:tx.date,
customerId:tx.customerId,
customerName:tx.customerName||'',
agentName:tx.agentName||'',
agentOption:tx.agentOption||'',
kdAmount:tx.kdAmount,
bdAmount:tx.bdAmount,
type:tx.type,
note:tx.note,
transactionId
};

let safeResult=null;
try{safeResult=await safePostTransaction(payload)}
catch(e){console.warn('Sync failed:',e)}

if(safeResult&&safeResult.success){
const s=safeResult.result?.data||{};

const serverTransaction=
safeResult.transaction||
(s.transaction&&typeof s.transaction==='object'?
s.transaction:null);

const updated={
...tx,
rowNumber:
serverTransaction?.rowNumber||s.rowNumber||tx.rowNumber||0,
timestamp:
serverTransaction?.timestamp||s.timestamp||tx.timestamp,
pending:false
};

await saveTransactionsLocal([updated]);

const idx=allTransactionsData.findIndex(
t=>String(t.transactionId||'').trim()===transactionId
);

if(idx>=0)allTransactionsData[idx]=updated;
else allTransactionsData.push(updated);

if(s.version!==undefined)dataVersion=String(s.version);
if(s.txVersion!==undefined)txVersion=String(s.txVersion);

if(updated.rowNumber){
lastTransactionRow=Math.max(lastTransactionRow,Number(updated.rowNumber))
}

changed=true
}
}

if(changed){
await saveLocalState();
renderLocalData();
showSync('Synced ✓','synced')
}

return changed
}
catch(e){
console.error('syncPendingTransactions error:',e);
showSync('Sync failed','error');
return false
}
finally{pendingSyncRunning=false}
}


/* =========================================================
   SYNC DATA
========================================================= */

async function syncData(force=false){
if(syncRunning||!currentUser)return false;

syncRunning=true;

try{
await openDB();
await syncPendingTransactions();

if(force||!dataVersion){
const result=await initialBootstrap();
if(getRole()==='agent'&&$('agentView').value)agentChanged();
return result
}

let serverVersion='';
let serverTxVersion='';

try{
const result=await getAPI('version');
if(result&&result.success){
serverVersion=String(result.data?.version||'');
serverTxVersion=String(result.data?.txVersion||'')
}
}catch(e){
console.log('Version check failed:',e);
return false
}

const versionChanged=
serverVersion&&serverVersion!==String(dataVersion);
const txVersionChanged=
serverTxVersion&&serverTxVersion!==String(txVersion);

if(versionChanged||txVersionChanged){
const result=await initialBootstrap();
if(getRole()==='agent'&&$('agentView').value)agentChanged();
return result
}

return true
}
catch(e){
console.error('Sync Error:',e);
return false
}
finally{syncRunning=false}
}


/* =========================================================
   BACKGROUND SYNC
========================================================= */

function startBackgroundSync(){
stopBackgroundSync();
syncData();

syncTimer=setInterval(()=>{
if(currentUser&&navigator.onLine)syncData()
},SYNC_INTERVAL)
}

function stopBackgroundSync(){
if(syncTimer){clearInterval(syncTimer);syncTimer=null}
}

document.addEventListener('visibilitychange',()=>{
if(document.visibilityState==='visible'&&currentUser){
syncData();
if(!syncTimer)startBackgroundSync()
}
});

window.addEventListener('online',()=>{
if(currentUser)syncData()
});

window.addEventListener('offline',()=>{
showSync('Offline','pending')
});

async function saveTransaction(){

if(getRole()!=='admin'){

return
}

const date=$('date').value;
const agentId=$('agentSelect').value;
const customerId=$('customerSelect').value;
const kd=number($('kdAmount').value);
const bd=number($('bdAmount').value);
const note=$('noteSelect').value;

const agentOptionVisible=
agentOptionField&&!agentOptionField.classList.contains('hidden');

const agentOption=agentOptionVisible?
($('agentOptionSelect')?.value||''):'';

if(!date)return showSaveError('Date required');

if(kd>0&&!customerId)
return showSaveError('KD Amount দিলে Customer নির্বাচন করুন');

if(bd>0&&!agentId)
return showSaveError('BD Amount দিলে Agent নির্বাচন করুন');

if(kd<=0&&bd<=0)
return showSaveError('KD অথবা BD Amount দিন');

const selectedDate=new Date(date+'T00:00:00');
const today=new Date();
today.setHours(0,0,0,0);

if(selectedDate>today)
return showSaveError('Future date দেওয়া যাবে না');

const agent=agentData.find(a=>String(a.agentId)===String(agentId));
const customer=customerData.find(c=>String(c.customerId)===String(customerId));

if(kd>0&&!customer)return showSaveError('Customer not found');
if(bd>0&&!agent)return showSaveError('Agent not found');

isSavingTransaction=true;

const button=$('saveBtn');
const message=$('saveMsg');

const savedCustomerPageId=$('customerPageSelect').value;
const savedAgentId=$('agentSelect').value;

const transactionId=createTransactionId();
const formattedDate=formatDate(date);

const localTransaction={
date:formattedDate,
customerId,
customerName:customer?.customerName||'',
kdAmount:kd,
bdAmount:bd,
type:transactionType,
note,
agentOption,
transactionId,
timestamp:new Date().toISOString(),
agentName:agent?.agentName||'',
rowNumber:0,
pending:true
};

button.disabled=true;
button.textContent='Saving...';
message.textContent='';
message.className='msg';

try{
const exists=await transactionExistsLocal(transactionId);
if(exists)throw new Error('Duplicate transaction id detected');

await saveTransactionsLocal([localTransaction]);

const localKey=transactionKey(localTransaction);
const duplicateLocal=allTransactionsData.some(
t=>transactionKey(t)===localKey
);

if(!duplicateLocal)allTransactionsData.push(localTransaction);

customerData.forEach(c=>{
c.totalDueKD=calculateCustomerDueFromTransactions(c.customerId)
});

updateTotalDue();
await saveLocalState();
renderLocalData();

$('kdAmount').value='';
$('bdAmount').value='';
calculateProfitPopup();

message.className='msg success';
message.textContent='✓ Saved';

/* ⭐ Saved message 2 সেকেন্ড পর চলে যাবে */
if(saveMsgTimeout){
clearTimeout(saveMsgTimeout);
saveMsgTimeout=null;
}
saveMsgTimeout=setTimeout(()=>{
message.textContent='';
message.className='msg';
saveMsgTimeout=null;
},3000);

showSync('Syncing...','syncing');

if(
savedAgentId&&
[...$('agentButtonRow').querySelectorAll('.agent-btn')]
.some(b=>b.dataset.agentId===savedAgentId)
){
savedAgentSelection=savedAgentId;
$('agentSelect').value=savedAgentId;

$('agentButtonRow').querySelectorAll('.agent-btn')
.forEach(b=>{
b.classList.toggle(
'active',
b.dataset.agentId===savedAgentId
)
})
}

$('customerSelect').value='';
$('customerSelect').classList.remove('has-value');

if(
savedCustomerPageId&&
[...$('customerPageSelect').options]
.some(o=>o.value===savedCustomerPageId)
){
$('customerPageSelect').value=savedCustomerPageId;

if(savedCustomerPageId==='ALL_TRANSACTIONS'){
renderAllCustomerTransactions()
}else{
const c=findCustomer(savedCustomerPageId);

renderCustomerInfo(c);
renderCustomerTransactionsLocal(c.customerId)
}
}
}

setTimeout(()=>{syncPendingTransactions()},50)
}
catch(e){

showSaveError('Save failed: '+(e.message||e));
showSync('Save failed','error')
}
finally{
button.disabled=false;
button.textContent='💾 Save';
isSavingTransaction=false
}
}

/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHTML(value){
return String(value===null||value===undefined?'':value)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;')
}

function showInitialDataError(message){
if($('customerList')&&!dataLoaded){
$('customerList').innerHTML=
'<div class="empty">'+
escapeHTML(message||'Unable to load data')+
'</div>'
}
}

'<div class="selected-name">All Transaction</div>'+
'<div class="selected-phone">All Active Customers</div>';
$('selectedDueAmount').innerHTML='All';

updateTotalDue();
renderAllCustomerTransactions();
return
}

const c=findCustomer(id);

if(!c){
$('selectedCustomerInfo').innerHTML=
'<div class="selected-empty">Customer not found</div>';
$('selectedDueAmount').innerHTML='0.000 <span>KD</span>';
list.innerHTML='<div class="empty">Customer not found</div>';
setTimeout(adjustListHeights,30);
return
}

renderCustomerInfo(c);
renderCustomerTransactionsLocal(c.customerId)
});

$('customerSearch').addEventListener('input',function(){
const id=$('customerPageSelect').value;
updateCustomerDropdown();

const s=$('customerPageSelect');
if(id&&[...s.options].some(o=>o.value===id))s.value=id;

setTimeout(adjustListHeights,50)
});

$('customerTransactionDate').addEventListener('change',function(){
if($('customerPageSelect').value==='ALL_TRANSACTIONS'){
renderAllCustomerTransactions()
}
});


/* =========================================================
   KEYBOARD
========================================================= */

$('bdAmount').addEventListener('keydown',e=>{
if(e.key==='Enter'||e.keyCode===13){
e.preventDefault();
saveTransaction()
}
});

$('password').addEventListener('keydown',e=>{
if(e.key==='Enter')login()
});


/* =========================================================
   SELECT STYLE
========================================================= */

$('customerSelect').addEventListener('change',function(){
this.classList.toggle('has-value',this.value!=='')
});

$('agentOptionSelect').addEventListener('change',function(){
savedAgentOptionSelection=this.value
});


/* =========================================================
   SETUP
========================================================= */

setupSafeSelectRefresh();
disableAutofill();
setupKeyboardSaveButton();

restoreLogin();

</script>


<script>

if('serviceWorker' in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker
.register('./service-worker.js')
.then(()=>{
console.log('PWA Service Worker registered')
})
.catch(err=>console.error('Service Worker error:',err))
})
}

</script>
