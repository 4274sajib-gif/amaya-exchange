/* =====================================================
API
===================================================== */

const API =
'https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';


/* =====================================================
STATE
===================================================== */

let currentUser=null;

let transactionType='বাকি';

let customerData=[];

let agentData=[];

let notesData={
dueNotes:[],
paymentNotes:[]
};


/* =====================================================
GET API
===================================================== */

async function getAPI(action,params={}){

const query=new URLSearchParams();

query.set('action',action);

Object.keys(params).forEach(function(key){

const value=params[key];

if(
value!==undefined &&
value!==null &&
value!==''
){

query.set(key,value);

}

});

const response=
await fetch(
API+'?'+query.toString(),
{
method:'GET',
cache:'no-store'
}
);

return await response.json();

}


/* =====================================================
POST API
===================================================== */

async function postAPI(data){

const response=
await fetch(
API,
{
method:'POST',
headers:{
'Content-Type':'text/plain;charset=utf-8'
},
body:JSON.stringify(data)
}
);

return await response.json();

}


/* =====================================================
TABS
===================================================== */

function openTab(tab,button){

document
.querySelectorAll('.panel')
.forEach(function(panel){

panel.classList.remove('active');

});


document
.querySelectorAll('.tab')
.forEach(function(btn){

btn.classList.remove('active');

});


if(tab==='transaction'){

document
.getElementById('panelTransaction')
.classList.add('active');

}


if(tab==='customer'){

document
.getElementById('panelCustomer')
.classList.add('active');

}


if(tab==='agent'){

document
.getElementById('panelAgent')
.classList.add('active');

}


if(button){

button.classList.add('active');

}

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const username=
document
.getElementById('username')
.value
.trim();

const password=
document
.getElementById('password')
.value;

const msg=
document
.getElementById('loginMsg');

const btn=
document
.getElementById('loginBtn');


if(!username || !password){

msg.className='msg error';

msg.textContent=
'Username and password required';

return;

}


btn.disabled=true;

btn.textContent='Logging in...';

msg.textContent='';


try{

const result=
await getAPI(
'login',
{
username:username,
password:password
}
);


if(!result.success){

msg.className='msg error';

msg.textContent=
result.error ||
'Login failed';

return;

}


currentUser=result.data;


localStorage.setItem(
'amaya_user',
JSON.stringify(currentUser)
);


showApp();

}
catch(error){

console.error(error);

msg.className='msg error';

msg.textContent=
'Connection error';

}
finally{

btn.disabled=false;

btn.textContent='Login';

}

}


/* =====================================================
RESTORE LOGIN
===================================================== */

function restoreLogin(){

try{

const saved=
localStorage.getItem('amaya_user');

if(!saved){

return;

}


const user=
JSON.parse(saved);

if(user && user.loggedIn){

currentUser=user;

showApp();

}

}
catch(error){

localStorage.removeItem('amaya_user');

}

}


/* =====================================================
SHOW APP
===================================================== */

function showApp(){

document
.getElementById('loginPage')
.classList.add('hidden');

document
.getElementById('app')
.classList.remove('hidden');


document
.getElementById('userInfo')
.textContent=
(currentUser.username||'User')+
(
currentUser.role
?' • '+currentUser.role
:''
);


setToday();

loadAllData();

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

currentUser=null;

localStorage.removeItem('amaya_user');


document
.getElementById('app')
.classList.add('hidden');

document
.getElementById('loginPage')
.classList.remove('hidden');


document
.getElementById('username')
.value='';

document
.getElementById('password')
.value='';

}


/* =====================================================
TODAY
===================================================== */

function setToday(){

const input=
document.getElementById('date');

const d=new Date();

const yyyy=
d.getFullYear();

const mm=
String(
d.getMonth()+1
).padStart(2,'0');

const dd=
String(
d.getDate()
).padStart(2,'0');


const today=
yyyy+'-'+mm+'-'+dd;


input.value=today;

input.max=today;

}

LOAD ALL
===================================================== */

}


/* =====================================================
CUSTOMERS
===================================================== */

async function loadCustomers(){

const list=
document.getElementById(
'customerList'
);


list.innerHTML=
'<div class="empty">Select a customer</div>';


try{

const result=
await getAPI('customers');


console.log(
'CUSTOMERS',
result
);


if(!result.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(
result.error ||
'Customer loading failed'
)+
'</div>';

return;

}


customerData=
Array.isArray(result.data)
?result.data
:[];


/* =====================================================
ADD TRANSACTION CUSTOMER DROPDOWN
ALL ACTIVE CUSTOMERS
===================================================== */

const transactionSelect=
document.getElementById(
'customerSelect'
);


transactionSelect.innerHTML=
'<option value="">Select Customer</option>';


customerData.forEach(function(customer){

const option=
document.createElement('option');


option.value=
customer.customerId;


option.textContent=
customer.customerName+
(
customer.phone
?' • '+customer.phone
:''
);


transactionSelect.appendChild(option);

});


/* =====================================================
CUSTOMER PAGE DROPDOWN
ONLY CUSTOMERS WITH DUE > 0
===================================================== */

const pageSelect=
document.getElementById(
'customerPageSelect'
);


pageSelect.innerHTML=
'<option value="">Select Customer</option>';


customerData.forEach(function(customer){

const due=
parseFloat(
String(
customer.totalDueKD || '0'
)
.replace(/,/g,'')
)||0;


if(due<=0){

return;

}


const option=
document.createElement('option');


option.value=
customer.customerId;


option.textContent=
customer.customerName+
(
customer.phone
?' • '+customer.phone
:''
);


pageSelect.appendChild(option);

});


/* =====================================================
TOTAL CUSTOMER DUE
===================================================== */

let totalDue=0;


customerData.forEach(function(customer){

totalDue+=
parseFloat(
String(
customer.totalDueKD || '0'
)
.replace(/,/g,'')
)||0;

});


document
.getElementById('allCustomerDue')
.innerHTML=
totalDue.toLocaleString(
'en-US',
{
minimumFractionDigits:3,
maximumFractionDigits:3
}
)+
' <span>KD</span>';


list.innerHTML=
'<div class="empty">Select a customer</div>';

}
catch(error){

console.error(error);

list.innerHTML=
'<div class="empty">'+
'Customer loading error'+
'</div>';

}

}


/* =====================================================
CUSTOMER SELECT
===================================================== */

document
.getElementById('customerPageSelect')
.addEventListener(
'change',
async function(){

const id=
this.value;


/*
Nothing selected
*/

if(!id){

document
.getElementById('customerList')
.innerHTML=
'<div class="empty">Select a customer</div>';

return;

}


const customer=
customerData.find(function(item){

return String(item.customerId)===
String(id);

document
.getElementById('customerList')
.innerHTML=
'<div class="empty">Customer not found</div>';

return;

}


/*
Render selected customer first.
*/

renderCustomers([customer]);

/* =====================================================
RENDER CUSTOMER
===================================================== */

function renderCustomers(data){

const list=
document.getElementById(
'customerList'
);


if(!data || !data.length){

list.innerHTML=
'<div class="empty">No customer found</div>';

return;

}


let html='';


data.forEach(function(customer){

html+=

'<div class="customer-card">'+

'<div class="customer-row">'+

'<div>'+

'<div class="customer-name">'+
escapeHTML(
customer.customerName
)+
'</div>'+

'<div class="phone">'+
escapeHTML(
customer.phone||''
)+
'</div>'+

'</div>'+

'<div class="due">'+

'<div class="due-label">'+
'Total Due'+
'</div>'+

'<div class="due-value">'+
escapeHTML(
customer.totalDueKD||'0.000'
)+
' <span class="kd-small">KD</span>'+

'</div>'+

'</div>'+

'</div>'+

'</div>';

});


list.innerHTML=html;


/*
Load selected customer's transactions.
*/

const customer=
data[0];

if(customer){

loadCustomerTransactions(
customer.customerId
);

}

}


/* =====================================================
CUSTOMER TRANSACTIONS
FIXED
===================================================== */

async function loadCustomerTransactions(customerId){

const list=
document.getElementById(
'customerList'
);


const loading=
document.createElement('div');

loading.id='customerTxnLoading';

loading.className='loading';

loading.textContent='Loading transactions...';

list.appendChild(loading);


try{

const result=
await getAPI(
'customerTransactions',
{
customerId:customerId
}
);


const currentLoading=
document.getElementById(
'customerTxnLoading'
);

if(currentLoading){

currentLoading.remove();

}


if(!result.success){

const errorBox=
document.createElement('div');

errorBox.className='empty';

errorBox.textContent=
result.error ||
'Unable to load transactions';

list.appendChild(errorBox);

return;

}


/*
IMPORTANT

Apps Script returns:

{
 success:true,
 data:[
   transaction,
   transaction
 ]
}

So result.data itself is the array.
*/

const transactions=
Array.isArray(result.data)
?result.data
:[];


if(!transactions.length){

const empty=
document.createElement('div');

empty.className='empty';

empty.textContent=
'No Transaction found';

list.appendChild(empty);

return;

}


transactions.forEach(function(t){

const txn=
document.createElement('div');

txn.className='txn';


const top=
document.createElement('div');

top.className='txn-top';


const date=
document.createElement('div');

date.className='txn-date';

date.textContent=
t.date||'';


const amount=
document.createElement('div');

amount.className='txn-amount';

amount.textContent=
(t.kdAmount||'0.000')+
' KD';


top.appendChild(date);

top.appendChild(amount);


const bottom=
document.createElement('div');

bottom.className='txn-bottom';


let bottomText=
t.type||'';


if(t.note){

bottomText+=
' • '+
t.note;

}


if(t.bdAmount){

bottomText+=
' • '+
t.bdAmount+
' Tk';

}


bottom.textContent=
bottomText;


txn.appendChild(top);

txn.appendChild(bottom);

list.appendChild(txn);

});

}
catch(error){

console.error(error);


const currentLoading=
document.getElementById(
'customerTxnLoading'
);

if(currentLoading){

currentLoading.remove();

}


const errorBox=
document.createElement('div');

errorBox.className='empty';

errorBox.textContent=
'Connection error';

list.appendChild(errorBox);

}

}


/* =====================================================
CUSTOMER SEARCH
===================================================== */

document
.getElementById('customerSearch')
.addEventListener(
'input',
function(){

const query=
this.value
.trim()
.toLowerCase();


const selectedId=
document
.getElementById(
'customerPageSelect'
)
.value;


if(!selectedId){

return;

}


const customer=
customerData.find(function(item){

return String(item.customerId)===
String(selectedId);

});


if(!customer){

return;

}


const matched=

String(
customer.customerName||''
)
.toLowerCase()
.includes(query)

||

String(
customer.phone||''
)
.toLowerCase()
.includes(query)

||

String(
customer.customerId||''
)
.toLowerCase()
.includes(query);


if(!query || matched){

renderCustomers([customer]);

}
else{

document
.getElementById('customerList')
.innerHTML=
'<div class="empty">No customer found</div>';

}

});

const agentId=

.value;


const list=
document.getElementById(
'agentList'

if(!agentId){

list.innerHTML=
'<div class="empty">Select an agent</div>';

return;

list.innerHTML=
'<div class="loading">Loading transactions...</div>';


try{

const result=
await getAPI(
'agentTransactions',
{
linkedId:agentId
}
);


if(!result.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(
result.error ||
'Unable to load transactions'
)+
'</div>';

return;

}


const transactions=
result.data &&
Array.isArray(
result.data.transactions
)
?result.data.transactions
:[];


if(!transactions.length){

list.innerHTML=
'<div class="empty">No BD transactions found</div>';

return;

}


let html='';


transactions.forEach(function(t){

html+=

'<div class="txn">'+

'<div class="txn-top">'+

'<div class="txn-date">'+
escapeHTML(
t.date||''
)+
'</div>'+

'<div class="txn-amount">'+
escapeHTML(
t.bdAmount||'0'
)+
' Tk'+
'</div>'+

'</div>'+

'<div class="txn-bottom">'+

escapeHTML(
t.type||''
)+

(
t.note
?' • '+escapeHTML(t.note)
:''
)+

'</div>'+

'</div>';

});


list.innerHTML=html;

}
catch(error){

console.error(error);

list.innerHTML=
'<div class="empty">Connection error</div>';

}

}

NOTES
===================================================== */

async function loadNotes(){

try{

const result=
await getAPI('options');


if(!result.success){

return;

}


notesData={

dueNotes:
Array.isArray(
result.data.dueNotes
)
?result.data.dueNotes
:[],

paymentNotes:
Array.isArray(
result.data.paymentNotes
)
?result.data.paymentNotes
:[]

};


setNotes(
transactionType==='বাকি'
?notesData.dueNotes
:notesData.paymentNotes
);

}

}

}

);

type==='বাকি'

:notesData.paymentNotes
);

}


/* =====================================================
SAVE TRANSACTION
===================================================== */

async function saveTransaction(){

const date=
document
.getElementById('date')
.value;


const agentId=
document
.getElementById('agentSelect')
.value;


const customerId=
document
.getElementById('customerSelect')
.value;


const kd=
parseFloat(
document
.getElementById('kdAmount')
.value
.replace(/,/g,'')
)||0;


const bd=
parseFloat(
document
.getElementById('bdAmount')
.value
.replace(/,/g,'')
)||0;


const note=
document
.getElementById('noteSelect')
.value;


if(!date){

showSaveError(
'Date required'
);

return;

}


if(kd>0 && !customerId){

showSaveError(
'KD Amount দিলে Customer নির্বাচন করুন'
);

return;

}


if(bd>0 && !agentId){

showSaveError(
'BD Amount দিলে Agent নির্বাচন করুন'
);

return;

}


if(kd<=0 && bd<=0){

showSaveError(
'KD অথবা BD Amount দিন'
);

return;

}


const selectedDate=
new Date(
date+'T00:00:00'
);


const today=
new Date();

today.setHours(
0,0,0,0
);


if(selectedDate>today){

showSaveError(
'Future date দেওয়া যাবে না'
);

return;

}


let agentName='';


if(agentId){

const agent=
agentData.find(function(a){

return String(a.agentId)===
String(agentId);

});


if(agent){

agentName=
agent.agentName;

}

}


let customerName='';


if(customerId){

const customer=
customerData.find(function(c){

return String(c.customerId)===
String(customerId);

});


if(customer){

customerName=
customer.customerName;

}

}


const button=
document.getElementById(
'saveBtn'
);


const message=
document.getElementById(
'saveMsg'
);


button.disabled=true;

button.textContent='Saving...';

message.textContent='';

message.className='msg';


try{

const result=
await postAPI({

action:'addTransaction',

date:formatDate(date),

customerId:customerId,

customerName:customerName,

agentName:agentName,

kdAmount:kd,

bdAmount:bd,

type:transactionType,

note:note

});


if(!result.success){

showSaveError(
result.error ||
'Save failed'
);

return;

}


message.className=
'msg success';

message.textContent=
'Transaction saved successfully';


document
.getElementById('kdAmount')
.value='';


document
.getElementById('bdAmount')
.value='';


if(customerId){

await loadCustomers();

}


const selectedAgent=
document
.getElementById('agentView')
.value;


if(selectedAgent){

agentChanged();

}


setTimeout(function(){

message.textContent='';

message.className='msg';

},2500);


}
catch(error){

console.error(error);

showSaveError(
'Connection error'
);

}
finally{

button.disabled=false;

button.textContent='✅ Save';

}

}


/* =====================================================
ERROR
===================================================== */

function showSaveError(text){

const message=
document.getElementById(
'saveMsg'
);


message.className=
'msg error';

message.textContent=text;

}


/* =====================================================
DATE FORMAT
===================================================== */

function formatDate(value){

const parts=
value.split('-');


const months=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];


return(
parts[2]+'-'+
months[
Number(parts[1])-1
]+'-'+
parts[0]
);

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

return String(
value===null ||
value===undefined
?''
:value
)

.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =====================================================
ENTER LOGIN
===================================================== */

document
.getElementById('password')
.addEventListener(
'keydown',
function(event){

if(event.key==='Enter'){

login();

}

});


/* =====================================================
START
===================================================== */

restoreLogin();

/* =====================================================
API
===================================================== */

const API =
'https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';


/* =====================================================
STATE
===================================================== */

let currentUser=null;

let transactionType='বাকি';

let customerData=[];

let agentData=[];

let notesData={
dueNotes:[],
paymentNotes:[]
};


/* =====================================================
GET API
===================================================== */

async function getAPI(action,params={}){

const query=new URLSearchParams();

query.set('action',action);

Object.keys(params).forEach(function(key){

const value=params[key];

if(
value!==undefined &&
value!==null &&
value!==''
){

query.set(key,value);

}

});

const response=
await fetch(
API+'?'+query.toString(),
{
method:'GET',
cache:'no-store'
}
);

return await response.json();

}


/* =====================================================
POST API
===================================================== */

async function postAPI(data){

const response=
await fetch(
API,
{
method:'POST',
headers:{
'Content-Type':'text/plain;charset=utf-8'
},
body:JSON.stringify(data)
}
);

return await response.json();

}


/* =====================================================
TABS
===================================================== */

function openTab(tab,button){

document
.querySelectorAll('.panel')
.forEach(function(panel){

panel.classList.remove('active');

});


document
.querySelectorAll('.tab')
.forEach(function(btn){

btn.classList.remove('active');

});


if(tab==='transaction'){

document
.getElementById('panelTransaction')
.classList.add('active');

}


if(tab==='customer'){

document
.getElementById('panelCustomer')
.classList.add('active');

}


if(tab==='agent'){

document
.getElementById('panelAgent')
.classList.add('active');

}


if(button){

button.classList.add('active');

}

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const username=
document
.getElementById('username')
.value
.trim();

const password=
document
.getElementById('password')
.value;

const msg=
document
.getElementById('loginMsg');

const btn=
document
.getElementById('loginBtn');


if(!username || !password){

msg.className='msg error';

msg.textContent=
'Username and password required';

return;

}


btn.disabled=true;

btn.textContent='Logging in...';

msg.textContent='';


try{

const result=
await getAPI(
'login',
{
username:username,
password:password
}
);


if(!result.success){

msg.className='msg error';

msg.textContent=
result.error ||
'Login failed';

return;

}


currentUser=result.data;


localStorage.setItem(
'amaya_user',
JSON.stringify(currentUser)
);


showApp();

}
catch(error){

console.error(error);

msg.className='msg error';

msg.textContent=
'Connection error';

}
finally{

btn.disabled=false;

btn.textContent='Login';

}

}


/* =====================================================
RESTORE LOGIN
===================================================== */

function restoreLogin(){

try{

const saved=
localStorage.getItem('amaya_user');

if(!saved){

return;

}


const user=
JSON.parse(saved);

if(user && user.loggedIn){

currentUser=user;

showApp();

}

}
catch(error){

localStorage.removeItem('amaya_user');

}

}


/* =====================================================
SHOW APP
===================================================== */

function showApp(){

document
.getElementById('loginPage')
.classList.add('hidden');

document
.getElementById('app')
.classList.remove('hidden');


document
.getElementById('userInfo')
.textContent=
(currentUser.username||'User')+
(
currentUser.role
?' • '+currentUser.role
:''
);


setToday();

loadAllData();

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

currentUser=null;

localStorage.removeItem('amaya_user');


document
.getElementById('app')
.classList.add('hidden');

document
.getElementById('loginPage')
.classList.remove('hidden');


document
.getElementById('username')
.value='';

document
.getElementById('password')
.value='';

}


/* =====================================================
TODAY
===================================================== */

function setToday(){

const input=
document.getElementById('date');

const d=new Date();

const yyyy=
d.getFullYear();

const mm=
String(
d.getMonth()+1
).padStart(2,'0');

const dd=
String(
d.getDate()
).padStart(2,'0');


const today=
yyyy+'-'+mm+'-'+dd;


input.value=today;

input.max=today;

}


/* =====================================================
LOAD ALL
===================================================== */

function loadAllData(){

loadCustomers();

loadAgents();

loadNotes();

}


/* =====================================================
CUSTOMERS
===================================================== */

async function loadCustomers(){

const list=
document.getElementById(
'customerList'
);


/*
Customer page starts empty.
No customer is selected.
*/

list.innerHTML=
'<div class="empty">Select a customer</div>';


try{

const result=
await getAPI('customers');


console.log(
'CUSTOMERS',
result
);


if(!result.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(
result.error ||
'Customer loading failed'
)+
'</div>';

return;

}


customerData=
Array.isArray(result.data)
?result.data
:[];


/* =====================================================
ADD TRANSACTION CUSTOMER DROPDOWN
ALL CUSTOMERS WILL SHOW
===================================================== */

const transactionSelect=
document.getElementById(
'customerSelect'
);


transactionSelect.innerHTML=
'<option value="">Select Customer</option>';


customerData.forEach(function(customer){

const option=
document.createElement('option');


option.value=
customer.customerId;


option.textContent=
customer.customerName+
(
customer.phone
?' • '+customer.phone
:''
);


transactionSelect.appendChild(option);

});


/* =====================================================
CUSTOMER PAGE DROPDOWN
ONLY CUSTOMERS WITH DUE > 0
===================================================== */

const pageSelect=
document.getElementById(
'customerPageSelect'
);


pageSelect.innerHTML=
'<option value="">Select Customer</option>';


customerData.forEach(function(customer){

const due=
parseFloat(
String(
customer.totalDueKD || '0'
)
.replace(/,/g,'')
)||0;


/*
0 balance customers
will NOT be added here.
*/

if(due<=0){

return;

}


const option=
document.createElement('option');


option.value=
customer.customerId;


option.textContent=
customer.customerName+
(
customer.phone
?' • '+customer.phone
:''
);


pageSelect.appendChild(option);

});


/* =====================================================
TOTAL ALL CUSTOMER DUE
===================================================== */

let totalDue=0;


customerData.forEach(function(customer){

totalDue+=
parseFloat(
String(
customer.totalDueKD || '0'
)
.replace(/,/g,'')
)||0;

t.date||''
)+

escapeHTML(
t.kdAmount||'0.000'
)+
' KD'+
'</div>'+

'</div>'+

'<div class="txn-bottom">'+

escapeHTML(
t.type||''
)+

(
t.note
?' • '+escapeHTML(t.note)
:''
)+

(
t.bdAmount
?' • '+escapeHTML(t.bdAmount)+' Tk'
:''
)+

'</div>'+

'</div>';

});


list.innerHTML+=html;

}
catch(error){

document.getElementById(
'customerTxnLoading'
);

if(loading){

'<div class="empty">Connection error</div>';

}

}

/* =====================================================
SAVE TRANSACTION
===================================================== */

async function saveTransaction(){

const date=
document
.getElementById('date')
.value;


const agentId=
document
.getElementById('agentSelect')
.value;


const customerId=
document
.getElementById('customerSelect')
.value;


const kd=
parseFloat(
document
.getElementById('kdAmount')
.value
.replace(/,/g,'')
)||0;


const bd=
parseFloat(
document
.getElementById('bdAmount')
.value
.replace(/,/g,'')
)||0;


const note=
document
.getElementById('noteSelect')
.value;


/* DATE */

if(!date){

showSaveError(
'Date required'
);

return;

}


/* KD -> CUSTOMER */

if(kd>0 && !customerId){

showSaveError(
'KD Amount দিলে Customer নির্বাচন করুন'
);

return;

}


/* BD -> AGENT */

if(bd>0 && !agentId){

showSaveError(
'BD Amount দিলে Agent নির্বাচন করুন'
);

return;

}


/* AMOUNT */

if(kd<=0 && bd<=0){

showSaveError(
'KD অথবা BD Amount দিন'
);

return;

}


/* FUTURE DATE */

const selectedDate=
new Date(
date+'T00:00:00'
);


const today=
new Date();

today.setHours(
0,0,0,0
);


if(selectedDate>today){

showSaveError(
'Future date দেওয়া যাবে না'
);

return;

}


/* AGENT NAME */

let agentName='';


if(agentId){

const agent=
agentData.find(function(a){

return String(a.agentId)===
String(agentId);

});


if(agent){

agentName=
agent.agentName;

}

}


/* CUSTOMER NAME */

let customerName='';


if(customerId){

const customer=
customerData.find(function(c){

return String(c.customerId)===
String(customerId);

});


if(customer){

customerName=
customer.customerName;

}

}


/* SAVE */

const button=
document.getElementById(
'saveBtn'
);


const message=
document.getElementById(
'saveMsg'
);


button.disabled=true;

button.textContent='Saving...';

message.textContent='';

message.className='msg';


try{

const result=
await postAPI({

action:'addTransaction',

date:formatDate(date),

customerId:customerId,

customerName:customerName,

agentName:agentName,

kdAmount:kd,

bdAmount:bd,

type:transactionType,

note:note

});


if(!result.success){

showSaveError(
result.error ||
'Save failed'
);

return;

}


message.className=
'msg success';

message.textContent=
'Transaction saved successfully';


document
.getElementById('kdAmount')
.value='';


document
.getElementById('bdAmount')
.value='';


/*
Refresh customer data.
This keeps the customer dropdown
updated according to current balance.
*/

if(customerId){

await loadCustomers();

}


/*
Refresh selected agent transaction.
*/

const selectedAgent=
document
.getElementById('agentView')
.value;


if(selectedAgent){

agentChanged();

}


setTimeout(function(){

message.textContent='';

message.className='msg';

},2500);


}
catch(error){

console.error(error);

showSaveError(
'Connection error'
);

}
finally{

button.disabled=false;

button.textContent='✅ Save';

}

}


/* =====================================================
ERROR
===================================================== */

function showSaveError(text){

const message=
document.getElementById(
'saveMsg'
);


message.className=
'msg error';

message.textContent=text;

}


/* =====================================================
DATE FORMAT
===================================================== */

function formatDate(value){

const parts=
value.split('-');


const months=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];


return(
parts[2]+'-'+
months[
Number(parts[1])-1
]+'-'+
parts[0]
);

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

return String(
value===null ||
value===undefined
?''
:value
)

.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}
