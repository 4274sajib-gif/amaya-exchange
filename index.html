.header-rate-popup{

  gap:7px;

const API='https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';  
  
  
/* ================= HEADER RATE ================= */  
  
const HEADER_RATE_1=333.333333;  
const HEADER_RATE_2=363.636363;  
const HEADER_RATE_3=357.142857;  
  
function calculateHeaderRate(){  
  
 let value=String($('headerRateAmount').value)  
  .replace(/[০-৯]/g,function(d){  
   return "0123456789"["০১২৩৪৫৬৭৮৯".indexOf(d)];  
  })  
  .replace(/[^0-9]/g,'');  
  
 const popup=$('headerRatePopup');  
  
 document.addEventListener('click',function(e){  
  
 const rateWrap=document.querySelector('.header-rate-wrap');  
  
 if(!rateWrap.contains(e.target)){  
  
  $('headerRateAmount').value='';  
  $('headerRatePopup').classList.remove('show');  
  
 }  
  
});   
   
  if(!value){  
  popup.classList.remove('show');  
  return;  
 }  
  
 const amount=parseInt(value,10);  
  
 if(!Number.isFinite(amount)||amount<=0){  
  popup.classList.remove('show');  
  return;  
 }  
  
 let rate;  
  
 if(amount<1000){  
  rate=HEADER_RATE_1;  
 }else if(amount%1000===0){  
  rate=HEADER_RATE_2;  
 }else{  
  rate=HEADER_RATE_3;  
 }  
  
 const kd=amount/rate;  
  
 $('headerRateAmount').value=  
  Math.floor(amount).toLocaleString('en-IN');  
  
 $('headerRatePopupAmount').textContent=  
  Math.floor(amount).toLocaleString('en-IN')+' Tk';  
  
 $('headerRatePopupKD').textContent=  
  kd.toFixed(3)+' KD';  
  
 popup.classList.add('show');  
}  
  
  
/* ================= MAIN ================= */  
  
const $=id=>document.getElementById(id);  
  
let currentUser=null;  
let transactionType='বাকি';  
let customerData=[];  
let agentData=[];  
let notesData={dueNotes:[],paymentNotes:[]};  
let currentAgentTransactions=[];  
  
const fmtKD=v=>number(v).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});  
const fmtIndian=v=>Math.floor(number(v)).toLocaleString('en-IN');  
  
async function getAPI(action,params={}){  
 const q=new URLSearchParams({action});  
 for(const k in params)  
  if(params[k]!==undefined&&params[k]!==null&&params[k]!=='')  
   q.set(k,params[k]);  
 const r=await fetch(API+'?'+q,{method:'GET',cache:'no-store'});  
 return r.json();  
}  
  
async function postAPI(data){  
 const r=await fetch(API,{  
  method:'POST',  
  headers:{'Content-Type':'text/plain;charset=utf-8'},  
  body:JSON.stringify(data)  
 });  
 return r.json();  
}  
  
function openTab(tab,button){  
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));  
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));  
  
 const panel=$('panel'+tab.charAt(0).toUpperCase()+tab.slice(1));  
 if(panel&&!panel.classList.contains('hidden'))panel.classList.add('active');  
 if(button&&!button.classList.contains('hidden'))button.classList.add('active');  
}  
  
async function login(){  
 const username=$('username').value.trim();  
 const password=$('password').value;  
 const msg=$('loginMsg');  
 const btn=$('loginBtn');  
  
 if(!username||!password){  
  msg.className='msg error';  
  msg.textContent='Username and password required';  
  return;  
 }  
  
 btn.disabled=true;  
 btn.textContent='Logging in...';  
 msg.textContent='';  
  
 try{  
  const result=await getAPI('login',{username,password});  
  
  if(!result.success){  
   msg.className='msg error';  
   msg.textContent=result.error||'Login failed';  
   return;  
  }  
  
  currentUser=result.data;  
  localStorage.setItem('amaya_user',JSON.stringify(currentUser));  
  showApp();  
  
 }catch(e){  
  msg.className='msg error';  
  msg.textContent='Connection error';  
 }finally{  
  btn.disabled=false;  
  btn.textContent='Login';  
 }  
}  
  
function restoreLogin(){  
 try{  
  const saved=localStorage.getItem('amaya_user');  
  if(!saved)return;  
  const user=JSON.parse(saved);  
  if(user&&user.loggedIn){  
   currentUser=user;  
   showApp();  
  }  
 }catch(e){  
  localStorage.removeItem('amaya_user');  
 }  
}  
  
function showApp(){  
 $('loginPage').classList.add('hidden');  
 $('app').classList.remove('hidden');  
 setToday();  
 setupAgentDateFilters();  
 applyRoleAccess();  
 loadAllData();  
}  
  
function getRole(){  
 return String(currentUser?.role||'').trim().toLowerCase();  
}  
  
function applyRoleAccess(){  
  
 const role=getRole();  
  
 const rateBox=$('adminRateBox');  
  
 if(rateBox){  
  rateBox.classList.toggle('hidden',role!=='admin');  
 }  
  
 const tabs=document.querySelectorAll('.tab');  
 const transactionTab=tabs[0];  
 const customerTab=tabs[1];  
 const agentTab=tabs[2];  
  
 const transactionPanel=$('panelTransaction');  
 const customerPanel=$('panelCustomer');  
 const agentPanel=$('panelAgent');  
  
 [transactionTab,customerTab,agentTab].forEach(x=>x.classList.remove('hidden'));  
 [transactionPanel,customerPanel,agentPanel].forEach(x=>x.classList.remove('hidden'));  
  
 if(role==='admin'){  
  openTab('transaction',transactionTab);  
  return;  
 }  
  
 if(role==='agent'){  
  
  transactionTab.classList.add('hidden');  
  customerTab.classList.add('hidden');  
  agentTab.classList.add('hidden');  
  
  transactionPanel.classList.add('hidden');  
  customerPanel.classList.add('hidden');  
  agentPanel.classList.remove('hidden');  
  agentPanel.classList.add('active');  
  
  const agentView=$('agentView');  
  agentView.innerHTML='';  
  
  const option=document.createElement('option');  
  option.value=currentUser.linkedId||'';

function calculateCustomerDue(transactions){  
  
 let total=0;  
  
 transactions.forEach(t=>{  
  const kdAmount=number(  
   t.kdAmount!==undefined  
    ?t.kdAmount  
    :(t.amountKD!==undefined?t.amountKD:t.kd)  
  );  
  
  if(isDueTransaction(t))total+=kdAmount;  
  else if(isPaymentTransaction(t))total-=kdAmount;  
 });  
  
 return Math.round(total*1000)/1000;  
}  
  
async function loadCustomerTransactions(customerId){  
  
 const list=$('customerList');  
 const loading=document.createElement('div');  
  
 loading.id='customerTxnLoading';  
 loading.className='loading';  
 loading.textContent='Loading transactions...';  
 list.appendChild(loading);  
  
 try{  
  
  const result=await getAPI('customerTransactions',{customerId});  
  
  if(loading.isConnected)loading.remove();  
  
  if(!result.success){  
  
   $('selectedDueAmount').innerHTML='0.000 <span>KD</span>';  
   addEmpty(list,result.error||'Unable to load transactions');  
   return;  
  }  
  
  const transactions=Array.isArray(result.data)  
   ?result.data  
   :(result.data&&Array.isArray(result.data.transactions)  
     ?result.data.transactions:[]);  
  
  const customerDue=calculateCustomerDue(transactions);  
  
  $('selectedDueAmount').innerHTML=fmtKD(customerDue)+' <span>KD</span>';  
  
  if(!transactions.length){  
   addEmpty(list,'No Transaction found');  
   return;  
  }  
  
  const fragment=document.createDocumentFragment();  
  
  transactions.forEach(t=>{  
  
   const sale=isDueTransaction(t);  
   const payment=isPaymentTransaction(t);  
  
   const txn=document.createElement('div');  
   txn.className='txn '+(sale?'sale':payment?'payment':'');  
  
   const top=document.createElement('div');  
   top.className='txn-top';  
  
   const date=document.createElement('div');  
   date.className='txn-date';  
   date.textContent=t.date||t.Date||t.transactionDate||'';  
  
   const type=document.createElement('div');  
   type.className='txn-type';  
   type.textContent=sale?'বিক্রয়':payment?'পেমেন্ট':(t.type||'');  
  
   top.append(date,type);  
  
   const amount=document.createElement('div');  
   amount.className='txn-amount';  
  
   const kdAmount=number(  
    t.kdAmount!==undefined?t.kdAmount:t.amountKD  
   );  
  
   const sign=payment?'−':sale?'+':'';  
   amount.textContent=sign+fmtKD(kdAmount)+' KD';  
  
   const bottom=document.createElement('div');  
   bottom.className='txn-bottom';  
  
   const note=String(t.note||'').trim();  
   const bdAmount=getBDAmount(t);  
  
   bottom.textContent=note  
    ?note+' • '+fmtIndian(bdAmount)+' TK'  
    :fmtIndian(bdAmount)+' TK';  
  
   txn.append(top,amount,bottom);  
   fragment.appendChild(txn);  
  });  
  
  list.appendChild(fragment);  
  
 }catch(e){  
  
  if(loading.isConnected)loading.remove();  
  
  $('selectedDueAmount').innerHTML='0.000 <span>KD</span>';  
  addEmpty(list,'Connection error');  
 }  
}

  .trim()

}

 );  
  
 return type==='পেমেন্ট'||

  type==='জমা'||

  type==='payment amount';  
}

function calculateAgentSummary(){

 const year=Number($('agentYear').value);

 currentAgentTransactions.forEach(t=>{  
  
  const amount=getBDAmount(t);  
  
  if(isDueTransaction(t))balance+=amount;  
  else if(isPaymentTransaction(t))balance-=amount;  
  
  if(isDueTransaction(t)){  
  
   const info=parseTransactionDate(  
    t.date||t.Date||t.transactionDate||t.TransactionDate  
   );  
  
   if(info&&info.year===year&&info.month===month)

 });

}

function parseTransactionDate(value){  
  
 if(!value)return null;  
  
 const str=String(value).trim();  
  
 let match=str.match(/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{4})$/);  
  
 if(match){  
  
  const months={  
   jan:1,feb:2,mar:3,apr:4,may:5,jun:6,  
   jul:7,aug:8,sep:9,oct:10,nov:11,dec:12  
  };  
  
  const month=months[match[2].toLowerCase()];  
  
  if(month)  
   return{year:Number(match[3]),month};  
 }  
  
 match=str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);  
  
 if(match)  
  return{year:Number(match[1]),month:Number(match[2])};  
  
 match=str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);  
  
 if(match)  
  return{year:Number(match[3]),month:Number(match[2])};  
  
 const date=new Date(str);  
  
 if(!isNaN(date.getTime()))  
  return{year:date.getFullYear(),month:date.getMonth()+1};  
  
 return null;  
}

 this.value=Number(value).toLocaleString('en-IN');

async function saveTransaction(){  
  
 if(getRole()!=='admin'){  
  showSaveError('Access denied');  
  return;  
 }  
  
 const date=$('date').value;  
 const agentId=$('agentSelect').value;  
 const customerId=$('customerSelect').value;  
 const kd=number($('kdAmount').value);  
 const bd=number($('bdAmount').value);  
 const note=$('noteSelect').value;  
  
 if(!date){  
  showSaveError('Date required');  
  return;  
 }  
  
 if(kd>0&&!customerId){  
  showSaveError('KD Amount দিলে Customer নির্বাচন করুন');  
  return;  
 }  
  
 if(bd>0&&!agentId){  
  showSaveError('BD Amount দিলে Agent নির্বাচন করুন');  
  return;  
 }  
  
 if(kd<=0&&bd<=0){  
  showSaveError('KD অথবা BD Amount দিন');  
  return;  
 }  
  
 const selectedDate=new Date(date+'T00:00:00');  
 const today=new Date();  
 today.setHours(0,0,0,0);  
  
 if(selectedDate>today){  
  showSaveError('Future date দেওয়া যাবে না');  
  return;  
 }  
  
 const agent=agentData.find(a=>String(a.agentId)===String(agentId));  
 const customer=customerData.find(c=>String(c.customerId)===String(customerId));  
  
 const button=$('saveBtn');  
 const message=$('saveMsg');  
 const savedCustomerPageId=$('customerPageSelect').value;  
  
 button.disabled=true;  
 button.textContent='Saving...';  
 message.textContent='';  
 message.className='msg';  
  
 try{  
  
  const result=await postAPI({  
  
   action:'addTransaction',  
  
   username:currentUser?.username||'',  
   role:currentUser?.role||'',  
  
   date:formatDate(date),  
  
   customerId,  
   customerName:customer?.customerName||'',  
   agentName:agent?.agentName||'',  
  
   kdAmount:kd,  
   bdAmount:bd,  
  
   type:transactionType,  
   note  
  });  
  
  if(!result.success){  
   showSaveError(result.error||'Save failed');  
   return;  
  }  
  
  message.className='msg success';  
  message.textContent='Transaction saved successfully';  
  
  $('kdAmount').value='';  
  $('bdAmount').value='';  
  
  await loadCustomers();  
  
  const customerPageSelect=$('customerPageSelect');  
  
  if(  
   savedCustomerPageId&&  
   [...customerPageSelect.options].some(o=>o.value===savedCustomerPageId)  
  ){  
  
   customerPageSelect.value=savedCustomerPageId;  
   customerPageSelect.dispatchEvent(new Event('change'));  
  }  
  
  const selectedAgent=$('agentView').value;  
  
  if(selectedAgent)  
   await agentChanged();  
  
  setTimeout(()=>{  
   message.textContent='';  
   message.className='msg';  
  },2500);  
  
 }catch(e){  
  
  showSaveError('Connection error');  
  
 }finally{  
  
  button.disabled=false;  
  button.textContent='💾 Save';  
 }  
}  
  
function showSaveError(text){  
 const message=$('saveMsg');  
 message.className='msg error';  
 message.textContent=text;  
}  
  
function formatDate(value){  
  
 const parts=value.split('-');  
  
 const months=[  
  'Jan','Feb','Mar','Apr','May','Jun',  
  'Jul','Aug','Sep','Oct','Nov','Dec'  
 ];  
  
 return parts[2]+'-'+months[Number(parts[1])-1]+'-'+parts[0];  
}  
  
function addEmpty(parent,text){  
  
 const box=document.createElement('div');  
 box.className='empty';  
 box.textContent=text;  
 parent.appendChild(box);  
}  
  
function escapeHTML(value){  
  
 return String(  
  value===null||value===undefined?'':value  
 )  
 .replace(/&/g,'&amp;')  
 .replace(/</g,'&lt;')  
 .replace(/>/g,'&gt;')  
 .replace(/"/g,'&quot;')  
 .replace(/'/g,'&#039;');  
}  
  
$('password').addEventListener('keydown',e=>{  
 if(e.key==='Enter')login();  
});  
  
restoreLogin();  
  
</script>  </body>  
</html>
