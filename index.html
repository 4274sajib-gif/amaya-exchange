<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Amaya Exchange</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
padding:0;
background:#f5f7fa;
color:#172033;
font-family:Arial,sans-serif
}

body{
min-height:100vh
}

button,input,select{
font:inherit
}

button{
cursor:pointer
}

.hidden{
display:none!important
}

.app{
width:100%;
max-width:520px;
margin:auto;
min-height:100vh
}

.header{
background:#fff;
padding:14px 15px;
border-bottom:1px solid #e7e9ed;
position:sticky;
top:0;
z-index:20;
overflow:visible
}

.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
overflow:visible
}

.logo{
font-size:19px;
font-weight:800
}

.tagline{
font-size:11px;
color:#858e9d;
margin-top:4px
}

.logout{
border:0;
background:#fff1f1;
color:#d66b6b;
border-radius:9px;
padding:8px 11px;
font-size:11px;
font-weight:700
}

.header-rate-wrap{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0
}

.header-rate{
position:relative;
width:120px;
flex-shrink:0
}

.header-rate-input{
width:100%;
height:34px;
border:1px solid #dfe3e9;
border-radius:18px;
background:#EFF6FF;
padding:0 10px;
outline:0;
color:#172033;
font-size:11px;
font-weight:600
}

.header-rate-popup{
position:absolute;
left:-10px;
right:-45px;
top:calc(100% + 7px);
background:#111827;
color:#fff;
border-radius:10px;
padding:12px 9px;
display:flex;
align-items:center;
justify-content:space-between;
gap:7px;
opacity:0;
visibility:hidden;
transform:translateY(7px);
transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
box-shadow:0 5px 16px rgba(0,0,0,.18);
z-index:100
}

.header-rate-popup.show{
opacity:1;
visibility:visible;
transform:translateY(0)
}

.header-rate-left{
min-width:0
}

.header-rate-label{
color:#aeb8c7;
font-size:8px;
line-height:1;
margin-bottom:2px
}

.header-rate-amount{
font-size:12px;
font-weight:700;
white-space:nowrap
}

.header-rate-right{
text-align:right;
flex-shrink:0
}

.header-rate-kd{
font-size:15px;
font-weight:800;
line-height:1;
white-space:nowrap
}

.header-rate-popup:after{
content:"";
position:absolute;
right:35%;
top:-5px;
width:10px;
height:10px;
background:#111827;
transform:rotate(45deg)
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
padding:11px 14px 5px
}

.tab{
border:0;
height:43px;
border-radius:11px;
background:#e7ebf0;
color:#687284;
font-size:12px;
font-weight:800
}

.tab.active{
background:#111827;
color:#fff
}

.content{
padding:10px 14px 25px
}

.panel{
display:none
}

.panel.active{
display:block
}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 3px 15px rgba(0,0,0,.045)
}

.field{
margin-bottom:18px
}

.label{
display:block;
font-size:10px;
font-weight:300;
margin-bottom:7px
}

input,select{
width:100%;
height:47px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
padding:0 12px;
outline:0;
color:#172033
}

#agentSelect,
#customerSelect{
font-weight:400
}

#agentSelect.has-value,
#customerSelect.has-value{
font-weight:700
}

input:focus,
select:focus{
border-color:#111827;
box-shadow:
0 0 0 3px rgba(17,24,39,.08),
0 4px 14px rgba(17,24,39,.10);
outline:none
}

select:disabled{
background:#f1f3f6;
color:#4b5563;
opacity:1;
cursor:not-allowed
}

.amount{
font-size:14px!important;
font-weight:700
}

.amount-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
position:relative
}

.type-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:3px 0 13px
}

.type-btn{
height:44px;
border:1px solid #dfe3e9;
border-radius:11px;
background:#fff;
font-weight:800
}

.type-btn.active{
background:#111827;
color:#fff;
border-color:#111827
}

.save{
width:100%;
height:50px;
border:0;
border-radius:12px;
background:#111827;
color:#fff;
font-size:13px;
font-weight:800;
letter-spacing:.2px
}

.save:active{
transform:scale(.98)
}

.save:disabled{
opacity:.55;
cursor:not-allowed
}

.msg{
font-size:12px;
margin-top:9px;
text-align:center
}

.error{
color:#d33131
}

.success{
color:#16824c
}

.profit-popup{
position:absolute;
right:0;
bottom:60px;
background:#111827;
color:#fff;
border-radius:10px;
padding:7px 11px;
font-size:11px;
font-weight:800;
line-height:1;
box-shadow:0 5px 16px rgba(0,0,0,.16);
opacity:0;
visibility:hidden;
transform:translateY(5px) scale(.96);
transition:opacity .15s ease,transform .15s ease,visibility .15s ease;
z-index:30;
pointer-events:none;
white-space:nowrap
}

.profit-popup.show{
opacity:1;
visibility:visible;
transform:translateY(0) scale(1)
}

.profit-popup:after{
content:"";
position:absolute;
right:20px;
bottom:-5px;
width:10px;
height:10px;
background:#111827;
transform:rotate(45deg)
}

.customer-filter-card{
background:#fff;
border-radius:14px;
padding:10px;
margin-bottom:9px;
box-shadow:0 2px 10px rgba(0,0,0,.035)
}

.customer-filter-row{
display:grid;
grid-template-columns:1fr 105px 1.25fr;
gap:6px;
align-items:center;
margin-bottom:7px
}

.customer-filter-row input,
.customer-filter-row select{
height:36px;
font-size:11px;
padding:0 8px;
border-radius:9px
}

.customer-date-wrap{
position:relative;
width:100%
}

.customer-date{
width:100%;
height:36px;
border-radius:9px;
font-size:11px;
padding:0 8px;
background:#fff;
border:1px solid #dfe3e9;
outline:0;
cursor:pointer;
appearance:none;
-webkit-appearance:none;
background-image:none!important
}

#customerDatePicker{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
z-index:2
}

.customer-selected-row{
display:grid;
grid-template-columns:1fr auto auto;
align-items:center;
gap:7px;
min-height:38px
}

.selected-customer{
min-width:0
}

.selected-name{
font-size:14px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.selected-phone{
font-size:12px;
color:#858e9d;
margin-top:1px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.due-amount-box{
background:#f1f3f6;
border-radius:9px;
padding:6px 8px;
min-width:82px;
text-align:center;
flex-shrink:0
}

.due-amount-label{
font-size:10px;
color:#858e9d;
margin-bottom:1px
}

.due-amount-value{
font-size:13px;
font-weight:800;
color:#172033;
line-height:1.1;
white-space:nowrap
}

.due-amount-value span{
font-size:8px;
font-weight:700
}

.total-due-box{
background:#111827;
border-radius:9px;
padding:6px 9px;
min-width:105px;
text-align:center;
flex-shrink:0
}

.total-due-label{
font-size:10px;
color:#c8ced8;
margin-bottom:1px
}

.total-due-value{
font-size:14px;
font-weight:800;
color:#fff;
line-height:1.1;
white-space:nowrap
}

.total-due-value span{
font-size:8px;
font-weight:700
}

.list{
display:flex;
flex-direction:column;
gap:6px
}

#customerList{
max-height:calc(100vh - 300px);
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-right:1px
}

.txn{
background:#fff;
border-radius:11px;
padding:10px 11px;
box-shadow:0 1px 6px rgba(0,0,0,.035);
border:1px solid #edf0f3;
border-left:4px solid #dfe3e9;
position:relative
}

.txn.sale{
border-left-color:#111827
}

.txn.sale .txn-type,
.txn.sale .txn-amount{
color:#111827
}

.txn.payment{
border-left-color:#f3a6a6;
background:#fff5f5;
border-top:1px solid #fde1e1;
border-right:1px solid #fde1e1;
border-bottom:1px solid #fde1e1
}

.txn-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px
}

.txn-date{
font-size:11px;
color:#858e9d
}

.txn-type{
font-size:10px;
font-weight:800;
line-height:10px
}

.txn.payment .txn-type,
.txn.payment .txn-amount{
color:#d66b6b
}

.txn-amount{
font-size:14px;
font-weight:800;
margin-top:4px
}

.txn-bottom{
font-size:9px;
color:#858e9d!important;
font-weight:400!important;
margin-top:4px;
padding-right:45%;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.txn-agent{
position:absolute;
right:11px;
bottom:10px;
font-size:9px;
font-weight:600;
color:#858e9d;
max-width:42%;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
text-align:right
}

.agent-filter-row{
display:grid;
grid-template-columns:.65fr .85fr 1.25fr;
gap:5px;
margin-bottom:8px
}

.agent-filter-row select{
height:34px;
font-size:10px;
padding:0 6px;
border-radius:8px;
min-width:0
}

.agent-summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-bottom:8px
}

.agent-summary-box{
background:#111827;
color:#fff;
border-radius:10px;
padding:8px 9px;
border:0;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.agent-summary-label{
font-size:10px;
color:#c8ced8;
margin-bottom:2px
}

.agent-summary-value{
font-size:14px;
font-weight:800;
line-height:1.2;
color:#fff
}

.agent-summary-value span{
font-size:8px;
font-weight:700;
color:#c8ced8
}

.agent-balance{
text-align:left
}

.agent-sales{
text-align:right
}

#agentList{
max-height:calc(100vh - 250px);
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-right:1px
}

#agentList .txn{
padding:10px 11px;
border-radius:11px;
border-left-width:4px
}

#agentList .txn-date,
#agentList .txn-type{
font-size:10px
}

#agentList .txn-amount{
font-size:14px;
margin-top:4px
}

#agentList .txn-bottom{
font-size:9px;
margin-top:4px
}

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.login-box{
width:100%;
max-width:390px;
background:#fff;
border-radius:21px;
padding:25px 21px;
box-shadow:0 8px 30px rgba(0,0,0,.06)
}

.login-title{
font-size:24px;
font-weight:800
}

.login-sub{
font-size:13px;
color:#8992a0;
margin:5px 0 23px
}

.loading,
.empty{
padding:22px 10px;
text-align:center;
color:#8992a0;
font-size:11px
}

.sync-status{
position:fixed;
right:10px;
bottom:10px;
background:#111827;
color:#fff;
border-radius:20px;
padding:5px 9px;
font-size:8px;
opacity:0;
transform:translateY(5px);
transition:.2s;
z-index:200
}

.sync-status.show{
opacity:.8;
transform:translateY(0)
}

@media(max-width:360px){

.tabs{
gap:5px
}

.tab{
font-size:11px
}

.amount-row{
gap:6px
}

.customer-filter-row{
gap:5px
}

.customer-filter-row input,
.customer-filter-row select{
font-size:10px;
padding:0 7px
}

.agent-filter-row{
gap:4px
}

.agent-filter-row select{
font-size:9px;
padding:0 5px
}

.agent-summary-value{
font-size:13px
}

.total-due-box{
min-width:98px
}

.due-amount-box{
min-width:75px;
padding:6px
}

.due-amount-value{
font-size:12px
}

.selected-name{
font-size:11px
}

.customer-selected-row{
gap:5px
}

.header{
padding:13px 10px
}

.logo{
font-size:16px
}

.tagline{
font-size:9px
}

.header-rate-wrap{
gap:4px
}

.header-rate{
width:105px
}

.header-rate-input{
height:31px;
font-size:10px;
padding:0 8px
}

.logout{
padding:7px 8px;
font-size:10px
}

.header-rate-popup{
padding:6px 7px
}

.header-rate-amount{
font-size:11px
}

.header-rate-kd{
font-size:14px
}

}

</style>
</head>

<body>

<div id="loginPage" class="login-page">

<div class="login-box">

<div class="login-title">Amaya Exchange</div>

<div class="login-sub">
লেনদেনে আস্থা, সেবায় নির্ভরতা
</div>

<div class="field">
<label class="label">Username</label>
<input
id="username"
type="text"
autocomplete="username">
</div>

<div class="field">
<label class="label">Password</label>
<input
id="password"
type="password"
autocomplete="current-password">
</div>

<button
id="loginBtn"
class="save"
onclick="login()">
Login
</button>

<div id="loginMsg" class="msg"></div>

</div>
</div>


<div id="app" class="app hidden">

<div class="header">

<div class="header-row">

<div>

<div class="logo">
Amaya Exchange
</div>

<div class="tagline">
লেনদেনে আস্থা, সেবায় নির্ভরতা
</div>

</div>


<div class="header-rate-wrap">

<div id="adminRateBox" class="header-rate">

<div id="headerRatePopup" class="header-rate-popup">

<div class="header-rate-left">

<div class="header-rate-label">
Amount
</div>

<div
id="headerRatePopupAmount"
class="header-rate-amount">
0 Tk
</div>

</div>

<div class="header-rate-right">

<div
id="headerRatePopupKD"
class="header-rate-kd">
0.000 KD
</div>

</div>

</div>


<input
id="headerRateAmount"
class="header-rate-input"
type="text"
inputmode="numeric"
autocomplete="off"
placeholder="💱 Rate Check"
oninput="calculateHeaderRate">

</div>


<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</div>
</div>


<div class="tabs">

<button
class="tab active"
onclick="openTab('transaction',this)">
Add Transaction
</button>

<button
class="tab"
onclick="openTab('customer',this)">
Customer
</button>

<button
class="tab"
onclick="openTab('agent',this)">
Agent
</button>

</div>


<div class="content">


<section
id="panelTransaction"
class="panel active">

<div class="card">


<div class="field">

<label class="label">
📅 Date
</label>

<input
id="date"
type="date"
inputmode="numeric"
placeholder="DD/MM/YYYY"
maxlength="10"
autocomplete="off">

</div>


<div class="field">

<label class="label">
👨🏻‍💼 Agent
</label>

<select id="agentSelect">

<option value="">
Select Agent
</option>

</select>

</div>


<div class="field">

<label class="label">
🤝 Customer
</label>

<select id="customerSelect">

<option value="">
Select Customer
</option>

</select>

</div>


<div class="amount-row">


<div class="field">

<label class="label">
🇰🇼 KD Amount
</label>

<input
id="kdAmount"
class="amount"
type="text"
inputmode="decimal"
autocomplete="off"
autocorrect="off"
spellcheck="false"
placeholder="দিনার">

</div>


<div class="field">

<label class="label">
৳ BD Amount
</label>

<input
id="bdAmount"
class="amount"
type="text"
inputmode="numeric"
placeholder="টাকা">

</div>


<div
id="profitPopup"
class="profit-popup">
Profit 0
</div>

</div>


<div class="type-row">

<button
id="dueBtn"
class="type-btn active"
onclick="setType('বাকি')">
বাকি
</button>

<button
id="paymentBtn"
class="type-btn"
onclick="setType('পেমেন্ট')">
পেমেন্ট
</button>

</div>


<div class="field">

<label class="label">
Note
</label>

<select id="noteSelect">

<option value="">
Select Note
</option>

</select>

</div>


<button
id="saveBtn"
class="save"
onclick="saveTransaction()">
💾 Save
</button>

<div
id="saveMsg"
class="msg">
</div>

</div>

</section>


<section
id="panelCustomer"
class="panel">


<div class="customer-filter-card">


<div class="customer-filter-row">


<input
id="customerSearch"
type="search"
placeholder="🔍 Search..."
autocomplete="off">


<div class="customer-date-wrap">

<input
id="customerTransactionDate"
class="customer-date"
type="text"
autocomplete="off"
readonly>

<input
id="customerDatePicker"
type="date"
onchange="selectCustomerDate(this.value)">

</div>


<select id="customerPageSelect">

<option value="">
Select Customer
</option>

<option value="ALL_TRANSACTIONS">
All Transaction
</option>

</select>

</div>


<div class="customer-selected-row">


<div
id="selectedCustomerInfo"
class="selected-customer">

<div class="selected-empty">
Select a customer
</div>

</div>


<div class="due-amount-box">

<div class="due-amount-label">
বর্তমান বাকি
</div>

<div
id="selectedDueAmount"
class="due-amount-value">

0.000 <span>KD</span>

</div>

</div>


<div class="total-due-box">

<div class="total-due-label">
সর্বমোট বাকি
</div>

<div
id="allCustomerDue"
class="total-due-value">

0.000 <span>KD</span>

</div>

</div>

</div>

</div>


<div
id="customerList"
class="list">

<div class="empty">
Select a customer
</div>

</div>

</section>


<section
id="panelAgent"
class="panel">


<div class="agent-filter-row">

<select id="agentYear"></select>

<select id="agentMonth"></select>

<select
id="agentView"
onchange="agentChanged()">

<option value="">
Agent
</option>

</select>

</div>


<div class="agent-summary">


<div class="agent-summary-box agent-balance">

<div class="agent-summary-label">
বর্তমান বাকি
</div>

<div
id="agentCurrentBalance"
class="agent-summary-value">

0 <span>Tk</span>

</div>

</div>


<div class="agent-summary-box agent-sales">

<div class="agent-summary-label">
মাসিক বিক্রয়
</div>

<div
id="agentMonthlySales"
class="agent-summary-value">

0 <span>Tk</span>

</div>

</div>

</div>


<div
id="agentList"
class="list">

<div class="empty">
Select an agent
</div>

</div>

</section>


</div>
</div>


<div
id="syncStatus"
class="sync-status">
Syncing...
</div>


<script>

const API=
'https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';


const HEADER_RATE_1=333.333333,
HEADER_RATE_2=363.636363,
HEADER_RATE_3=357.142857;


const DB_NAME='AmayaExchangeDB',
DB_VERSION=2,
SYNC_INTERVAL=5000,
$=id=>document.getElementById(id);


const DUE_NOTES=[
'Bkash',
'Nagad',
'Recharge',
'Dollar Card',
'Electricity'
];


const PAYMENT_NOTES=[
'Bank',
'Cash'
];


let currentUser=null,
transactionType='বাকি',
customerData=[],
agentData=[],
notesData={
dueNotes:DUE_NOTES,
paymentNotes:PAYMENT_NOTES
},
allTransactionsData=[],
dueData={
totalDueKD:0,
customers:[]
},
totalDueKD=0,
notesLoaded=true,
dataVersion='',
txVersion='',
customerVersion='',

value===undefined

function fmtKD(v){

'en-US',
{
minimumFractionDigits:3,
maximumFractionDigits:3

)

function fmtIndian(v){

number(v)

function number(value){

String(value??'')
.replace(/,/g,'')

)||0

/* =========================================================
INDEXED DB
========================================================= */

function openDB(){

return new Promise(
(resolve,reject)=>{

if(db)
return resolve(db);

const r=
indexedDB.open(
DB_NAME,
DB_VERSION
);

r.onupgradeneeded=e=>{

const d=e.target.result;

if(
!d.objectStoreNames.contains('meta')
){
d.createObjectStore(
'meta',
{keyPath:'key'}
)
}

if(
!d.objectStoreNames.contains('customers')
){
d.createObjectStore(
'customers',
{keyPath:'customerId'}
)
}

if(
!d.objectStoreNames.contains('agents')
){
d.createObjectStore(
'agents',
{keyPath:'agentId'}
)
}

if(
!d.objectStoreNames.contains('transactions')
){

const s=
d.createObjectStore(
'transactions',
{keyPath:'key'}
);

s.createIndex(
'rowNumber',
'rowNumber',
{unique:false}
);

s.createIndex(
'customerId',
'customerId',
{unique:false}
)

}

};


r.onsuccess=()=>{

db=r.result;

db.onversionchange=()=>{

db.close();

db=null

};

resolve(db)

};


r.onerror=()=>reject(r.error)

})
}


function dbPut(storeName,value){

return new Promise(
(resolve,reject)=>{

const t=
db.transaction(
storeName,
'readwrite'
);

t.objectStore(storeName).put(value);

t.oncomplete=resolve;

t.onerror=()=>reject(t.error)

})
}


function dbGet(storeName,key){

return new Promise(
(resolve,reject)=>{

const t=
db.transaction(
storeName,
'readonly'
);

const r=
t.objectStore(storeName).get(key);

r.onsuccess=()=>{
resolve(r.result||null)
};

r.onerror=()=>reject(r.error)

})
}


function dbGetAll(storeName){

return new Promise(
(resolve,reject)=>{

const t=
db.transaction(
storeName,
'readonly'
);

const r=
t.objectStore(storeName).getAll();

r.onsuccess=()=>{
resolve(r.result||[])
};

r.onerror=()=>reject(r.error)

})
}


function dbClear(storeName){

return new Promise(
(resolve,reject)=>{

const t=
db.transaction(
storeName,
'readwrite'
);

t.objectStore(storeName).clear();

t.oncomplete=resolve;

t.onerror=()=>reject(t.error)

})
}

function calculateCustomerDueFromTransactions(
customerId
){

const id=
String(
customerId||''
).trim();

if(!id)return 0;

let due=0;

allTransactionsData.forEach(t=>{

if(
String(t.customerId||'').trim()!==id
)
return;

const kd=
number(
t.kdAmount!==undefined
?t.kdAmount
:t.amountKD!==undefined
?t.amountKD
:t.kd
);

if(kd<=0)return;

if(isDueTransaction(t)){
due+=kd
}
else if(isPaymentTransaction(t)){
due-=kd
}

});

return Math.max(
0,
due
)

}


function getCustomerDue(customer){

if(!customer)return 0;

return calculateCustomerDueFromTransactions(
customer.customerId
)

}


function applyDueData(data){

if(!data)return;

const source=
data.due&&
typeof data.due==='object'
?data.due
:data.customerDue&&
typeof data.customerDue==='object'
?data.customerDue
:data;


const hasCustomers=
Array.isArray(
source.customers
);


const incomingTotal=
source.totalDueKD!==undefined
?source.totalDueKD
:data.totalDueKD;


if(
incomingTotal!==undefined||
hasCustomers
){

dueData={
totalDueKD:
incomingTotal!==undefined
?number(incomingTotal)
:number(
dueData.totalDueKD||0
),

customers:
hasCustomers
?source.customers
:(Array.isArray(
dueData.customers
)
?dueData.customers
:[])
};

totalDueKD=
number(
dueData.totalDueKD
)

}


if(
Array.isArray(
dueData.customers
)
){

const m=
new Map(
dueData.customers.map(
c=>[
String(c.customerId),
number(c.totalDueKD)
]
)
);

customerData.forEach(c=>{

const id=
String(c.customerId);

if(m.has(id)){
c.totalDueKD=
m.get(id)
}

})

}

}


function findCustomer(id){

return customerData.find(
c=>
String(c.customerId)===
String(id)
)||null

}


function isActive(customer){

return String(
customer?.status||
customer?.Status||
customer?.active||
customer?.Active||
''

.trim()
.toLowerCase()==='active'

function updateTotalDue(){

customerData.forEach(
customer=>{

const due=

if(due>0)
total+=due

const el=

if(el){

fmtKD(totalDueKD)+

}

function transactionKey(t){

const id=
String(
t.transactionId||
t.TransactionId||
''
).trim();

if(id)
return 'TX:'+id;

const row=
Number(
t.rowNumber||
t.row||
t.rowIndex||
t.RowNumber||
0
)||0;

if(row)
return 'ROW:'+row;

return 'TMP:'+
String(
t.timestamp||
JSON.stringify([
t.date||'',
t.customerId||'',
t.kdAmount||'',
t.bdAmount||'',
t.type||''
])
)

}


async function saveTransactionsLocal(items){

if(
!Array.isArray(items)||
!items.length
)
return;

const t=
db.transaction(
'transactions',
'readwrite'
);

const s=
t.objectStore(
'transactions'
);

items.forEach(item=>{

const c={...item};

c.key=
transactionKey(c);

s.put(c)

});

return new Promise(
(r,j)=>{

t.oncomplete=r;

t.onerror=()=>j(t.error)

}
)


}


function getTransactionTimestamp(t){

const v=
t.timestamp||
t.Timestamp||
t.createdAt||
t.created_at||
t.time||
t.createdTime||
'';

if(!v)return 0;

const n=
new Date(v).getTime();

return Number.isFinite(n)
?n
:0

}


function getTransactionRowNumber(t){

return Number(
t.rowNumber||
t.row||
t.rowIndex||
t.RowNumber||
0
)||0

}


function sortTransactionsNewestFirst(list){

return list.sort(
(a,b)=>{

const ra=
getTransactionRowNumber(a);

const rb=
getTransactionRowNumber(b);

if(ra!==rb)
return rb-ra;

const ta=
getTransactionTimestamp(a);

const tb=
getTransactionTimestamp(b);

if(ta!==tb)
return tb-ta;

const da=
getFullTransactionDate(
a.date||
a.Date||
a.transactionDate||
a.TransactionDate||
''
)?.getTime()||0;

const dbDate=
getFullTransactionDate(
b.date||
b.Date||
b.transactionDate||
b.TransactionDate||
''
)?.getTime()||0;

if(da!==dbDate)
return dbDate-da;

return String(
b.transactionId||
b.TransactionId||
''
)
.localeCompare(
String(
a.transactionId||
a.TransactionId||
''
)
)

})

}

function transactionMatchesDate(

transaction.transactionDate||
transaction.TransactionDate||
''
);

getFullTransactionDate(

);

td.getFullYear()===
sd.getFullYear()&&
td.getMonth()===
sd.getMonth()&&
td.getDate()===
sd.getDate()
)

}


function getFullTransactionDate(value){

if(!value)
return null;

const str=
String(value).trim();

if(!str)
return null;

let date,
match;


/* YYYY-MM-DD */

match=
str.match(
/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(.+))?$/
);

if(match){

date=
new Date(
Number(match[1]),
Number(match[2])-1,
Number(match[3])
);

if(match[4]){

const tm=
match[4]
.trim()
.match(
/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.(\d+))?(?:\s*(AM|PM))?/i
);

if(tm){

let h=
Number(tm[1]);

const ap=
(tm[5]||'').toUpperCase();

if(
ap==='PM'&&
h<12
)
h+=12;

if(
ap==='AM'&&
h===12
)
h=0;

date.setHours(
h,
Number(tm[2]),
Number(tm[3]||0),
Number(
String(tm[4]||'')
.padEnd(3,'0')
.slice(0,3)
)||0
)

}

}

return isNaN(date.getTime())
?null
:date

}


/* DD-MMM-YYYY */

match=
str.match(
/^(\d{1,2})-([A-Za-z]{3})-(\d{4})(?:[T\s]+(.+))?$/
);

if(match){

const months={

jun:6,
jul:7,
aug:8,
sep:9,
oct:10,
nov:11,
dec:12
};

const m=
months[
match[2].toLowerCase()
];

if(m){

date=
new Date(
Number(match[3]),
m-1,
Number(match[1])
);

if(match[4]){

const tm=
match[4]
.trim()
.match(
/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*(AM|PM))?/i
);

if(tm){

let h=
Number(tm[1]);

const ap=
(tm[4]||'').toUpperCase();

if(
ap==='PM'&&
h<12
)
h+=12;

if(
ap==='AM'&&
h===12
)
h=0;

date.setHours(
h,
Number(tm[2]),
Number(tm[3]||0),
0
)

}

}

return isNaN(date.getTime())
?null
:date

}

}


/* DD-MM-YYYY */

match=
str.match(
/^(\d{1,2})-(\d{1,2})-(\d{4})(?:[T\s]+(.+))?$/
);

if(match){

date=
new Date(
Number(match[3]),
Number(match[2])-1,

);

if(match[4]){

const tm=

.trim()
.match(

);

if(tm){

let h=
Number(tm[1]);

const ap=
(tm[4]||'').toUpperCase();

if(

h+=12;

)

date.setHours(

return isNaN(date.getTime())

date=

function normalizeType(value){

return String(value||'')
.trim()
.toLowerCase()
.replace(/\s+/g,' ')
.replace(/^[+-]\s*/,'')
.trim()

}

);

);

].includes(type)

/* =========================================================
AGENT DATE PARSER
========================================================= */

function parseTransactionDate(value){

if(!value)
return null;

const str=
String(value).trim();

if(!str)
return null;


let m=
str.match(
/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/
);

if(m){

const months={
jan:1,
feb:2,
mar:3,
apr:4,
may:5,
jun:6,
jul:7,
aug:8,
sep:9,
oct:10,
nov:11,
dec:12
};

const month=
months[
m[2].toLowerCase()
];

if(month){

return{
year:Number(m[3]),
month
}

}

}


m=
str.match(
/^(\d{4})-(\d{1,2})-(\d{1,2})/
);

if(m){

return{
year:Number(m[1]),
month:Number(m[2])
}

}


m=
str.match(
/^(\d{1,2})-(\d{1,2})-(\d{4})/
);

if(m){

return{
year:Number(m[3]),
month:Number(m[2])
}

}


const d=
new Date(str);

return isNaN(d.getTime())
?null
:{
year:d.getFullYear(),
month:d.getMonth()+1
}

}


function getBDAmount(t){

return number(
t.bdAmount!==undefined&&
t.bdAmount!==''
?t.bdAmount
:t.amountBD!==undefined&&
t.amountBD!==''
?t.amountBD
:t.bd
)

}

/* =========================================================
API
========================================================= */

async function getAPI(
action,
params={}
){

const q=
new URLSearchParams();

q.set(
'action',
action
);


Object.keys(params)
.forEach(k=>{

const v=
params[k];

if(
v!==undefined&&
v!==null&&
v!==''
){

q.set(k,v)

}

});


const r=
await fetch(
API+
'?'+
q.toString(),
{
method:'GET',
cache:'no-store'
}
);


return r.json()

}


async function postAPI(
data,
timeout=15000
){

const controller=
new AbortController();

const timer=
setTimeout(
()=>{
controller.abort()
},
timeout
);

try{

const r=
await fetch(
API,
{
method:'POST',
headers:{
'Content-Type':
'text/plain;charset=utf-8'
},
body:JSON.stringify(data),
cache:'no-store',
signal:controller.signal
}
);

const text=
await r.text();

if(!text){

throw new Error(
'Empty server response'
);

}

try{

return JSON.parse(text);

}
catch(e){

throw new Error(
'Invalid server response'
);

}

}
finally{

clearTimeout(timer);

}

}

Date.now().toString(36).toUpperCase()+
'-'+
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase()
);

function sleep(ms){

return new Promise(
resolve=>
setTimeout(
resolve,
ms
)
);

}


async function verifySavedTransaction(
transactionId
){

if(!transactionId)
return null;


try{

const result=
await getAPI(
'verifyTransaction',
{
transactionId
}
);


if(
!result||
!result.success
){

return null

}


const data=
result.data||{};


if(
data.found&&
data.transaction
){

return data.transaction

}


return null

}
catch(e){

console.error(
'Transaction verify error:',
e
);

return null

}

}


async function verifyWithRetry(
transactionId
){

let tx=
await verifySavedTransaction(
transactionId
);

if(tx)
return tx;


await sleep(800);


tx=
await verifySavedTransaction(
transactionId
);

if(tx)
return tx;


return null

}

),

),

fallback.type||

fallback.rowNumber||
0
)||0

}

/* =========================================================
SAFE POST TRANSACTION

Same transactionId is used for every attempt.
========================================================= */

async function safePostTransaction(
payload
){

let lastResult=null;


/*
ATTEMPT 1
*/

try{

lastResult=
await postAPI(
payload,
15000
);

}
catch(e){

console.warn(
'Transaction POST attempt 1 failed:',
e
);

}


/*
Immediate success
*/

if(
lastResult&&
lastResult.success
){

return{
success:true,
result:lastResult,
transaction:null
};

}


/*
Verify after failed / uncertain response
*/

let verified=
await verifyWithRetry(
payload.transactionId
);

if(verified){

return{
success:true,
result:lastResult,
transaction:verified,
verified:true
};

}


/*
ATTEMPT 2
Same transactionId.
*/

await sleep(500);


try{

lastResult=
await postAPI(
payload,
15000
);

}
catch(e){

console.warn(
'Transaction POST attempt 2 failed:',
e
);

}


/*
Retry success
*/

if(
lastResult&&
lastResult.success
){

return{
success:true,
result:lastResult,
transaction:null
};

}


/*
Verify again
*/

verified=
await verifyWithRetry(
payload.transactionId
);

if(verified){

return{
success:true,
result:lastResult,
transaction:verified,
verified:true
};

}


/*
ATTEMPT 3
Same transactionId.
*/

await sleep(700);


try{

lastResult=
await postAPI(
payload,
15000
);

}
catch(e){

console.warn(
'Transaction POST attempt 3 failed:',
e
);

}


/*
Third attempt success
*/

if(
lastResult&&
lastResult.success
){

return{
success:true,
result:lastResult,
transaction:null
};

}


/*
Final verify
*/

verified=
await verifyWithRetry(
payload.transactionId
);

if(verified){

return{
success:true,
result:lastResult,
transaction:verified,
verified:true
};

}


/*
Not found.
*/

return{
success:false,
result:lastResult,
transaction:null,
verified:false
};

}

async function initialBootstrap(){

if(bootstrapPromise)
return bootstrapPromise;


bootstrapPromise=
(async()=>{

try{

showSync(
'Loading...'
);


const r=
await getAPI(
'bootstrap'
);


if(!r.success)
throw new Error(
r.error||
'Bootstrap loading failed'
);


await applyBootstrap(
r.data||{}
);


hideSync();

return true

}
catch(e){

console.error(e);

hideSync();

showInitialDataError(
e.message||
'Data loading error'
);

return false

}
finally{

bootstrapPromise=null

}

})();


return bootstrapPromise

}

!currentUser
)

try{

if(
force||
(
!dataVersion&&
!txVersion&&
!customerVersion&&
!agentVersion&&
!settingsVersion
)
){

const result=
await initialBootstrap();

getRole()==='agent'&&
$('agentView').value
){

);

}
finally{

syncRunning=false

}

}

async function saveTransaction(){

if(
getRole()!=='admin'
){

showSaveError(
'Access denied'
);

return

}


const date=
$('date').value;

const agentId=
$('agentSelect').value;

const customerId=
$('customerSelect').value;

const kd=
number(
$('kdAmount').value
);

const bd=
number(
$('bdAmount').value
);

const note=
$('noteSelect').value;


if(!date)
return showSaveError(
'Date required'
);


if(
kd>0&&
!customerId
)
return showSaveError(
'KD Amount দিলে Customer নির্বাচন করুন'
);


if(
bd>0&&
!agentId
)
return showSaveError(
'BD Amount দিলে Agent নির্বাচন করুন'
);


if(
kd<=0&&
bd<=0
)
return showSaveError(
'KD অথবা BD Amount দিন'
);


const selectedDate=
new Date(
date+'T00:00:00'
);

const today=
new Date();

today.setHours(
0,
0,
0,
0
);


if(
selectedDate>today
)
return showSaveError(
'Future date দেওয়া যাবে না'
);


const agent=
agentData.find(
a=>
String(a.agentId)===
String(agentId)
);


const customer=
customerData.find(
c=>
String(c.customerId)===
String(customerId)
);


if(
kd>0&&
!customer
){

return showSaveError(
'Customer not found'
);

}


if(
bd>0&&
!agent
){

return showSaveError(
'Agent not found'
);

}


const button=
$('saveBtn');

const message=
$('saveMsg');

const savedCustomerPageId=
$('customerPageSelect').value;


/*
Selected agent preserve
*/

const savedAgentId=
$('agentSelect').value;


/*
IMPORTANT:
Generate BEFORE POST.
*/

const transactionId=
createTransactionId();


const formattedDate=
formatDate(date);


/*
Fallback local transaction
*/

const fallbackTransaction={

date:
formattedDate,

customerId,

customerName:
customer?.customerName||'',

kdAmount:kd,

bdAmount:bd,

type:transactionType,

note,

transactionId,

timestamp:
new Date().toISOString(),

agentName:
agent?.agentName||'',

rowNumber:0

};


button.disabled=true;

button.textContent=
'Saving...';

message.textContent='';

message.className=
'msg';


try{

/*
=========================================================
PAYLOAD
=========================================================
*/

const payload={

action:'addTransaction',

username:
currentUser?.username||'',

role:
currentUser?.role||'',

date:
formattedDate,

customerId,

customerName:
customer?.customerName||'',

agentName:
agent?.agentName||'',

kdAmount:kd,

bdAmount:bd,

type:transactionType,

note,

/*
Same ID for all retries.
*/

transactionId

};


/*
=========================================================
SAFE SAVE
=========================================================
*/

const safeResult=
await safePostTransaction(
payload
);


if(
!safeResult.success
){

showSaveError(
'Transaction save নিশ্চিত করা যায়নি। আবার Save করুন।'
);

return

}


const result=
safeResult.result||{};

const s=
result.data||{};


/*
Server verify response থাকলে
সেটাই priority।
*/

const serverTransaction=
safeResult.transaction||
(
s.transaction&&
typeof s.transaction==='object'
?s.transaction
:null
);


/*
=========================================================
FINAL LOCAL TRANSACTION
=========================================================
*/

const localTransaction=
buildLocalTransaction(

serverTransaction||
{
date:
s.date||
formattedDate,

customerId:
s.customerId||
customerId,

customerName:
s.customerName||
customer?.customerName||
'',

kdAmount:
s.kdAmount!==undefined
?s.kdAmount
:kd,

bdAmount:
s.bdAmount!==undefined
?s.bdAmount
:bd,

type:
s.type||
transactionType,

note:
s.note||
note,

transactionId:
s.transactionId||
transactionId,

timestamp:
s.timestamp||
new Date().toISOString(),

agentName:
s.agentName||
agent?.agentName||
'',

rowNumber:
s.rowNumber||0
},

fallbackTransaction
);


/*
=========================================================
SUCCESS
=========================================================
*/

message.className=
'msg success';

message.textContent=
'Transaction saved successfully';


/*
=========================================================
CLEAR AMOUNT
=========================================================
*/

$('kdAmount').value='';

$('bdAmount').value='';

calculateProfitPopup();


/*
=========================================================
LOCAL DB
=========================================================
*/

await saveTransactionsLocal(
[
localTransaction
]
);


/*
Memory-তে duplicate না থাকলে add।
*/

const localKey=
transactionKey(
localTransaction
);


const duplicateLocal=
allTransactionsData.some(
t=>
transactionKey(t)===
localKey
);


if(!duplicateLocal){

allTransactionsData.push(
localTransaction
);

}


/*
=========================================================
DUE UPDATE
=========================================================
*/

if(
s.due||
s.customerDue||
s.totalDueKD!==undefined
){

applyDueData(s);

}
else{

customerData.forEach(
c=>{

c.totalDueKD=
calculateCustomerDueFromTransactions(
c.customerId
);

}
);

updateTotalDue();

}


/*
=========================================================
VERSION
=========================================================
*/

if(
s.version!==undefined
){

dataVersion=
String(
s.version
);

}


if(
result.data?.version!==undefined
){

dataVersion=
String(
result.data.version
);

}


/*
=========================================================
ROW NUMBER
=========================================================
*/

if(
localTransaction.rowNumber
){

lastTransactionRow=
Math.max(
lastTransactionRow,
Number(
localTransaction.rowNumber
)
);

}


/*
=========================================================
LOCAL STATE
=========================================================
*/

await saveLocalState();


/*
=========================================================
IMMEDIATE RENDER

NO BOOTSTRAP
=========================================================
*/

renderLocalData();


/*
=========================================================
RESTORE AGENT
=========================================================
*/

if(
savedAgentId&&
[...$('agentSelect').options]
.some(
o=>
o.value===savedAgentId
)
){

$('agentSelect').value=
savedAgentId;

$('agentSelect')
.classList.add(
'has-value'
);

}
else{

$('agentSelect').value='';

$('agentSelect')
.classList.remove(
'has-value'
);

}


/*
=========================================================
CLEAR TRANSACTION CUSTOMER
=========================================================
*/

$('customerSelect').value='';

$('customerSelect')
.classList.remove(
'has-value'
);


/*
=========================================================
RESTORE CUSTOMER PAGE
=========================================================
*/

if(
savedCustomerPageId&&
[...$('customerPageSelect').options]
.some(
o=>
o.value===
savedCustomerPageId
)
){

$('customerPageSelect').value=
savedCustomerPageId;


if(
savedCustomerPageId===
'ALL_TRANSACTIONS'
){

renderAllCustomerTransactions()

}
else{

const c=
findCustomer(
savedCustomerPageId
);


if(c){

renderCustomerInfo(c);

renderCustomerTransactionsLocal(
c.customerId
)

}

}

}


/*
=========================================================
AGENT REFRESH
=========================================================
*/

if(
$('agentView').value
){

agentChanged();

}


/*
=========================================================
BACKGROUND SYNC

No immediate bootstrap.
=========================================================
*/

setTimeout(
()=>{

syncData();

},
100
);


/*
=========================================================
CLEAR SUCCESS
=========================================================
*/

setTimeout(
()=>{

message.textContent='';

message.className=
'msg';

},
2500
);


}
catch(e){

console.error(
'Save Error:',
e
);


/*
=========================================================
FINAL VERIFY

Connection error দেখানোর আগে
transaction verify করা হবে।
=========================================================
*/

try{

const verified=
await verifyWithRetry(
transactionId
);


if(verified){

const localTransaction=
buildLocalTransaction(
verified,
fallbackTransaction
);


await saveTransactionsLocal(
[
localTransaction
]
);


const exists=
allTransactionsData.some(
t=>
transactionKey(t)===
transactionKey(localTransaction)
);


if(!exists){

allTransactionsData.push(
localTransaction
);

}


sortTransactionsNewestFirst(
allTransactionsData
);


customerData.forEach(
c=>{

c.totalDueKD=
calculateCustomerDueFromTransactions(
c.customerId
);

}
);


updateTotalDue();

await saveLocalState();

renderLocalData();


message.className=
'msg success';

message.textContent=
'Transaction saved successfully';


setTimeout(
()=>{

message.textContent='';

message.className=
'msg';

},
2500
);

return

}

}
catch(verifyError){

console.error(
'Final verify error:',
verifyError
);

}


/*
শুধু তখনই failure।
*/

showSaveError(
'Transaction save নিশ্চিত করা যায়নি। আবার চেষ্টা করুন।'
);

}
finally{

button.disabled=false;

button.textContent=
'💾 Save';

}

}

function formatDate(value){

const p=
value.split('-');

const m=[
'Jan','Feb','Mar','Apr',
'May','Jun','Jul','Aug',
'Sep','Oct','Nov','Dec'
];


return(
p[2]+'-'+
m[
Number(p[1])-1
]+'-'+
p[0]
)

}

/* =========================================================
SECURITY / HTML ESCAPE
========================================================= */

function escapeHTML(value){

return String(
value===null||
value===undefined
?''
:value
)
.replace(
/&/g,
'&amp;'
)
.replace(
/</g,
'&lt;'
)
.replace(
/>/g,
'&gt;'
)
.replace(
/"/g,
'&quot;'
)
.replace(
/'/g,
'&#39;'
)

}


function showInitialDataError(message){

$('customerList')&&
!dataLoaded
){

$('customerList')
.innerHTML=
'<div class="empty">'+
escapeHTML(
message||
'Unable to load data'
)+
'</div>'

}

}
