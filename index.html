<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f5f7fa;color:#172033;font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{width:100%;max-width:520px;margin:auto;min-height:100vh}

.header{
background:#fff;padding:14px 15px;border-bottom:1px solid #e7e9ed;
position:sticky;top:0;z-index:20
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:19px;font-weight:800}
.user-info{font-size:11px;color:#858e9d;margin-top:3px}
.logout{
border:0;background:#eef0f3;color:#303744;border-radius:9px;
padding:8px 11px;font-size:11px;font-weight:700
}

.tabs{
display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
padding:11px 14px 5px;background:#f5f7fa
}
.tab{
border:0;height:43px;border-radius:11px;background:#e7ebf0;
color:#687284;font-size:12px;font-weight:800
}
.tab.active{background:#111827;color:#fff}

.content{padding:10px 14px 25px}
.panel{display:none}
.panel.active{display:block}

.card{
background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
box-shadow:0 3px 15px rgba(0,0,0,.045)
}
.title{font-size:16px;font-weight:800;margin-bottom:14px}

.field{margin-bottom:13px}
.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}

input,select{
width:100%;height:47px;border:1px solid #dfe3e9;border-radius:11px;
background:#fff;padding:0 12px;outline:0;color:#172033
}
input:focus,select:focus{border-color:#111827}
.amount{font-size:17px!important;font-weight:700}

.type-row{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:3px 0 13px
}
.type-btn{
height:44px;border:1px solid #dfe3e9;border-radius:11px;
background:#fff;font-weight:800
}
.type-btn.active{background:#111827;color:#fff;border-color:#111827}

.save{
width:100%;height:49px;border:0;border-radius:12px;
background:#111827;color:#fff;font-weight:800
}
.save:disabled{opacity:.55}

.msg{font-size:12px;margin-top:9px;text-align:center}
.error{color:#d33131}
.success{color:#16824c}

.customer-select{margin-bottom:13px}

.total-due-box{
background:#111827;border-radius:14px;padding:15px;
margin-bottom:13px;text-align:center
}
.total-due-label{font-size:11px;color:#c8ced8;margin-bottom:4px}
.total-due-value{font-size:23px;font-weight:800;color:#fff}
.total-due-value span{font-size:11px;font-weight:700}

.list{display:flex;flex-direction:column;gap:9px}

.customer-card,.txn,.agent-card{
background:#fff;border-radius:14px;padding:13px;
box-shadow:0 3px 14px rgba(0,0,0,.04)
}

.customer-row,.txn-top{
display:flex;align-items:center;justify-content:space-between;gap:12px
}

.customer-name,.agent-name{font-size:15px;font-weight:800}
.phone,.agent-phone{font-size:12px;color:#858e9d;margin-top:4px}

.due{text-align:right;white-space:nowrap}
.due-label{font-size:10px;color:#8992a0}
.due-value{font-size:16px;font-weight:800;margin-top:2px}
.kd-small{font-size:10px}

.txn-date{font-size:12px;color:#858e9d}
.txn-amount{font-size:15px;font-weight:800}
.txn-bottom{font-size:12px;color:#737d8d;margin-top:6px}

.login-page{
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
}
.login-box{
width:100%;max-width:390px;background:#fff;border-radius:21px;
padding:25px 21px;box-shadow:0 8px 30px rgba(0,0,0,.06)
}
.login-title{font-size:24px;font-weight:800}
.login-sub{font-size:13px;color:#8992a0;margin:5px 0 23px}

.loading,.empty{
padding:28px 10px;text-align:center;color:#8992a0;font-size:13px
}

@media(max-width:360px){
.tabs{gap:5px}
.tab{font-size:11px}
}
</style></head><body><!-- LOGIN --><div id="loginPage" class="login-page">
<div class="login-box"><div class="login-title">Amaya Exchange</div>
<div class="login-sub">Admin / Agent Login</div><div class="field">
<label class="label">Username</label>
<input id="username" type="text" autocomplete="username">
</div><div class="field">
<label class="label">Password</label>
<input id="password" type="password" autocomplete="current-password">
</div><button id="loginBtn" class="save" onclick="login()">Login</button>

<div id="loginMsg" class="msg"></div></div>
</div><!-- APP --><div id="app" class="app hidden"><div class="header">
<div class="header-row"><div>
<div class="logo">Amaya Exchange</div>
<div id="userInfo" class="user-info"></div>
</div><button class="logout" onclick="logout()">Logout</button>

</div>
</div><div class="tabs"><button class="tab active" onclick="openTab('transaction',this)">
Add Transaction
</button><button class="tab" onclick="openTab('customer',this)">
Customer
</button><button class="tab" onclick="openTab('agent',this)">
Agent
</button></div><div class="content"><!-- ADD TRANSACTION --><section id="panelTransaction" class="panel active"><div class="card"><div class="title">Add Transaction</div><div class="field">
<label class="label">📅 Date</label>
<input id="date" type="date">
</div><div class="field">
<label class="label">◾ Agent</label>
<select id="agentSelect">
<option value="">Select Agent</option>
</select>
</div><div class="field">
<label class="label">🧒 Customer</label>
<select id="customerSelect">
<option value="">Select Customer</option>
</select>
</div><div class="field">
<label class="label">💵 KD Amount</label>
<input id="kdAmount" class="amount" type="text"
inputmode="decimal" placeholder="0.000">
</div><div class="field">
<label class="label">💳 BD Amount</label>
<input id="bdAmount" class="amount" type="text"
inputmode="numeric" placeholder="0">
</div><div class="type-row"><button id="dueBtn" class="type-btn active"
onclick="setType('বাকি')">

+ বাকি
  </button>

<button id="paymentBtn" class="type-btn"
onclick="setType('পেমেন্ট')">

- পেমেন্ট
  </button>

</div><div class="field">
<label class="label">Note</label>
<select id="noteSelect">
<option value="">Select Note</option>
</select>
</div><button id="saveBtn" class="save" onclick="saveTransaction()">
✅ Save
</button><div id="saveMsg" class="msg"></div></div>
</section><!-- CUSTOMER --><section id="panelCustomer" class="panel"><div class="card"><div class="title">Customer</div><select id="customerPageSelect" class="customer-select">
<option value="">Select Customer</option>
</select><div class="total-due-box"><div class="total-due-label">Total Due</div><div id="allCustomerDue" class="total-due-value">
0.000 <span>KD</span>
</div></div><input id="customerSearch" class="search"
type="search"
placeholder="Search customer..."
autocomplete="off">

</div><div id="customerList" class="list">
<div class="empty">Select a customer</div>
</div></section><!-- AGENT --><section id="panelAgent" class="panel"><div class="card"><div class="title">Agent</div><select id="agentView" onchange="agentChanged()">
<option value="">Select Agent</option>
</select></div><div id="agentList" class="list">
<div class="empty">Select an agent</div>
</div></section></div>
</div><script>

/* ================= API ================= */

const API='https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';


/* ================= STATE ================= */

let currentUser=null;
let transactionType='বাকি';
let customerData=[];
let agentData=[];
let notesData={dueNotes:[],paymentNotes:[]};


/* ================= API GET ================= */

async function getAPI(action,params={}){

const q=new URLSearchParams();
q.set('action',action);

for(const key in params){
if(params[key]!==undefined&&params[key]!==null&&params[key]!==''){
q.set(key,params[key]);
}
}

const r=await fetch(API+'?'+q.toString(),{
method:'GET',
cache:'no-store'
});

return r.json();
}


/* ================= API POST ================= */

async function postAPI(data){

const r=await fetch(API,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify(data)
});

return r.json();
}


/* ================= TABS ================= */

function openTab(tab,btn){

document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1))
.classList.add('active');

if(btn)btn.classList.add('active');
}


/* ================= LOGIN ================= */

async function login(){

const username=document.getElementById('username').value.trim();
const password=document.getElementById('password').value;
const msg=document.getElementById('loginMsg');
const btn=document.getElementById('loginBtn');

if(!username||!password){
msg.className='msg error';
msg.textContent='Username and password required';
return;
}

btn.disabled=true;
btn.textContent='Logging in...';
msg.textContent='';

try{

const r=await getAPI('login',{username,password});

if(!r.success){
msg.className='msg error';
msg.textContent=r.error||'Login failed';
return;
}

currentUser=r.data;

localStorage.setItem(
'amaya_user',
JSON.stringify(currentUser)
);

showApp();

}catch(e){

msg.className='msg error';
msg.textContent='Connection error';

}finally{

btn.disabled=false;
btn.textContent='Login';

}
}


/* ================= RESTORE ================= */

function restoreLogin(){

try{

const saved=localStorage.getItem('amaya_user');

if(!saved)return;

const user=JSON.parse(saved);

if(user&&user.loggedIn){

currentUser=user;
showApp();

}

}catch(e){

localStorage.removeItem('amaya_user');

}
}


/* ================= SHOW APP ================= */

function showApp(){

document.getElementById('loginPage').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');

document.getElementById('userInfo').textContent=
(currentUser.username||'User')+
(currentUser.role?' • '+currentUser.role:'');

setToday();
loadAllData();

}


/* ================= LOGOUT ================= */

function logout(){

localStorage.removeItem('amaya_user');
currentUser=null;

document.getElementById('app').classList.add('hidden');
document.getElementById('loginPage').classList.remove('hidden');

document.getElementById('username').value='';
document.getElementById('password').value='';

}


/* ================= TODAY ================= */

function setToday(){

const d=new Date();

const y=d.getFullYear();
const m=String(d.getMonth()+1).padStart(2,'0');
const day=String(d.getDate()).padStart(2,'0');

const today=y+'-'+m+'-'+day;

const input=document.getElementById('date');

input.value=today;
input.max=today;

}


/* ================= LOAD ================= */

function loadAllData(){

loadCustomers();
loadAgents();
loadNotes();

}


/* =====================================================
CUSTOMERS
IMPORTANT:
Backend already returns Customer D = Active only.
But frontend also checks Active for safety.
===================================================== */

async function loadCustomers(){

const list=document.getElementById('customerList');

list.innerHTML='<div class="empty">Select a customer</div>';

try{

const r=await getAPI('customers');

if(!r.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(r.error||'Customer loading failed')+
'</div>';

return;

}

customerData=Array.isArray(r.data)?r.data:[];


/* ================= ADD TRANSACTION =================
ONLY ACTIVE CUSTOMERS
============================================== */

const transactionSelect=
document.getElementById('customerSelect');

transactionSelect.innerHTML=
'<option value="">Select Customer</option>';

customerData.forEach(function(c){

/*
D column status must be Active.
Apps Script customers() sends status.
*/

if(String(c.status||'').trim().toLowerCase()!=='active'){
return;
}

const o=document.createElement('option');

o.value=c.customerId;

o.textContent=
c.customerName+
(c.phone?' • '+c.phone:'');

transactionSelect.appendChild(o);

});


/* ================= CUSTOMER PAGE =================
ACTIVE + DUE > 0
============================================== */

const pageSelect=
document.getElementById('customerPageSelect');

pageSelect.innerHTML=
'<option value="">Select Customer</option>';

let totalDue=0;

customerData.forEach(function(c){

if(String(c.status||'').trim().toLowerCase()!=='active'){
return;
}

const due=parseFloat(
String(c.totalDueKD||'0').replace(/,/g,'')
)||0;

totalDue+=due;

if(due<=0)return;

const o=document.createElement('option');

o.value=c.customerId;

o.textContent=
c.customerName+
(c.phone?' • '+c.phone:'');

pageSelect.appendChild(o);

});


document.getElementById('allCustomerDue').innerHTML=
totalDue.toLocaleString('en-US',{
minimumFractionDigits:3,
maximumFractionDigits:3
})+' <span>KD</span>';

}catch(e){

console.error(e);

list.innerHTML=
'<div class="empty">Customer loading error</div>';

}
}


/* ================= CUSTOMER SELECT ================= */

document.getElementById('customerPageSelect')
.addEventListener('change',function(){

const id=this.value;
const list=document.getElementById('customerList');

if(!id){

list.innerHTML='<div class="empty">Select a customer</div>';
return;

}

const customer=customerData.find(function(c){
return String(c.customerId)===String(id);
});

if(!customer){

list.innerHTML='<div class="empty">Customer not found</div>';
return;

}

renderCustomer(customer);

});


/* ================= RENDER CUSTOMER ================= */

function renderCustomer(customer){

const list=document.getElementById('customerList');

list.innerHTML=
'<div class="customer-card">'+
'<div class="customer-row">'+

'<div>'+
'<div class="customer-name">'+
escapeHTML(customer.customerName)+
'</div>'+

'<div class="phone">'+
escapeHTML(customer.phone||'')+
'</div>'+
'</div>'+

'<div class="due">'+
'<div class="due-label">Total Due</div>'+
'<div class="due-value">'+
escapeHTML(customer.totalDueKD||'0.000')+
' <span class="kd-small">KD</span>'+
'</div>'+
'</div>'+

'</div>'+
'</div>';

loadCustomerTransactions(customer.customerId);

}


/* ================= TRANSACTIONS ================= */

async function loadCustomerTransactions(customerId){

const list=document.getElementById('customerList');

const loading=document.createElement('div');

loading.className='loading';
loading.id='customerTxnLoading';
loading.textContent='Loading transactions...';

list.appendChild(loading);

try{

const r=await getAPI(
'customerTransactions',
{customerId:customerId}
);

const l=document.getElementById('customerTxnLoading');

if(l)l.remove();

if(!r.success){

const e=document.createElement('div');
e.className='empty';
e.textContent=r.error||'Unable to load transactions';
list.appendChild(e);

return;
}


/*
Backend transactions() returns:
success:true
data:[...]
*/

const transactions=Array.isArray(r.data)?r.data:[];

if(!transactions.length){

const e=document.createElement('div');

e.className='empty';
e.textContent='No Transaction found';

list.appendChild(e);

return;

}


transactions.forEach(function(t){

const box=document.createElement('div');
box.className='txn';

const top=document.createElement('div');
top.className='txn-top';

const d=document.createElement('div');
d.className='txn-date';
d.textContent=t.date||'';

const amount=document.createElement('div');
amount.className='txn-amount';
amount.textContent=(t.kdAmount||'0.000')+' KD';

top.appendChild(d);
top.appendChild(amount);

const bottom=document.createElement('div');
bottom.className='txn-bottom';

let text=t.type||'';

if(t.note)text+=' • '+t.note;
if(t.bdAmount)text+=' • '+t.bdAmount+' Tk';

bottom.textContent=text;

box.appendChild(top);
box.appendChild(bottom);

list.appendChild(box);

});

}catch(e){

console.error(e);

const l=document.getElementById('customerTxnLoading');

if(l)l.remove();

const error=document.createElement('div');

error.className='empty';
error.textContent='Connection error';

list.appendChild(error);

}
}


/* ================= SEARCH ================= */

document.getElementById('customerSearch')
.addEventListener('input',function(){

const query=this.value.trim().toLowerCase();
const id=document.getElementById('customerPageSelect').value;

if(!id)return;

const c=customerData.find(function(x){
return String(x.customerId)===String(id);
});

if(!c)return;

const match=
String(c.customerName||'').toLowerCase().includes(query)||
String(c.phone||'').toLowerCase().includes(query)||
String(c.customerId||'').toLowerCase().includes(query);

if(!query||match){

renderCustomer(c);

}else{

document.getElementById('customerList').innerHTML=
'<div class="empty">No customer found</div>';

}

});


/* ================= AGENTS ================= */

async function loadAgents(){

try{

const r=await getAPI('agents');

if(!r.success){

renderAgentError(r.error||'Agent loading failed');
return;

}

agentData=Array.isArray(r.data)?r.data:[];

fillAgentSelect(document.getElementById('agentSelect'));
fillAgentSelect(document.getElementById('agentView'));

document.getElementById('agentList').innerHTML=
'<div class="empty">Select an agent</div>';

}catch(e){

renderAgentError('Agent loading error');

}
}


/* ================= FILL AGENTS ================= */

function fillAgentSelect(select){

select.innerHTML='<option value="">Select Agent</option>';

agentData.forEach(function(a){

const o=document.createElement('option');

o.value=a.agentId;
o.textContent=a.agentName;

select.appendChild(o);

});

}


/* ================= AGENT ERROR ================= */

function renderAgentError(text){

document.getElementById('agentList').innerHTML=
'<div class="empty">'+escapeHTML(text)+'</div>';

}


/* ================= AGENT TRANSACTIONS ================= */

async function agentChanged(){

const id=document.getElementById('agentView').value;
const list=document.getElementById('agentList');

if(!id){

list.innerHTML='<div class="empty">Select an agent</div>';
return;

}

list.innerHTML='<div class="loading">Loading transactions...</div>';

try{

const r=await getAPI(
'agentTransactions',
{linkedId:id}
);

if(!r.success){

list.innerHTML=
'<div class="empty">'+
escapeHTML(r.error||'Unable to load transactions')+
'</div>';

return;

}

const transactions=
r.data&&Array.isArray(r.data.transactions)
?r.data.transactions
:[];

if(!transactions.length){

list.innerHTML=
'<div class="empty">No BD transactions found</div>';

return;

}

let html='';

transactions.forEach(function(t){

html+=
'<div class="txn">'+
'<div class="txn-top">'+
'<div class="txn-date">'+escapeHTML(t.date||'')+'</div>'+
'<div class="txn-amount">'+escapeHTML(t.bdAmount||'0')+' Tk</div>'+
'</div>'+
'<div class="txn-bottom">'+
escapeHTML(t.type||'')+
(t.note?' • '+escapeHTML(t.note):'')+
'</div>'+
'</div>';

});

list.innerHTML=html;

}catch(e){

list.innerHTML='<div class="empty">Connection error</div>';

}
}


/* ================= NOTES ================= */

async function loadNotes(){

try{

const r=await getAPI('options');

if(!r.success)return;

notesData={
dueNotes:Array.isArray(r.data.dueNotes)?r.data.dueNotes:[],
paymentNotes:Array.isArray(r.data.paymentNotes)?r.data.paymentNotes:[]
};

setNotes(
transactionType==='বাকি'
?notesData.dueNotes
:notesData.paymentNotes
);

}catch(e){}

}


/* ================= SET NOTES ================= */

function setNotes(notes){

const select=document.getElementById('noteSelect');

select.innerHTML='<option value="">Select Note</option>';

(notes||[]).forEach(function(n){

const o=document.createElement('option');

o.value=n;
o.textContent=n;

select.appendChild(o);

});

}


/* ================= TYPE ================= */

function setType(type){

transactionType=type;

document.getElementById('dueBtn')
.classList.toggle('active',type==='বাকি');

document.getElementById('paymentBtn')
.classList.toggle('active',type==='পেমেন্ট');

setNotes(
type==='বাকি'
?notesData.dueNotes
:notesData.paymentNotes
);

}


/* ================= SAVE ================= */

async function saveTransaction(){

const date=document.getElementById('date').value;
const agentId=document.getElementById('agentSelect').value;
const customerId=document.getElementById('customerSelect').value;

const kd=parseFloat(
document.getElementById('kdAmount').value.replace(/,/g,'')
)||0;

const bd=parseFloat(
document.getElementById('bdAmount').value.replace(/,/g,'')
)||0;

const note=document.getElementById('noteSelect').value;

if(!date){
showSaveError('Date required');
return;
}

if(kd>0&&!customerId){
showSaveError('KD Amount দিলে Customer নির্বাচন করুন');
return;
}

if(bd>0&&!agentId){
showSaveError('BD Amount দিলে Agent নির্বাচন করুন');
return;
}

if(kd<=0&&bd<=0){
showSaveError('KD অথবা BD Amount দিন');
return;
}

const selectedDate=new Date(date+'T00:00:00');

const today=new Date();
today.setHours(0,0,0,0);

if(selectedDate>today){
showSaveError('Future date দেওয়া যাবে না');
return;
}

let agentName='';

if(agentId){

const a=agentData.find(function(x){
return String(x.agentId)===String(agentId);
});

if(a)agentName=a.agentName;

}

let customerName='';

if(customerId){

const c=customerData.find(function(x){
return String(x.customerId)===String(customerId);
});

if(c)customerName=c.customerName;

}

const button=document.getElementById('saveBtn');
const message=document.getElementById('saveMsg');

button.disabled=true;
button.textContent='Saving...';
message.textContent='';
message.className='msg';

try{

const r=await postAPI({

action:'addTransaction',
date:formatDate(date),
customerId:customerId,
customerName:customerName,
agentName:agentName,
kdAmount:kd,
bdAmount:bd,
type:transactionType,
note:note

});

if(!r.success){

showSaveError(r.error||'Save failed');
return;

}

message.className='msg success';
message.textContent='Transaction saved successfully';

document.getElementById('kdAmount').value='';
document.getElementById('bdAmount').value='';

if(customerId){
await loadCustomers();
}

const selectedAgent=
document.getElementById('agentView').value;

if(selectedAgent)agentChanged();

setTimeout(function(){
message.textContent='';
message.className='msg';
},2500);

}catch(e){

showSaveError('Connection error');

}finally{

button.disabled=false;
button.textContent='✅ Save';

}
}


/* ================= ERROR ================= */

function showSaveError(text){

const msg=document.getElementById('saveMsg');

msg.className='msg error';
msg.textContent=text;

}


/* ================= DATE ================= */

function formatDate(value){

const p=value.split('-');

const months=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];

return p[2]+'-'+months[Number(p[1])-1]+'-'+p[0];

}


/* ================= ESCAPE ================= */

function escapeHTML(value){

return String(
value===null||value===undefined?'':value
)
