<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f5f7fa;color:#172033;font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{width:100%;max-width:520px;margin:auto;min-height:100vh}

/* HEADER */
.header{
 background:#fff;padding:14px 15px;border-bottom:1px solid #e7e9ed;
 position:sticky;top:0;z-index:20
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:19px;font-weight:800}
.tagline{font-size:11px;color:#858e9d;margin-top:4px}
.logout{
 border:0;background:#eef0f3;color:#303744;border-radius:9px;
 padding:8px 11px;font-size:11px;font-weight:700
}

/* TABS */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:11px 14px 5px}
.tab{
 border:0;height:43px;border-radius:11px;background:#e7ebf0;
 color:#687284;font-size:12px;font-weight:800
}
.tab.active{background:#111827;color:#fff}

/* CONTENT */
.content{padding:10px 14px 25px}
.panel{display:none}
.panel.active{display:block}
.card{
 background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
 box-shadow:0 3px 15px rgba(0,0,0,.045)
}

/* FORM */
.field{margin-bottom:13px}
.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,select{
 width:100%;height:47px;border:1px solid #dfe3e9;border-radius:11px;
 background:#fff;padding:0 12px;outline:0;color:#172033
}
input:focus,select:focus{border-color:#111827}
select:disabled{background:#f1f3f6;color:#4b5563;opacity:1;cursor:not-allowed}
.amount{font-size:17px!important;font-weight:700}

.amount-row,.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-row{margin:3px 0 13px}
.type-btn{
 height:44px;border:1px solid #dfe3e9;border-radius:11px;
 background:#fff;font-weight:800
}
.type-btn.active{background:#111827;color:#fff;border-color:#111827}

.save{
 width:100%;height:49px;border:0;border-radius:12px;
 background:#111827;color:#fff;font-weight:800
}
.save:disabled{opacity:.55;cursor:not-allowed}

.msg{font-size:12px;margin-top:9px;text-align:center}
.error{color:#d33131}
.success{color:#16824c}

/* CUSTOMER */
.customer-filter-row{
 display:grid;grid-template-columns:.8fr 1.2fr;gap:7px;margin-bottom:9px
}
.customer-filter-row input,
.customer-filter-row select{
 height:42px;font-size:12px;padding:0 9px
}

.total-due-box{
 background:#111827;border-radius:12px;padding:9px 12px;
 margin-bottom:10px;text-align:left
}
.total-due-label{font-size:10px;color:#c8ced8;margin-bottom:2px}
.total-due-value{font-size:17px;font-weight:800;color:#fff}
.total-due-value span{font-size:9px;font-weight:700}

.list{display:flex;flex-direction:column;gap:8px}
.customer-card{
 background:#fff;border-radius:11px;padding:9px 11px;
 box-shadow:0 2px 9px rgba(0,0,0,.04);border:1px solid #edf0f3
}
.customer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.customer-info{min-width:0;flex:1}
.customer-name{
 font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.phone{font-size:10px;color:#858e9d;margin-top:2px}
.due{text-align:right;white-space:nowrap}
.due-label{font-size:9px;color:#8992a0}
.due-value{font-size:14px;font-weight:800;margin-top:1px}
.kd-small{font-size:9px}

#customerList{
 max-height:calc(100vh - 300px);overflow-y:auto;
 -webkit-overflow-scrolling:touch;padding-right:2px
}

/* TRANSACTION */
.txn{
 background:#fff;border-radius:11px;padding:10px;
 box-shadow:0 2px 9px rgba(0,0,0,.04)
}
.txn-top{display:flex;justify-content:space-between;gap:8px}
.txn-date{font-size:11px;color:#858e9d}
.txn-amount{font-size:13px;font-weight:800}
.txn-bottom{font-size:10px;color:#737d8d;margin-top:4px}

/* AGENT */
.agent-filter-row{
 display:grid;grid-template-columns:.72fr 1fr 1.28fr;gap:6px;margin-bottom:9px
}
.agent-filter-row select{
 height:42px;font-size:11px;padding:0 7px;min-width:0
}
.agent-summary{
 display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px
}
.agent-summary-box{
 background:#fff;border-radius:11px;padding:8px 10px;
 border:1px solid #edf0f3;box-shadow:0 2px 8px rgba(0,0,0,.035)
}
.agent-summary-label{font-size:9px;color:#8992a0;margin-bottom:2px}
.agent-summary-value{font-size:15px;font-weight:800;line-height:1.2}
.agent-summary-value span{font-size:9px;font-weight:700}
.agent-balance{text-align:left}
.agent-sales{text-align:right}

#agentList{
 max-height:calc(100vh - 265px);overflow-y:auto;
 -webkit-overflow-scrolling:touch;padding-right:2px
}

/* LOGIN */
.login-page{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
}
.login-box{
 width:100%;max-width:390px;background:#fff;border-radius:21px;
 padding:25px 21px;box-shadow:0 8px 30px rgba(0,0,0,.06)
}
.login-title{font-size:24px;font-weight:800}
.login-sub{font-size:13px;color:#8992a0;margin:5px 0 23px}
.loading,.empty{padding:28px 10px;text-align:center;color:#8992a0;font-size:13px}

@media(max-width:360px){
 .tabs{gap:5px}
 .tab{font-size:11px}
 .amount-row,.customer-filter-row{gap:6px}
 .customer-filter-row input,.customer-filter-row select{font-size:11px;padding:0 7px}
 .agent-filter-row{gap:4px}
 .agent-filter-row select{font-size:10px;padding:0 5px}
 .agent-summary-value{font-size:14px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
<div class="login-box">

<div class="login-title">Amaya Exchange</div>
<div class="login-sub">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>

<div class="field">
<label class="label">Username</label>
<input id="username" type="text" autocomplete="username">
</div>

<div class="field">
<label class="label">Password</label>
<input id="password" type="password" autocomplete="current-password">
</div>

<button id="loginBtn" class="save" onclick="login()">Login</button>
<div id="loginMsg" class="msg"></div>

</div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<div class="header">
<div class="header-row">
<div>
<div class="logo">Amaya Exchange</div>
<div class="tagline">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>
</div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="openTab('transaction',this)">Add Transaction</button>
<button class="tab" onclick="openTab('customer',this)">Customer</button>
<button class="tab" onclick="openTab('agent',this)">Agent</button>
</div>

<div class="content">

<!-- TRANSACTION -->
<section id="panelTransaction" class="panel active">
<div class="card">

<div style="font-size:16px;font-weight:800;margin-bottom:14px">
Add Transaction
</div>

<div class="field">
<label class="label">📅 Date</label>
<input id="date" type="date">
</div>

<div class="field">
<label class="label">◾ Agent</label>
<select id="agentSelect">
<option value="">Select Agent</option>
</select>
</div>

<div class="field">
<label class="label">🧒 Customer</label>
<select id="customerSelect">
<option value="">Select Customer</option>
</select>
</div>

<div class="amount-row">

<div class="field">
<label class="label">💵 KD Amount</label>
<input id="kdAmount" class="amount" type="text" inputmode="decimal" placeholder="0.000">
</div>

<div class="field">
<label class="label">💳 BD Amount</label>
<input id="bdAmount" class="amount" type="text" inputmode="numeric" placeholder="0">
</div>

</div>

<div class="type-row">
<button id="dueBtn" class="type-btn active" onclick="setType('বাকি')">+ বাকি</button>
<button id="paymentBtn" class="type-btn" onclick="setType('পেমেন্ট')">- পেমেন্ট</button>
</div>

<div class="field">
<label class="label">Note</label>
<select id="noteSelect">
<option value="">Select Note</option>
</select>
</div>

<button id="saveBtn" class="save" onclick="saveTransaction()">✅ Save</button>
<div id="saveMsg" class="msg"></div>

</div>
</section>

<!-- CUSTOMER -->
<section id="panelCustomer" class="panel">

<div class="card">

<div class="customer-filter-row">

<input id="customerSearch" type="search" placeholder="🔍 Search..." autocomplete="off">

<select id="customerPageSelect">
<option value="">Select Customer</option>
</select>

</div>

<div class="total-due-box">
<div class="total-due-label">Total Due</div>
<div id="allCustomerDue" class="total-due-value">
0.000 <span>KD</span>
</div>
</div>

</div>

<div id="customerList" class="list">
<div class="empty">Select a customer</div>
</div>

</section>

<!-- AGENT -->
<section id="panelAgent" class="panel">

<div class="agent-filter-row">
<select id="agentYear"></select>
<select id="agentMonth"></select>
<select id="agentView" onchange="agentChanged()">
<option value="">Agent</option>
</select>
</div>

<div class="agent-summary">

<div class="agent-summary-box agent-balance">
<div class="agent-summary-label">Current Balance</div>
<div id="agentCurrentBalance" class="agent-summary-value">
0 <span>Tk</span>
</div>
</div>

<div class="agent-summary-box agent-sales">
<div class="agent-summary-label">Monthly Sales</div>
<div id="agentMonthlySales" class="agent-summary-value">
0 <span>Tk</span>
</div>
</div>

</div>

<div id="agentList" class="list">
<div class="empty">Select an agent</div>
</div>

</section>

</div>
</div>

<script>

/* API */
const API='https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec';

/* STATE */
let currentUser=null;
let transactionType='বাকি';
let customerData=[];
let agentData=[];
let notesData={dueNotes:[],paymentNotes:[]};
let currentAgentTransactions=[];

/* API GET */
async function getAPI(action,params={}){
 const query=new URLSearchParams({action});
 Object.keys(params).forEach(k=>{
  if(params[k]!==undefined&&params[k]!==null&&params[k]!=='')
   query.set(k,params[k]);
 });
 const response=await fetch(API+'?'+query.toString(),{
  method:'GET',
  cache:'no-store'
 });
 return response.json();
}

/* API POST */
async function postAPI(data){
 const response=await fetch(API,{
  method:'POST',
  headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify(data)
 });
 return response.json();
}

/* TABS */
function openTab(tab,button){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));

 const panel=document.getElementById(
  'panel'+tab.charAt(0).toUpperCase()+tab.slice(1)
 );

 if(panel&&!panel.classList.contains('hidden'))
  panel.classList.add('active');

 if(button&&!button.classList.contains('hidden'))
  button.classList.add('active');
}

/* LOGIN */
async function login(){

 const username=document.getElementById('username').value.trim();
 const password=document.getElementById('password').value;
 const msg=document.getElementById('loginMsg');
 const btn=document.getElementById('loginBtn');

 if(!username||!password){
  msg.className='msg error';
  msg.textContent='Username and password required';
  return;
 }

 btn.disabled=true;
 btn.textContent='Logging in...';
 msg.textContent='';

 try{

  const result=await getAPI('login',{username,password});

  if(!result.success){
   msg.className='msg error';
   msg.textContent=result.error||'Login failed';
   return;
  }

  currentUser=result.data;
  localStorage.setItem('amaya_user',JSON.stringify(currentUser));
  showApp();

 }catch(e){

  msg.className='msg error';
  msg.textContent='Connection error';

 }finally{

  btn.disabled=false;
  btn.textContent='Login';

 }
}

/* RESTORE */
function restoreLogin(){

 try{

  const saved=localStorage.getItem('amaya_user');
  if(!saved)return;

  const user=JSON.parse(saved);

  if(user&&user.loggedIn){
   currentUser=user;
   showApp();
  }

 }catch(e){

  localStorage.removeItem('amaya_user');

 }
}

/* SHOW APP */
function showApp(){

 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');

 setToday();
 setupAgentDateFilters();
 applyRoleAccess();
 loadAllData();
}

/* ROLE */
function getRole(){
 return String(currentUser?.role||'').trim().toLowerCase();
}

/* ROLE ACCESS */
function applyRoleAccess(){

 const role=getRole();

 const tabs=document.querySelectorAll('.tab');
 const transactionTab=tabs[0];
 const customerTab=tabs[1];
 const agentTab=tabs[2];

 const transactionPanel=document.getElementById('panelTransaction');
 const customerPanel=document.getElementById('panelCustomer');
 const agentPanel=document.getElementById('panelAgent');

 /* RESET */
 [transactionTab,customerTab,agentTab].forEach(x=>x.classList.remove('hidden'));
 [transactionPanel,customerPanel,agentPanel].forEach(x=>x.classList.remove('hidden'));

 /* ADMIN */
 if(role==='admin'){
  openTab('transaction',transactionTab);
  return;
 }

 /* AGENT */
 if(role==='agent'){

  transactionTab.classList.add('hidden');
  customerTab.classList.add('hidden');
  agentTab.classList.add('hidden');

  transactionPanel.classList.add('hidden');
  customerPanel.classList.add('hidden');

  agentPanel.classList.remove('hidden');
  agentPanel.classList.add('active');

  const agentView=document.getElementById('agentView');

  agentView.innerHTML='';

  const option=document.createElement('option');
  option.value=currentUser.linkedId||'';
  option.textContent=currentUser.agentName||currentUser.name||'My Agent';

  agentView.appendChild(option);
  agentView.value=currentUser.linkedId||'';
  agentView.disabled=true;

  if(currentUser.linkedId)agentChanged();

  return;
 }

 /* VIEWER */
 if(role==='viewer'||role==='viewar'){

  transactionTab.classList.add('hidden');
  transactionPanel.classList.add('hidden');

  customerTab.classList.remove('hidden');
  agentTab.classList.remove('hidden');

  customerPanel.classList.remove('hidden');
  agentPanel.classList.remove('hidden');

  openTab('customer',customerTab);
  return;
 }

 /* UNKNOWN */
 [transactionTab,customerTab,agentTab].forEach(x=>x.classList.add('hidden'));
 [transactionPanel,customerPanel,agentPanel].forEach(x=>x.classList.add('hidden'));
}

/* LOGOUT */
function logout(){

 currentUser=null;
 localStorage.removeItem('amaya_user');

 document.getElementById('app').classList.add('hidden');
 document.getElementById('loginPage').classList.remove('hidden');

 document.getElementById('username').value='';
 document.getElementById('password').value='';
 document.getElementById('loginMsg').textContent='';
}

/* TODAY */
function setToday(){

 const input=document.getElementById('date');
 const d=new Date();

 const today=
 d.getFullYear()+'-'+
 String(d.getMonth()+1).padStart(2,'0')+'-'+
 String(d.getDate()).padStart(2,'0');

 input.value=today;
 input.max=today;
}

/* AGENT FILTERS */
function setupAgentDateFilters(){

 const yearSelect=document.getElementById('agentYear');
 const monthSelect=document.getElementById('agentMonth');

 const now=new Date();
 const currentYear=now.getFullYear();
 const currentMonth=now.getMonth()+1;

 yearSelect.innerHTML='';

 for(let y=currentYear-5;y<=currentYear;y++){

  const option=document.createElement('option');
  option.value=y;
  option.textContent=y;

  if(y===currentYear)option.selected=true;

  yearSelect.appendChild(option);
 }

 const months=[
  'January','February','March','April','May','June',
  'July','August','September','October','November','December'
 ];

 monthSelect.innerHTML='';

 months.forEach((month,i)=>{

  const option=document.createElement('option');
  option.value=i+1;
  option.textContent=month;

  if(i+1===currentMonth)option.selected=true;

  monthSelect.appendChild(option);
 });

 yearSelect.onchange=()=>{
  if(document.getElementById('agentView').value)
   renderAgentTransactions();
 };

 monthSelect.onchange=()=>{
  if(document.getElementById('agentView').value)
   renderAgentTransactions();
 };
}

/* LOAD ALL */
function loadAllData(){
 loadCustomers();
 loadAgents();
 loadNotes();
}

/* CUSTOMERS */
async function loadCustomers(){

 const list=document.getElementById('customerList');
 list.innerHTML='<div class="empty">Select a customer</div>';

 try{

  const result=await getAPI('customers');

  if(!result.success){
   list.innerHTML='<div class="empty">'+escapeHTML(result.error||'Customer loading failed')+'</div>';
   return;
  }

  customerData=Array.isArray(result.data)?result.data:[];

  const transactionSelect=document.getElementById('customerSelect');

  transactionSelect.innerHTML='<option value="">Select Customer</option>';

  let totalDue=0;

  customerData.forEach(customer=>{

   if(!isActive(customer))return;

   const option=document.createElement('option');
   option.value=customer.customerId;
   option.textContent=customer.customerName;
   transactionSelect.appendChild(option);

   totalDue+=number(customer.totalDueKD);
  });

  document.getElementById('allCustomerDue').innerHTML=
   totalDue.toLocaleString('en-US',{
    minimumFractionDigits:3,
    maximumFractionDigits:3
   })+' <span>KD</span>';

  updateCustomerDropdown();

 }catch(e){

  list.innerHTML='<div class="empty">Customer loading error</div>';

 }
}

/* ACTIVE */
function isActive(customer){

 const status=String(
  customer.status||
  customer.Status||
  customer.active||
  customer.Active||
  ''
 ).trim().toLowerCase();

 return status==='active';
}

/* NUMBER */
function number(value){
 return parseFloat(String(value||'0').replace(/,/g,''))||0;
}

/* CUSTOMER DROPDOWN */
function updateCustomerDropdown(){

 const select=document.getElementById('customerPageSelect');
 const search=document.getElementById('customerSearch').value.trim().toLowerCase();
 const oldValue=select.value;

 select.innerHTML='<option value="">Select Customer</option>';

 customerData.forEach(customer=>{

  if(!isActive(customer))return;
  if(number(customer.totalDueKD)<=0)return;

  const name=String(customer.customerName||'').toLowerCase();
  const phone=String(customer.phone||'').toLowerCase();
  const id=String(customer.customerId||'').toLowerCase();

  if(search&&!name.includes(search)&&!phone.includes(search)&&!id.includes(search))
   return;

  const option=document.createElement('option');
  option.value=customer.customerId;
  option.textContent=customer.customerName;

  select.appendChild(option);
 });

 if(oldValue&&[...select.options].some(o=>o.value===oldValue))
  select.value=oldValue;
}

/* CUSTOMER SELECT */
document.getElementById('customerPageSelect').addEventListener('change',function(){

 const id=this.value;
 const list=document.getElementById('customerList');

 if(!id){
  list.innerHTML='<div class="empty">Select a customer</div>';
  return;
 }

 const customer=customerData.find(x=>String(x.customerId)===String(id));

 if(!customer){
  list.innerHTML='<div class="empty">Customer not found</div>';
  return;
 }

 renderCustomers(customer);
});

/* CUSTOMER SEARCH */
document.getElementById('customerSearch').addEventListener('input',function(){

 const currentId=document.getElementById('customerPageSelect').value;

 updateCustomerDropdown();

 const select=document.getElementById('customerPageSelect');

 if(currentId&&[...select.options].some(o=>o.value===currentId))
  select.value=currentId;
});

/* RENDER CUSTOMER */
function renderCustomers(customer){

 const list=document.getElementById('customerList');

 list.innerHTML=
 '<div class="customer-card">'+
 '<div class="customer-row">'+
 '<div class="customer-info">'+
 '<div class="customer-name">'+escapeHTML(customer.customerName)+'</div>'+
 '<div class="phone">'+escapeHTML(customer.phone||'')+'</div>'+
 '</div>'+
 '<div class="due">'+
 '<div class="due-label">Due Amount</div>'+
 '<div class="due-value">'+escapeHTML(customer.totalDueKD||'0.000')+
 ' <span class="kd-small">KD</span></div>'+
 '</div>'+
 '</div>'+
 '</div>';

 loadCustomerTransactions(customer.customerId);
}

/* CUSTOMER TRANSACTIONS */
async function loadCustomerTransactions(customerId){

 const list=document.getElementById('customerList');

 const loading=document.createElement('div');
 loading.id='customerTxnLoading';
 loading.className='loading';
 loading.textContent='Loading transactions...';

 list.appendChild(loading);

 try{

  const result=await getAPI('customerTransactions',{customerId});

  loading.remove();

  if(!result.success){
   addEmpty(list,result.error||'Unable to load transactions');
   return;
  }

  const transactions=Array.isArray(result.data)
   ?result.data
   :(result.data&&Array.isArray(result.data.transactions)
    ?result.data.transactions:[]);

  if(!transactions.length){
   addEmpty(list,'No Transaction found');
   return;
  }

  transactions.forEach(t=>{

   const txn=document.createElement('div');
   txn.className='txn';

   const top=document.createElement('div');
   top.className='txn-top';

   const date=document.createElement('div');
   date.className='txn-date';
   date.textContent=t.date||'';

   const amount=document.createElement('div');
   amount.className='txn-amount';
   amount.textContent=(t.kdAmount||'0.000')+' KD';

   top.append(date,amount);

   const bottom=document.createElement('div');
   bottom.className='txn-bottom';

   let text=t.type||'';

   if(t.note)text+=' • '+t.note;
   if(t.bdAmount)text+=' • '+t.bdAmount+' Tk';

   bottom.textContent=text;

   txn.append(top,bottom);
   list.appendChild(txn);
  });

 }catch(e){

  if(loading.isConnected)loading.remove();
  addEmpty(list,'Connection error');

 }
}

/* AGENTS */
async function loadAgents(){

 try{

  const result=await getAPI('agents');

  if(!result.success){
   renderAgentError(result.error||'Agent loading failed');
   return;
  }

  agentData=Array.isArray(result.data)?result.data:[];

  fillAgentSelect(document.getElementById('agentSelect'));

  if(getRole()==='agent'){

   const agentView=document.getElementById('agentView');
   const linkedId=String(currentUser.linkedId||'');

   agentView.innerHTML='';

   const found=agentData.find(
    a=>String(a.agentId)===linkedId
   );

   const option=document.createElement('option');
   option.value=linkedId;
   option.textContent=found
    ?found.agentName
    :(currentUser.agentName||currentUser.name||'My Agent');

   agentView.appendChild(option);
   agentView.value=linkedId;
   agentView.disabled=true;

   if(linkedId)agentChanged();

  }else{

   fillAgentSelect(document.getElementById('agentView'),true);

  }

  document.getElementById('agentList').innerHTML=
   '<div class="empty">Select an agent</div>';

 }catch(e){

  renderAgentError('Agent loading error');

 }
}

/* AGENT SELECT */
function fillAgentSelect(select,isView=false){

 select.innerHTML=isView
  ?'<option value="">Agent</option>'
  :'<option value="">Select Agent</option>';

 agentData.forEach(agent=>{

  const option=document.createElement('option');

  option.value=agent.agentId;
  option.textContent=agent.agentName;

  select.appendChild(option);
 });
}

/* AGENT ERROR */
function renderAgentError(message){
 document.getElementById('agentList').innerHTML=
  '<div class="empty">'+escapeHTML(message)+'</div>';
}

/* NOTES */
async function loadNotes(){

 try{

  const result=await getAPI('options');
  if(!result.success)return;

  notesData={
   dueNotes:Array.isArray(result.data.dueNotes)?result.data.dueNotes:[],
   paymentNotes:Array.isArray(result.data.paymentNotes)?result.data.paymentNotes:[]
  };

  setNotes(
   transactionType==='বাকি'
   ?notesData.dueNotes
   :notesData.paymentNotes
  );

 }catch(e){}
}

/* SET NOTES */
function setNotes(notes){

 const select=document.getElementById('noteSelect');
 select.innerHTML='';

 if(!notes||!notes.length){
  select.innerHTML='<option value="">Select Note</option>';
  return;
 }

 notes.forEach((note,i)=>{

  const option=document.createElement('option');

  option.value=note;
  option.textContent=note;

  if(i===0)option.selected=true;

  select.appendChild(option);
 });
}

/* TYPE */
function setType(type){

 transactionType=type;

 document.getElementById('dueBtn').classList.toggle('active',type==='বাকি');
 document.getElementById('paymentBtn').classList.toggle('active',type==='পেমেন্ট');

 setNotes(
  type==='বাকি'
  ?notesData.dueNotes
  :notesData.paymentNotes
 );
}

/* NORMALIZE */
function normalizeType(value){

 return String(value||'')
 .trim()
 .toLowerCase()
 .replace(/\s+/g,' ')
 .replace(/^[+\-]\s*/,'')
 .trim();
}

/* DUE */
function isDueTransaction(t){

 const type=normalizeType(
  t.type||t.Type||t.transactionType||t.TransactionType
 );

 return type==='বাকি'||type==='due'||type==='due amount';
}

/* PAYMENT */
function isPaymentTransaction(t){

 const type=normalizeType(
  t.type||t.Type||t.transactionType||t.TransactionType
 );

 return type==='পেমেন্ট'||
        type==='payment'||
        type==='জমা'||
        type==='paid'||
        type==='payment amount';
}

/* BD */
function getBDAmount(t){
 return number(
  t.bdAmount!==undefined&&t.bdAmount!==''
  ?t.bdAmount
  :(t.amountBD!==undefined&&t.amountBD!==''
   ?t.amountBD:t.bd)
 );
}

/* AGENT CHANGE */
async function agentChanged(){

 const agentId=document.getElementById('agentView').value;
 const list=document.getElementById('agentList');

 if(!agentId){

  currentAgentTransactions=[];

  setAgentNumbers(0,0);

  list.innerHTML='<div class="empty">Select an agent</div>';

  return;
 }

 list.innerHTML='<div class="loading">Loading transactions...</div>';

 try{

  const result=await getAPI('agentTransactions',{
   linkedId:agentId,
   username:currentUser?.username||'',
   role:currentUser?.role||''
  });

  if(!result.success){
   list.innerHTML='<div class="empty">'+
    escapeHTML(result.error||'Unable to load transactions')+
    '</div>';
   return;
  }

  currentAgentTransactions=
   result.data&&Array.isArray(result.data.transactions)
   ?result.data.transactions
   :Array.isArray(result.data)
    ?result.data:[];

  calculateAgentSummary();
  renderAgentTransactions();

 }catch(e){

  currentAgentTransactions=[];
  setAgentNumbers(0,0);
  list.innerHTML='<div class="empty">Connection error</div>';

 }
}

/* AGENT SUMMARY */
function calculateAgentSummary(){

 let balance=0;
 let sales=0;

 const year=Number(document.getElementById('agentYear').value);
 const month=Number(document.getElementById('agentMonth').value);

 currentAgentTransactions.forEach(t=>{

  const amount=getBDAmount(t);

  if(isDueTransaction(t))balance+=amount;
  else if(isPaymentTransaction(t))balance-=amount;

  if(isDueTransaction(t)){

   const info=parseTransactionDate(
    t.date||t.Date||t.transactionDate||t.TransactionDate
   );

   if(info&&info.year===year&&info.month===month)
    sales+=amount;
  }
 });

 setAgentNumbers(balance,sales);
}

/* AGENT NUMBERS */
function setAgentNumbers(balance,sales){

 document.getElementById('agentCurrentBalance').innerHTML=
  formatNumber(balance)+' <span>Tk</span>';

 document.getElementById('agentMonthlySales').innerHTML=
  formatNumber(sales)+' <span>Tk</span>';
}

/* RENDER AGENT */
function renderAgentTransactions(){

 const list=document.getElementById('agentList');

 if(!currentAgentTransactions.length){

  calculateAgentSummary();
  list.innerHTML='<div class="empty">No BD transactions found</div>';
  return;
 }

 const year=Number(document.getElementById('agentYear').value);
 const month=Number(document.getElementById('agentMonth').value);

 const filtered=currentAgentTransactions.filter(t=>{

  const info=parseTransactionDate(
   t.date||t.Date||t.transactionDate||t.TransactionDate
  );

  return info&&info.year===year&&info.month===month;
 });

 calculateAgentSummary();

 if(!filtered.length){

  list.innerHTML='<div class="empty">No transaction for this month</div>';
  return;
 }

 list.innerHTML='';

 filtered.forEach(t=>{

  const txn=document.createElement('div');
  txn.className='txn';

  const top=document.createElement('div');
  top.className='txn-top';

  const date=document.createElement('div');
  date.className='txn-date';
  date.textContent=t.date||t.Date||'';

  const amount=document.createElement('div');
  amount.className='txn-amount';
  amount.textContent=formatNumber(getBDAmount(t))+' Tk';

  top.append(date,amount);

  const bottom=document.createElement('div');
  bottom.className='txn-bottom';

  let text=t.type||'';

  if(t.note)text+=' • '+t.note;

  bottom.textContent=text;

  txn.append(top,bottom);
  list.appendChild(txn);
 });
}

/* DATE */
function parseTransactionDate(value){

 if(!value)return null;

 const str=String(value).trim();

 let match=str.match(/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{4})$/);

 if(match){

  const months={
   jan:1,feb:2,mar:3,apr:4,may:5,jun:6,
   jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
  };

  const month=months[match[2].toLowerCase()];

  if(month)
   return{year:Number(match[3]),month};
 }

 match=str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);

 if(match)
  return{year:Number(match[1]),month:Number(match[2])};

 match=str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);

 if(match)
  return{year:Number(match[3]),month:Number(match[2])};

 const date=new Date(str);

 if(!isNaN(date.getTime()))
  return{year:date.getFullYear(),month:date.getMonth()+1};

 return null;
}

/* FORMAT */
function formatNumber(value){

 return Number(value||0).toLocaleString('en-US',{
  minimumFractionDigits:0,
  maximumFractionDigits:0
 });
}

/* SAVE */
async function saveTransaction(){

 if(getRole()!=='admin'){
  showSaveError('Access denied');
  return;
 }

 const date=document.getElementById('date').value;
 const agentId=document.getElementById('agentSelect').value;
 const customerId=document.getElementById('customerSelect').value;

 const kd=number(document.getElementById('kdAmount').value);
 const bd=number(document.getElementById('bdAmount').value);

 const note=document.getElementById('noteSelect').value;

 if(!date){
  showSaveError('Date required');
  return;
 }

 if(kd>0&&!customerId){
  showSaveError('KD Amount দিলে Customer নির্বাচন করুন');
  return;
 }

 if(bd>0&&!agentId){
  showSaveError('BD Amount দিলে Agent নির্বাচন করুন');
  return;
 }

 if(kd<=0&&bd<=0){
  showSaveError('KD অথবা BD Amount দিন');
  return;
 }

 const selectedDate=new Date(date+'T00:00:00');
 const today=new Date();

 today.setHours(0,0,0,0);

 if(selectedDate>today){
  showSaveError('Future date দেওয়া যাবে না');
  return;
 }

 const agent=agentData.find(
  a=>String(a.agentId)===String(agentId)
 );

 const customer=customerData.find(
  c=>String(c.customerId)===String(customerId)
 );

 const button=document.getElementById('saveBtn');
 const message=document.getElementById('saveMsg');

 button.disabled=true;
 button.textContent='Saving...';
 message.textContent='';
 message.className='msg';

 try{

  const result=await postAPI({

   action:'addTransaction',

   username:currentUser?.username||'',
   role:currentUser?.role||'',

   date:formatDate(date),

   customerId,
   customerName:customer?.customerName||'',

   agentName:agent?.agentName||'',

   kdAmount:kd,
   bdAmount:bd,

   type:transactionType,
   note

  });

  if(!result.success){
   showSaveError(result.error||'Save failed');
   return;
  }

  message.className='msg success';
  message.textContent='Transaction saved successfully';

  document.getElementById('kdAmount').value='';
  document.getElementById('bdAmount').value='';

  await loadCustomers();

  const selectedAgent=document.getElementById('agentView').value;

  if(selectedAgent)
   await agentChanged();

  setTimeout(()=>{
   message.textContent='';
   message.className='msg';
  },2500);

 }catch(e){

  showSaveError('Connection error');

 }finally{

  button.disabled=false;
  button.textContent='✅ Save';

 }
}

/* ERROR */
function showSaveError(text){

 const message=document.getElementById('saveMsg');

 message.className='msg error';
 message.textContent=text;
}

/* DATE FORMAT */
function formatDate(value){

 const parts=value.split('-');

 const months=[
  'Jan','Feb','Mar','Apr','May','Jun',
  'Jul','Aug','Sep','Oct','Nov','Dec'
 ];

 return parts[2]+'-'+months[Number(parts[1])-1]+'-'+parts[0];
}

/* EMPTY */
function addEmpty(parent,text){

 const box=document.createElement('div');
 box.className='empty';
 box.textContent=text;
 parent.appendChild(box);
}

/* ESCAPE */
function escapeHTML(value){

 return String(value===null||value===undefined?'':value)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');
}

/* ENTER LOGIN */
document.getElementById('password').addEventListener('keydown',e=>{
 if(e.key==='Enter')login();
});

/* START */
restoreLogin();

</script>
